  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:16px;
  padding:16px 18px;
  border-bottom:1px solid #dde6ef;
}
.reference-modal-title { font-size:20px; font-weight:bold; }
.reference-modal-actions { display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:flex-end; }
.reference-modal-subtitle { margin-top:2px; color:#555; }
.reference-modal-body {
  padding:16px 18px 18px;
  overflow:auto;
}
.deletion-review-panel { width:min(860px,100%); }
.deletion-review-list { display:grid; gap:10px; }
.deletion-review-item {
  display:grid;
  grid-template-columns:auto minmax(0,1fr);
  gap:10px;
  align-items:start;
  padding:12px;
  border:1px solid #dde6ef;
  border-radius:6px;
  background:#fff;
}
.deletion-review-item input { margin-top:3px; }
.deletion-review-target { margin-bottom:4px; }
.deletion-review-actions { margin-top:16px; }
.deletion-report > h1 { margin-top:0; }
.deletion-report-item { break-inside:avoid; page-break-inside:avoid; border-top:1px solid #999; margin-top:16px; padding-top:12px; }
.deletion-report-item h2 { font-size:16px; }
.deletion-report-decision { margin-top:14px; }
.deletion-report-notes { min-height:54px; border-bottom:1px solid #777; }
.reference-group { margin-top:14px; }
.reference-group:first-child { margin-top:0; }
.reference-group-title { font-weight:bold; margin-bottom:6px; }
.reference-list { margin:0; padding-left:22px; }
.reference-match { margin-bottom:10px; }
.reference-match:last-child { margin-bottom:0; }
.reference-match-name { font-weight:bold; }
.reference-match-categories { color:#555; font-size:14px; }
.reference-match-snippet { margin-top:3px; color:#333; font-size:14px; }
.reference-empty { margin:0; color:#555; }
.sharepoint-publish-body p:first-child { margin-top:0; }
.sharepoint-publish-body .button {
  display:inline-block;
  margin-right:8px;
  text-decoration:none;
}
.sharepoint-publish-steps { margin:10px 0 16px 24px; padding:0; }
.sharepoint-publish-steps li { margin:6px 0; }
.sharepoint-publish-status {
  display:flex;
  gap:10px;
  align-items:center;
  margin-bottom:12px;
  font-size:20px;
  font-weight:bold;
}
.sharepoint-publish-success { color:#176b35; }
.sharepoint-publish-error {
  padding:10px 12px;
  border-left:4px solid #aa0000;
  background:#fff2f2;
  color:#7a0000;
}
.sharepoint-publish-warning {
  margin:12px 0;
  padding:10px 12px;
  border-left:4px solid #a86600;
  background:#fff8e8;
}
.sharepoint-publish-warning p { margin:8px 0 0; }
.sharepoint-publish-note { color:var(--muted-text-color); }
.sharepoint-publish-url-label {
  display:block;
  margin:12px 0 5px;
  font-weight:700;
}
.sharepoint-publish-url {
  width:100%;
  min-height:92px;
  box-sizing:border-box;
  margin:0 0 10px;
  padding:10px 12px;
  resize:vertical;
  font:inherit;
}
.sharepoint-publish-destination {
  display:grid;
  gap:8px;
  margin:12px 0 18px;
  padding:12px 14px;
  border:1px solid #c8d6e6;
  border-radius:8px;
  background:#f7fbff;
}
.sharepoint-publish-destination div {
  display:grid;
  grid-template-columns:minmax(120px, auto) minmax(0, 1fr);
  gap:12px;
}
.sharepoint-publish-destination dt { font-weight:700; }
.sharepoint-publish-destination dd { margin:0; overflow-wrap:anywhere; }
.sharepoint-publish-spinner {
  width:18px;
  height:18px;
  box-sizing:border-box;
  border:3px solid #c5d4e2;
  border-top-color:#003366;
  border-radius:50%;
  animation:sharepoint-publish-spin .8s linear infinite;
}
@keyframes sharepoint-publish-spin { to { transform:rotate(360deg); } }
.admin-help-content .admin-help-setup {
  margin:0 0 14px;
  padding:12px 14px;
  border:1px solid #c8d6e5;
  border-left:4px solid #003366;
  border-radius:6px;
  background:#f7fbff;
}
.admin-help-content h3 { margin:0 0 8px; }
.admin-help-content details {
  border:1px solid #dde6ef;
  border-radius:6px;
  margin-top:8px;
  background:#fff;
}
.admin-help-content summary {
  cursor:pointer;
  font-weight:bold;
  padding:10px 12px;
}
.admin-help-content .admin-help-section-body {
  border-top:1px solid #dde6ef;
  padding:10px 12px 12px;
}
.admin-help-content p { margin:0 0 10px; }
.admin-help-content p:last-child { margin-bottom:0; }
.admin-help-content ol,
.admin-help-content ul { margin:8px 0 0 22px; padding:0; }
.admin-help-content li { margin:4px 0; }
.reference-modal-body kbd {
  padding:1px 5px;
  border:1px solid #b8c3ce;
  border-radius:4px;
  background:#f5f7fa;
  font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size:.9em;
}
.admin-training-actions { margin:10px 0 12px; }
.admin-training-sample {
  white-space:pre-wrap;
  border:1px solid #dde6ef;
  border-radius:6px;
  padding:10px 12px;
  background:#f7fbff;
  font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size:15px;
}
.admin-setup-panel label { display:block; font-weight:bold; margin-bottom:10px; }
.admin-setup-panel input { width:100%; box-sizing:border-box; margin-top:4px; }
.admin-setup-note { color:#555; font-size:16px; margin:6px 0 12px; }
.admin-setup-actions { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:12px; }
.office-setup-panel { width:min(860px,100%); }
.office-setup-status {
  margin-bottom:16px;
  padding:12px 14px;
  border:1px solid #c8d6e6;
  border-radius:8px;
  background:#f7fbff;
}
.office-setup-status.complete { border-color:#82b994; background:#effaf2; color:#145c2d; }
.office-setup-status.incomplete { border-color:#d8b35e; background:#fff8e7; color:#6b4b00; }
.office-setup-status p { margin:6px 0; }
.office-setup-status ul { margin:8px 0 0 20px; padding:0; }
.office-setup-details { margin-top:10px; }
.office-setup-folder-row {
  display:flex;
  justify-content:space-between;
  gap:16px;
  align-items:center;
  margin:12px 0;
  padding:12px 14px;
  border:1px solid #dde6ef;
  border-radius:8px;
}
.office-publication-history-section { margin-top:22px; padding-top:16px; border-top:1px solid #c8d6e6; }
.office-publication-history-section h3 { margin:0 0 6px; }
.office-publication-history { display:grid; gap:8px; }
.office-publication-entry,
.recovery-point-entry {
  display:flex;
  justify-content:space-between;
  gap:14px;
  padding:11px 12px;
  border:1px solid #dde6ef;
  border-radius:7px;
  background:#fff;
}
.office-publication-entry { flex-direction:column; gap:3px; }
.office-publication-entry span,
.recovery-point-entry span { display:block; color:#555; }
.publication-summary { margin-top:14px; }
.recovery-points-panel { width:min(820px,100%); }
.recovery-points-list { display:grid; gap:10px; }
.recovery-point-entry > div { min-width:0; }
.recovery-point-entry .button { flex:0 0 auto; align-self:center; }
@media (max-width:600px){
  .office-setup-folder-row,
  .recovery-point-entry { align-items:stretch; flex-direction:column; }
  .sharepoint-publish-destination div { grid-template-columns:1fr; gap:2px; }
}
.setup-mockup {
  border:1px solid #dde6ef;
  border-radius:6px;
  padding:12px;
  margin-top:10px;
  background:#fafcff;
}
.setup-mockup-grid {
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:8px;
  margin-bottom:10px;
}
.setup-mockup-category,
.setup-mockup-resource {
  border:1px solid #c8d6e5;
  border-radius:6px;
  background:white;
  padding:8px 10px;
}
.setup-mockup-category { font-weight:bold; color:#003366; text-align:center; }
.setup-mockup-resource strong { display:block; margin-bottom:4px; }

/* Print modal */
#printModal {
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  display:flex;
  justify-content:center;
  align-items:center;
  box-sizing:border-box;
  padding:16px;
  z-index:100;
}
#printModal.hidden { display:none; }
#printContentWrapper {
  background:white;
  box-sizing:border-box;
  padding:20px;
  max-height:100%;
  overflow:auto;
  width:min(800px, 100%);
}
@media print {
  @page {
    margin: 0.75in;
  }

  body {
    background: white;
  }

  body > *:not(#printModal):not(#referenceModal) {
    display: none !important;
  }

  #printModal {
    position: static;
    inset: auto;
    background: transparent;
    display: block;
    padding: 0;
    margin: 0;
  }

  #printContentWrapper {
    position: static;
    left: auto;
    top: auto;
    width: auto;
    max-height: none;
    overflow: visible;
    padding: 0;
    margin: 0;
    background: transparent;
    font-size: 11pt;
    line-height: 1.3;
  }

  #printContentWrapper button {
    display: none !important;
  }

  #printProgress {
    display: none !important;
  }

  #referenceModal {
    position: static;
    inset: auto;
    display: block;
    padding: 0;
    background: transparent;
  }

  #referenceModal.hidden {
    display: none !important;
  }

  .reference-modal-panel {
    width: auto;
    max-height: none;
    display: block;
    border: none;
    border-radius: 0;
    box-shadow: none;
    background: transparent;
  }

  .reference-modal-header {
    padding: 0 0 12pt;
    margin-bottom: 12pt;
    border-bottom: 1px solid #aaa;
  }

  .reference-modal-title {
    font-size: 16pt;
  }

  .reference-modal-body {
    padding: 0;
    overflow: visible;
    font-size: 11pt;
    line-height: 1.35;
  }

  .reference-modal-close {
    display: none !important;
  }

  .reference-modal-actions {
    display: none !important;
  }

  .admin-help-setup {
    display: none !important;
  }

  .admin-training-actions {
    display: none !important;
  }

  body.admin-help-printing .admin-training-section {
    display: none !important;
  }

  body.admin-training-printing .admin-help-content > :not(.admin-training-section) {
    display: none !important;
  }

  .resource-card {
    border: none;
    padding: 0;
    margin-bottom: 11pt;
    break-inside: avoid;
    page-break-inside: avoid;
    background: transparent;
  }

  .resource-card ul {
    margin-top: 4pt;
    margin-bottom: 4pt;
    padding-left: 14pt;
  }

  .print-resource-separator {
    border: 0;
    border-top: 1px solid #999;
    margin: 10pt 0;
  }

  .print-list-flyer {
    border: none;
    border-radius: 0;
    padding: 0;
    margin: 0;
    background: transparent;
  }

  .print-list-flyer-page-break {
    break-before: page;
    page-break-before: always;
  }

  .print-disabled {
    display: none !important;
  }
}
</style>

function nowISO(){ return new Date().toISOString(); }
function escapeHTML(str){ return (str||"").replace(/[&<>"']/g, m=>({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;" }[m])); }
function displayContactValue(value){
  const trimmed = typeof value === "string" ? value.trim() : "";
  return /^none$/i.test(trimmed) ? "" : trimmed;
}
function normalizeWebsiteURL(url){
  const trimmed = typeof url === "string" ? url.trim() : "";
  if(!trimmed) return "";
  if(/^https?:\/\//i.test(trimmed)) return trimmed;
  return `https://${trimmed}`;
}
function generateResourceId(){
  const bytes = new Uint8Array(16);
  crypto.getRandomValues(bytes);
  return Array.from(bytes)
    .map(b => b.toString(16).padStart(2,"0"))
    .join("");
}
function filenameFromPath(path){
  const clean = String(path || "").split(/[?#]/)[0];
  return clean.split("/").filter(Boolean).pop() || "";
}
function safePDFFileName(name){
  const fallback = "attachment.pdf";
  const base = filenameFromPath(name) || fallback;
  const safe = base.replace(/[^A-Za-z0-9._-]+/g, "-").replace(/^-+|-+$/g, "") || fallback;
  return /\.pdf$/i.test(safe) ? safe : `${safe}.pdf`;
}
function stablePDFIdFromPath(path, fallback = "pdf"){
  const text = String(path || fallback);
  let hash = 2166136261;
  for(let i = 0; i < text.length; i += 1){
    hash ^= text.charCodeAt(i);
    hash = Math.imul(hash, 16777619);
  }
  return `pdf-${(hash >>> 0).toString(16)}`;
}
function pdfNameFromPath(path){
  return filenameFromPath(path) || "PDF";
}
function buildPDFStoragePath(resourceId, attachmentId, fileName){
  return `pdfs/${encodeURIComponent(resourceId || "resource")}/${attachmentId}-${safePDFFileName(fileName)}`;
}
function showToast(message, options = {}){
  let toast = document.getElementById("appToast");
  if(!toast){
    toast = document.createElement("div");
    toast.id = "appToast";
    toast.className = "app-toast hidden";
    toast.setAttribute("role", "status");
    toast.setAttribute("aria-live", "polite");
    document.body.appendChild(toast);
  }
  toast.textContent = message;
  toast.classList.toggle("important", !!options.important);
  toast.classList.remove("hidden");
  if(showToast.timer) clearTimeout(showToast.timer);
  if(options.sticky){
    showToast.timer = null;
  }else{
    showToast.timer = setTimeout(() => {
      toast.classList.add("hidden");
      toast.classList.remove("important");
    }, 4500);
  }
}

function normalizeResourceInformation(r){
  if(!r || typeof r !== "object") return false;
  if(typeof r.informationText !== "string" || !r.informationText.trim()){
    r.informationText = typeof r.servicesText === "string" ? r.servicesText : "";
  }
  if("servicesText" in r) delete r.servicesText;
  return false;

function normalizeResourcePDFs(r){
  // Canonical: pdfs array of { id, name, path }. Legacy pdf path is preserved.
  if(!r || typeof r !== "object") return;
  const attachments = [];
  const seenPaths = new Set();

  if(Array.isArray(r.pdfs)){
    r.pdfs.forEach((pdf, index) => {
      if(!pdf || typeof pdf !== "object") return;
      const path = typeof pdf.path === "string" ? pdf.path.trim() : "";
      if(!path || seenPaths.has(path)) return;
      seenPaths.add(path);
      const id = String(pdf.id || "").trim() || stablePDFIdFromPath(`${path}:${index}`);
      attachments.push({
        ...pdf,
        id,
        name: String(pdf.name || pdfNameFromPath(path)).trim() || "PDF",
        path
      });
    });
  }

  const legacyPath = typeof r.pdf === "string" ? r.pdf.trim() : "";
  if(legacyPath && !seenPaths.has(legacyPath)){
    attachments.push({
      id: stablePDFIdFromPath(legacyPath),
      name: pdfNameFromPath(legacyPath),
      path: legacyPath
    });
  }

  r.pdfs = attachments;
  if(typeof r.pdf !== "string" && "pdf" in r) delete r.pdf;
}

function normalizeDataPDFShape(nextData){
  if(!nextData || !Array.isArray(nextData.resources)) return;

function getResourcePDFs(resource){

function collectPDFPathsFromResource(resource, { includeLegacy = true } = {}){
  if(!resource || typeof resource !== "object") return [];
  const paths = [];
  const seen = new Set();
  getResourcePDFs(resource).forEach(pdf => {
    const path = typeof pdf.path === "string" ? pdf.path.trim() : "";
    if(!path || seen.has(path)) return;
    seen.add(path);
    paths.push(path);
  });
  if(includeLegacy && typeof resource.pdf === "string"){
    const legacyPath = resource.pdf.trim();
    if(legacyPath && !seen.has(legacyPath)) paths.push(legacyPath);
  }
  return paths;
}

function collectPDFPathsFromResources(resources){
  const paths = [];
  const seen = new Set();
  (Array.isArray(resources) ? resources : []).forEach(resource => {
    collectPDFPathsFromResource(resource).forEach(path => {
      if(seen.has(path)) return;
      seen.add(path);
      paths.push(path);
    });
  });
  return paths;
}

function removePDFAttachmentFromResource(resource, pdfId){
  if(!resource || typeof resource !== "object") return null;
  normalizeResourcePDFs(resource);
  const removed = resource.pdfs.find(pdf => pdf.id === pdfId);
  if(!removed) return null;
  resource.pdfs = resource.pdfs.filter(pdf => pdf.id !== pdfId);
  if(typeof resource.pdf === "string" && resource.pdf.trim() === removed.path){
    delete resource.pdf;
  }
  return removed;
}

function isPDFPathReferencedInResources(resources, path){
  const key = String(path || "").trim();
  if(!key) return false;
  return (Array.isArray(resources) ? resources : []).some(resource => collectPDFPathsFromResource(resource).includes(key));
}

function isPDFPathReferenced(path){

function formatMMYYFromDate(d){
  const mm = String(d.getMonth()+1).padStart(2,"0");
  const yy = String(d.getFullYear()).slice(-2);
  return `${mm}/${yy}`;
}

function formatDateOnly(isoString){
  if(!isoString) return "(none)";
  const date = new Date(isoString);
  if(Number.isNaN(date.getTime())) return String(isoString);
  return date.toLocaleDateString(undefined, { year:"numeric", month:"long", day:"numeric" });
}

function formatDateTimeUTC(isoString){
  if(!isoString) return "(none)";
  const date = new Date(isoString);
  if(Number.isNaN(date.getTime())) return String(isoString);
  const month = date.toLocaleString(undefined, { month:"long", timeZone:"UTC" });
  const day = date.getUTCDate();
  const year = date.getUTCFullYear();
  const hour = date.getUTCHours();
  const minute = String(date.getUTCMinutes()).padStart(2, "0");
  return `${month} ${day}, ${year}, ${hour}:${minute} UTC`;
}

function parseMMYYToMonthIndex(mmyy){
  const match = String(mmyy || "").trim().match(/^(0[1-9]|1[0-2])\/(\d{2})$/);
  if(!match) return null;
  const month = Number(match[1]);
  const yy = Number(match[2]);
  const year = 2000 + yy;
  return year * 12 + (month - 1);
}

function isValidMMYY(value){
  return parseMMYYToMonthIndex(value) !== null;
}

function formatVerifiedOnForDisplay(verifiedOn){
  return isValidMMYY(verifiedOn) ? String(verifiedOn).trim() : "----";
}

function parseLegacyVerifiedOnToMMYY(raw){
  const text = String(raw || "").trim();
  if(!text) return null;

  const mmyy = text.match(/^(\d{1,2})[\/\-](\d{2})$/);
  if(mmyy){
    const month = Number(mmyy[1]);
    const yy = Number(mmyy[2]);
    if(month >= 1 && month <= 12) return `${String(month).padStart(2,"0")}/${String(yy).padStart(2,"0")}`;
  }

  const withYear = text.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2}|\d{4})$/);
  if(withYear){
    const month = Number(withYear[1]);
    const yearRaw = withYear[3];
    if(month >= 1 && month <= 12){
      const yy = yearRaw.length === 4 ? Number(yearRaw.slice(-2)) : Number(yearRaw);
      return `${String(month).padStart(2,"0")}/${String(yy).padStart(2,"0")}`;
    }
  }

  const compact = text.match(/^(\d{2})(\d{2})(\d{2})$/);
  if(compact){
    const month = Number(compact[1]);
    const yy = Number(compact[3]);
    if(month >= 1 && month <= 12) return `${compact[1]}/${String(yy).padStart(2,"0")}`;
  }

  if(/^\d{4}-\d{2}-\d{2}$/.test(text)){
    const isoDate = new Date(`${text}T00:00:00`);
    if(!Number.isNaN(isoDate.getTime())) return formatMMYYFromDate(isoDate);
  }

  const parsed = new Date(text);
  if(!Number.isNaN(parsed.getTime())) return formatMMYYFromDate(parsed);
  return null;
}

function coerceVerifiedOnToMMYY(value){
  if(value == null) return null;
  const text = String(value).trim();
  if(!text) return null;
  if(isValidMMYY(text)) return text;
  const parsed = parseLegacyVerifiedOnToMMYY(text);
  return parsed && isValidMMYY(parsed) ? parsed : null;
}

function validateVerifiedOnInput(value){
  const text = String(value || "").trim();
  if(!text) return { valid:true, normalized:null, message:"" };
  if(!isValidMMYY(text)){
    return { valid:false, normalized:null, message:"Use MM/YY (MM 01-12)." };
  }
  return { valid:true, normalized:text, message:"" };
}

function compareResourcesByName(a, b){
  return String((a && a.name) || "").localeCompare(String((b && b.name) || ""), undefined, { sensitivity:"base" });
}

function getAdminResourceBrowseList(){
  const resources = data.resources.slice();
  if(!adminShowVerifiedDates){
    return resources.sort(compareResourcesByName);
  }
  return resources.sort((a, b) => {
    const aMonth = parseMMYYToMonthIndex(a.verifiedOn);
    const bMonth = parseMMYYToMonthIndex(b.verifiedOn);
    const aVerified = aMonth !== null;
    const bVerified = bMonth !== null;
    if(aVerified !== bVerified) return aVerified ? -1 : 1;
    if(aVerified && bVerified && aMonth !== bMonth) return aMonth - bMonth;
    return compareResourcesByName(a, b);
  });
}

function buildAdminDeleteConfirmation(kind, name){
  if(kind === "resource"){
    if(isScoutReviewMode()){

        `Delete the proposed resource '${name}' from this Scout review copy?`,
        "",
        "It will not be included in a saved resource package."

      "Undo will remove the deletion tag."

  }

}

function canonicalizeTaxonomyLabel(label){
  return String(label || "").trim();
}

function normalizeTaxonomyLabels(labels){
  const normalized = [];
  const seen = new Set();
  const source = Array.isArray(labels)
    ? labels
    : (typeof labels === "string" ? labels.split(/[,\n]/) : []);

  source.forEach(rawLabel => {
    if(typeof rawLabel !== "string" && typeof rawLabel !== "number") return;
    const label = canonicalizeTaxonomyLabel(rawLabel);
    if(!label) return;
    const key = label.toLowerCase();
    if(seen.has(key)) return;
    seen.add(key);
    normalized.push(label);
  });
  return normalized;
}

function normalizeLegacyTagsShape(nextData){
  if(!nextData || typeof nextData !== "object") return;
  if("tags" in nextData) delete nextData.tags;
  if(!Array.isArray(nextData.resources)) return;
  nextData.resources.forEach(r => {
    if(r && typeof r === "object" && "tags" in r) delete r.tags;
  });
}

function normalizeCategoryFilters(filters){
  return normalizeTaxonomyLabels(filters);
}

function normalizeDataCategoryFilterShape(nextData){
  if(!nextData || typeof nextData !== "object") return;
  if(Array.isArray(nextData.categories)){
    nextData.categories.forEach(category => {
      if(!category || typeof category !== "object") return;
      category.filters = normalizeCategoryFilters(category.filters);
    });
  }
  if(!Array.isArray(nextData.resources)) return;
  nextData.resources.forEach(resource => {
    const source = resource && typeof resource.categoryFilters === "object" && !Array.isArray(resource.categoryFilters)
      ? resource.categoryFilters
      : {};
    const normalized = {};
    Object.keys(source).forEach(categoryId => {
      const filters = normalizeCategoryFilters(source[categoryId]);
      if(filters.length) normalized[categoryId] = filters;
    });
    resource.categoryFilters = normalized;
  });

  // A resource type must remain selectable after package import. Older packages
  // sometimes stored a categoryFilters value without declaring the same value
  // on the category, which made the assignment invisible in Admin and public
  // filtering. Preserve those active values in the category definition.
  const categoriesById = new Map(nextData.categories
    .filter(category => category && category.id)
    .map(category => [String(category.id), category]));
  nextData.resources.forEach(resource => {
    const filterMap = resource && resource.categoryFilters && typeof resource.categoryFilters === "object"
      ? resource.categoryFilters
      : {};
    Object.keys(filterMap).forEach(categoryId => {
      const category = categoriesById.get(String(categoryId));
      if(!category) return;
      category.filters = normalizeCategoryFilters([
        ...normalizeCategoryFilters(category.filters),
        ...normalizeCategoryFilters(filterMap[categoryId])
      ]);
    });
  });
}

function normalizeDataForGroupsShape(nextData){
  if(!nextData || typeof nextData !== "object") return;
  nextData.forGroups = normalizeTaxonomyLabels(nextData.forGroups)
    .sort((a,b)=>a.localeCompare(b, undefined, { sensitivity:"base" }));
  if(!Array.isArray(nextData.resources)) return;
  nextData.resources.forEach(resource => {
    if(!resource || typeof resource !== "object") return;
    resource.forGroups = normalizeTaxonomyLabels(resource.forGroups);
  });
}

const INFORMATION_ADDITIONAL_LABEL = "Additional text:";

// Resource Information is stored as plain text. Strip the old editor heading
// when a resource still has it so the saved text remains plain.
function trimOuterBlankLines(lines){
  const next = lines.slice();
  while(next.length && next[0].trim() === "") next.shift();
  while(next.length && next[next.length - 1].trim() === "") next.pop();
  return next;
}

function parseInformationText(text){
  const lines = String(text || "").replace(/\r\n?/g, "\n").split("\n");
  const stripped = lines.filter(line => line.trim() !== INFORMATION_ADDITIONAL_LABEL);
  return { additional:trimOuterBlankLines(stripped).join("\n") };
}

function composeInformationText(draft){
  return String(draft && draft.additional || "").trim();
}

function applyInformationMarkup(escapedText){
  return escapedText
    .replace(/__\*\*([^_\n][\s\S]*?)\*\*__/g, "<strong><u>$1</u></strong>")
    .replace(/\*\*__([^*\n][\s\S]*?)__\*\*/g, "<strong><u>$1</u></strong>")
    .replace(/\*\*([^*\n]+?)\*\*/g, "<strong>$1</strong>")
    .replace(/__([^_\n]+?)__/g, "<u>$1</u>");
}

function linkifyInformationURLs(html){
  const urlPattern = /(?:https?:\/\/|www\.)[A-Za-z0-9\-._~:/?#[\]@!$&()*+,;=%]+/gi;
  return String(html || "")
    .split(/(<[^>]+>)/g)
    .map(segment => {
      if(segment.startsWith("<")) return segment;
      return segment.replace(urlPattern, match => {
        let url = match;
        let trailing = "";
        while(url && /[.,;:!?)}\]]$/.test(url)){
          trailing = url.slice(-1) + trailing;
          url = url.slice(0, -1);
        }
        if(!url) return match;
        const href = /^www\./i.test(url) ? `https://${url}` : url;
        return `<a href="${href}" target="_blank" rel="noopener noreferrer">${url}</a>${trailing}`;
      });
    })
    .join("");
}

function renderInformationInlineHTML(text){
  return linkifyInformationURLs(applyInformationMarkup(escapeHTML(text)));
}

function renderInformationMarkupHTML(text){
  const normalized = String(text || "").replace(/\r\n?/g, "\n");
  const lines = normalized.split("\n");
  const out = [];
  let listItems = [];

  function flushList(){
    if(!listItems.length) return;
    out.push(`<ul>${listItems.join("")}</ul>`);
    listItems = [];
  }

  lines.forEach(line => {
    const trimmed = line.trim();
    const isDivider = trimmed === "---";
    const bulletMatch = line.match(/^\s*(?:\*|-|•)\s+(.*)$/);

    if(isDivider){
      flushList();
      out.push("<hr>");
      return;
    }

    if(bulletMatch){
      const bulletText = renderInformationInlineHTML(bulletMatch[1]);
      listItems.push(`<li>${bulletText}</li>`);
      return;
    }

    flushList();
    if(line === ""){
      out.push('<div class="information-line information-blank">&nbsp;</div>');
      return;
    }
    out.push(`<div class="information-line">${renderInformationInlineHTML(line)}</div>`);
  });

  flushList();
  return out.join("");
}

function renderInformationHTML(text){
  return renderInformationMarkupHTML(composeInformationText(parseInformationText(text)));
}

function fitTextareaToText(textarea){
  if(!textarea) return;
  textarea.style.height = "auto";
  textarea.style.height = `${textarea.scrollHeight}px`;
}

// ============================================================
// DELETION RECORDS AND TOMBSTONES
// ============================================================
// These package-level helpers load before the resource-package pipeline. The
// Admin request/review UI remains in 95-deletion-workflow.js.

const DELETION_KINDS = new Set(["resource", "category", "type", "forGroup"]);

function deletionLabelKey(value){
  return String(value || "").trim().toLowerCase();
}

function buildDeletionKey(kind, targetId, categoryId, label){
  const cleanKind = String(kind || "");
  if(cleanKind === "resource" || cleanKind === "category"){
    const id = String(targetId || "").trim();
    return id ? `${cleanKind}:${id}` : "";
  }
  if(cleanKind === "type"){
    const catId = String(categoryId || "").trim();
    const labelKey = deletionLabelKey(label);
    return catId && labelKey ? `type:${catId}:${labelKey}` : "";
  }
  if(cleanKind === "forGroup"){
    const labelKey = deletionLabelKey(label);
    return labelKey ? `forGroup:${labelKey}` : "";
  }
  return "";
}

function normalizeDeletionRecord(record, timeField = "requestedAt"){
  if(!record || typeof record !== "object") return null;
  const kind = String(record.kind || "");
  if(!DELETION_KINDS.has(kind)) return null;
  const targetId = String(record.targetId || "").trim();
  const categoryId = String(record.categoryId || "").trim();
  const label = String(record.label || "").trim();
  const key = buildDeletionKey(kind, targetId, categoryId, label);
  if(!key) return null;
  const timestamp = Date.parse(String(record[timeField] || ""))
    ? String(record[timeField])
    : nowISO();
  const normalized = { key, kind, label, [timeField]:timestamp };
  if(targetId) normalized.targetId = targetId;
  if(categoryId) normalized.categoryId = categoryId;
  const description = String(record.description || "").trim();
  if(description) normalized.description = description;
  return normalized;
}

function mergeDeletionRecords(first, second, timeField = "requestedAt"){
  const byKey = new Map();
  [first, second].forEach(list => {
    (Array.isArray(list) ? list : []).forEach(record => {
      const normalized = normalizeDeletionRecord(record, timeField);
      if(!normalized) return;
      const current = byKey.get(normalized.key);
      const currentTime = current ? Date.parse(current[timeField]) : -1;
      const nextTime = Date.parse(normalized[timeField]);
      if(!current || nextTime >= currentTime) byKey.set(normalized.key, normalized);
    });
  });
  return Array.from(byKey.values());
}

function normalizeDeletionWorkflowData(packageData){
  if(!packageData || typeof packageData !== "object") return;
  packageData.deletions = mergeDeletionRecords([], packageData.deletions, "deletedAt");
  const deletedKeys = new Set(packageData.deletions.map(record => record.key));
  packageData.deletionRequests = mergeDeletionRecords([], packageData.deletionRequests, "requestedAt")
    .filter(record => !deletedKeys.has(record.key));
}

function markDeletionAffectedRecord(record, timestamp){
  if(!record || typeof record !== "object") return;
  const previous = Date.parse(String(record.lastModified || ""));
  const next = Date.parse(String(timestamp || ""));
  if(!Number.isFinite(previous) || (Number.isFinite(next) && next > previous)){
    record.lastModified = timestamp;
  }
}

function applyDeletionTombstones(packageData, records = null){
  if(!packageData || typeof packageData !== "object") return packageData;
  if(!Array.isArray(packageData.categories)) packageData.categories = [];
  if(!Array.isArray(packageData.resources)) packageData.resources = [];
  if(!Array.isArray(packageData.forGroups)) packageData.forGroups = [];
  const tombstones = mergeDeletionRecords([], records == null ? packageData.deletions : records, "deletedAt");

  tombstones.forEach(tombstone => {
    const modifiedAt = tombstone.deletedAt;
    if(tombstone.kind === "resource"){
      packageData.resources = packageData.resources.filter(resource =>
        String(resource && resource.id || "") !== tombstone.targetId
      );
      return;
    }

    if(tombstone.kind === "category"){
      packageData.categories = packageData.categories.filter(category =>
        String(category && category.id || "") !== tombstone.targetId
      );
      packageData.resources.forEach(resource => {
        const categories = Array.isArray(resource && resource.categories) ? resource.categories : [];
        const hadCategory = categories.some(id => String(id) === tombstone.targetId);
        const hadFilters = !!(resource && resource.categoryFilters
          && Object.prototype.hasOwnProperty.call(resource.categoryFilters, tombstone.targetId));
        if(!hadCategory && !hadFilters) return;
        resource.categories = categories.filter(id => String(id) !== tombstone.targetId);
        if(resource.categoryFilters && typeof resource.categoryFilters === "object"){
          delete resource.categoryFilters[tombstone.targetId];
        }
        markDeletionAffectedRecord(resource, modifiedAt);
      });
      return;
    }

    if(tombstone.kind === "type"){
      const typeKey = deletionLabelKey(tombstone.label);
      const category = packageData.categories.find(item =>
        String(item && item.id || "") === tombstone.categoryId
      );
      if(category){
        category.filters = normalizeCategoryFilters(category.filters)
          .filter(filter => deletionLabelKey(filter) !== typeKey);
        markDeletionAffectedRecord(category, modifiedAt);
      }
      packageData.resources.forEach(resource => {
        if(!resource || !resource.categoryFilters || typeof resource.categoryFilters !== "object") return;
        const current = normalizeCategoryFilters(resource.categoryFilters[tombstone.categoryId]);
        const next = current.filter(filter => deletionLabelKey(filter) !== typeKey);
        if(next.length === current.length) return;
        resource.categoryFilters[tombstone.categoryId] = next;
        markDeletionAffectedRecord(resource, modifiedAt);
      });
      return;
    }

    if(tombstone.kind === "forGroup"){
      const groupKey = deletionLabelKey(tombstone.label);
      packageData.forGroups = normalizeTaxonomyLabels(packageData.forGroups)
        .filter(group => deletionLabelKey(group) !== groupKey);
      packageData.resources.forEach(resource => {
        const current = normalizeTaxonomyLabels(resource && resource.forGroups);
        const next = current.filter(group => deletionLabelKey(group) !== groupKey);
        if(next.length === current.length) return;
        resource.forGroups = next;
        markDeletionAffectedRecord(resource, modifiedAt);
      });
    }
  });
  return packageData;
}

// RESOURCE PACKAGE MIGRATION PIPELINE
// ============================================================
// Every external package follows one explicit sequence:
// read -> migrate schema versions -> normalize -> apply tombstones -> validate.
// Keep schema-specific compatibility work in the migration functions below.

const UNVERSIONED_RESOURCE_PACKAGE_SCHEMA_VERSION = 1;
const LEGACY_RESOURCE_PACKAGE_SCHEMA_VERSION = 2;
const RESOURCE_PACKAGE_SCHEMA_VERSION = 3;
const RESOURCE_PACKAGE_PIPELINE_STAGES = Object.freeze([
  "read",
  "migrate",
  "normalize",
  "applyTombstones",
  "validate"
]);

class ResourcePackageError extends Error{
  constructor(message, details = []){
    super(message);
    this.name = "ResourcePackageError";
    this.details = Array.isArray(details) ? details.map(String) : [];
  }
}

function resourcePackageSourceName(options = {}){
  return String(options.sourceName || "Resource package").trim() || "Resource package";
}

function formatResourcePackageError(error){
  const message = error && error.message ? String(error.message) : String(error || "Unknown package error");
  const details = error && Array.isArray(error.details) ? error.details.filter(Boolean) : [];
  return details.length ? `${message}\n\n${details.join("\n")}` : message;
}

function readResourcePackageData(rawData, options = {}){
  const sourceName = resourcePackageSourceName(options);
  if(!rawData || typeof rawData !== "object" || Array.isArray(rawData)){
    throw new ResourcePackageError(`${sourceName} must contain one JSON object.`);
  }
  try{
    return cloneDataObject(rawData);
  }catch(_error){
    throw new ResourcePackageError(`${sourceName} contains data that cannot be read safely.`);
  }
}

function readResourcePackageJSON(jsonText, options = {}){
  const sourceName = resourcePackageSourceName(options);
  let parsed;
  try{
    parsed = JSON.parse(String(jsonText || ""));
  }catch(error){
    throw new ResourcePackageError(
      `${sourceName} contains invalid JSON.`,
      [error && error.message ? error.message : "The JSON could not be parsed."]
    );
  }
  return readResourcePackageData(parsed, options);
}

function getResourcePackageSchemaVersion(packageData, options = {}){
  const sourceName = resourcePackageSourceName(options);
  const declared = packageData && packageData.resourcePackageSchemaVersion;
  if(declared == null || declared === "") return UNVERSIONED_RESOURCE_PACKAGE_SCHEMA_VERSION;
  if(typeof declared !== "number" || !Number.isInteger(declared)){
    throw new ResourcePackageError(
      `${sourceName} has an invalid resource package schema version.`,
      ["resourcePackageSchemaVersion must be a whole number."]
    );
  }
  if(declared < UNVERSIONED_RESOURCE_PACKAGE_SCHEMA_VERSION
    || declared > RESOURCE_PACKAGE_SCHEMA_VERSION){
    throw new ResourcePackageError(
      `${sourceName} uses unsupported resource package schema ${declared}.`,
      [
        `This app supports schemas ${UNVERSIONED_RESOURCE_PACKAGE_SCHEMA_VERSION} through ${RESOURCE_PACKAGE_SCHEMA_VERSION}.`,
        declared > RESOURCE_PACKAGE_SCHEMA_VERSION
          ? "Open this package with a newer TSO Resources app."
          : "Use a package exported by a supported TSO Resources app."
      ]
    );
  }
  return declared;
}

function mergeLegacyTaxonomyValues(currentValue, legacyValue){
  return normalizeTaxonomyLabels([
    ...normalizeTaxonomyLabels(currentValue),
    ...normalizeTaxonomyLabels(legacyValue)
  ]);
}

function isMigratableTaxonomyValue(value){
  if(value == null || typeof value === "string" || typeof value === "number") return true;
  return Array.isArray(value) && value.every(item =>
    typeof item === "string" || typeof item === "number"
  );
}

function requireMigratableTaxonomyValue(value, description){
  if(isMigratableTaxonomyValue(value)) return;
  throw new ResourcePackageError(
    `Legacy resource package data cannot be migrated safely.`,
    [`${description} must be a string or an array of labels.`]
  );
}

function migrateLegacyCategoryTypes(category){
  if(!category || typeof category !== "object") return;
  ["Types", "types"].forEach(key => {
    if(!(key in category)) return;
    requireMigratableTaxonomyValue(category[key], `Category '${category.id || "unknown"}' ${key}`);
    category.filters = mergeLegacyTaxonomyValues(category.filters, category[key]);
    delete category[key];
  });
}

function migrateLegacyResourceTaxonomy(resource){
  if(!resource || typeof resource !== "object") return;
  ["For", "for"].forEach(key => {
    if(!(key in resource)) return;
    requireMigratableTaxonomyValue(resource[key], `Resource '${resource.id || "unknown"}' ${key}`);
    resource.forGroups = mergeLegacyTaxonomyValues(resource.forGroups, resource[key]);
    delete resource[key];
  });

  ["Types", "typesByCategory"].forEach(key => {
    if(!(key in resource)) return;
    const legacy = resource[key];
    if(legacy && typeof legacy === "object" && !Array.isArray(legacy)){
      const current = resource.categoryFilters && typeof resource.categoryFilters === "object"
        && !Array.isArray(resource.categoryFilters)
        ? resource.categoryFilters
        : {};
      Object.keys(legacy).forEach(categoryId => {
        requireMigratableTaxonomyValue(
          legacy[categoryId],
          `Resource '${resource.id || "unknown"}' ${key}.${categoryId}`
        );
        current[categoryId] = mergeLegacyTaxonomyValues(current[categoryId], legacy[categoryId]);
      });
      resource.categoryFilters = current;
    }else if(legacy != null){
      throw new ResourcePackageError(
        "Legacy resource package data cannot be migrated safely.",
        [`Resource '${resource.id || "unknown"}' ${key} must map category IDs to labels.`]
      );
    }
    delete resource[key];
  });
}

function migrateResourcePackageSchema1To2(packageData){
  ["For", "for"].forEach(key => {
    if(!(key in packageData)) return;
    requireMigratableTaxonomyValue(packageData[key], `Top-level ${key}`);
    packageData.forGroups = mergeLegacyTaxonomyValues(packageData.forGroups, packageData[key]);
    delete packageData[key];
  });
  (Array.isArray(packageData.categories) ? packageData.categories : [])
    .forEach(migrateLegacyCategoryTypes);
  (Array.isArray(packageData.resources) ? packageData.resources : [])
    .forEach(migrateLegacyResourceTaxonomy);

  // These are known obsolete schema-1 fields. Unknown fields are deliberately
  // untouched so a round trip does not silently discard safe extension data.
  normalizeLegacyPackageShape(packageData);
  normalizeLegacyTagsShape(packageData);
  packageData.resourcePackageSchemaVersion = LEGACY_RESOURCE_PACKAGE_SCHEMA_VERSION;
  return packageData;
}

function migrateResourcePackageSchema2To3(packageData){
  if(packageData.deletionRequests == null) packageData.deletionRequests = [];
  if(packageData.deletions == null) packageData.deletions = [];
  packageData.resourcePackageSchemaVersion = RESOURCE_PACKAGE_SCHEMA_VERSION;
  return packageData;
}

const RESOURCE_PACKAGE_SCHEMA_MIGRATIONS = new Map([
  [UNVERSIONED_RESOURCE_PACKAGE_SCHEMA_VERSION, {
    toVersion:LEGACY_RESOURCE_PACKAGE_SCHEMA_VERSION,
    migrate:migrateResourcePackageSchema1To2
  }],
  [LEGACY_RESOURCE_PACKAGE_SCHEMA_VERSION, {
    toVersion:RESOURCE_PACKAGE_SCHEMA_VERSION,
    migrate:migrateResourcePackageSchema2To3
  }]
]);

function migrateResourcePackageData(packageData, options = {}){
  const sourceName = resourcePackageSourceName(options);
  const fromVersion = getResourcePackageSchemaVersion(packageData, options);
  let currentVersion = fromVersion;
  const appliedMigrations = [];

  while(currentVersion < RESOURCE_PACKAGE_SCHEMA_VERSION){
    const migration = RESOURCE_PACKAGE_SCHEMA_MIGRATIONS.get(currentVersion);
    if(!migration || typeof migration.migrate !== "function"){
      throw new ResourcePackageError(
        `${sourceName} cannot be migrated safely from schema ${currentVersion}.`
      );
    }
    migration.migrate(packageData);
    appliedMigrations.push(`${currentVersion}->${migration.toVersion}`);
    currentVersion = migration.toVersion;
  }
  packageData.resourcePackageSchemaVersion = RESOURCE_PACKAGE_SCHEMA_VERSION;
  return { data:packageData, fromVersion, appliedMigrations };
}

function collectUnsafePackageShapeErrors(packageData){
  const errors = [];
  if(!Array.isArray(packageData.categories)) errors.push("'categories' must be an array.");
  if(!Array.isArray(packageData.resources)) errors.push("'resources' must be an array.");
  ["categoryMigrations", "appChanges", "changes", "deletionRequests", "deletions"].forEach(key => {
    if(packageData[key] != null && !Array.isArray(packageData[key])){
      errors.push(`'${key}' must be an array when present.`);
    }
  });
  if(packageData.forGroups != null
    && !Array.isArray(packageData.forGroups)
    && typeof packageData.forGroups !== "string"){
    errors.push("'forGroups' must be a string or array when present.");
  }else if(!isMigratableTaxonomyValue(packageData.forGroups)){
    errors.push("'forGroups' contains a value that is not a label.");
  }
  if(packageData.packageCreatedAt != null
    && !Number.isFinite(Date.parse(String(packageData.packageCreatedAt)))){
    errors.push("'packageCreatedAt' must be a valid date when present.");
  }

  (Array.isArray(packageData.categories) ? packageData.categories : []).forEach((category, index) => {
    if(!category || typeof category !== "object" || Array.isArray(category)){
      errors.push(`Category at index ${index} must be an object.`);
      return;
    }
    if(category.filters != null
      && !Array.isArray(category.filters)
      && typeof category.filters !== "string"){
      errors.push(`Category '${category.id || index}' filters must be a string or array.`);
    }else if(!isMigratableTaxonomyValue(category.filters)){
      errors.push(`Category '${category.id || index}' filters contain a value that is not a label.`);
    }
  });

  (Array.isArray(packageData.resources) ? packageData.resources : []).forEach((resource, index) => {
    if(!resource || typeof resource !== "object" || Array.isArray(resource)){
      errors.push(`Resource at index ${index} must be an object.`);
      return;
    }
    if(resource.categories != null && !Array.isArray(resource.categories)){
      errors.push(`Resource '${resource.id || index}' categories must be an array.`);
    }
    if(resource.forGroups != null
      && !Array.isArray(resource.forGroups)
      && typeof resource.forGroups !== "string"){
      errors.push(`Resource '${resource.id || index}' forGroups must be a string or array.`);
    }else if(!isMigratableTaxonomyValue(resource.forGroups)){
      errors.push(`Resource '${resource.id || index}' forGroups contain a value that is not a label.`);
    }
    if(resource.categoryFilters != null
      && (typeof resource.categoryFilters !== "object" || Array.isArray(resource.categoryFilters))){
      errors.push(`Resource '${resource.id || index}' categoryFilters must be an object.`);
    }else if(resource.categoryFilters){
      Object.keys(resource.categoryFilters).forEach(categoryId => {
        if(!isMigratableTaxonomyValue(resource.categoryFilters[categoryId])){
          errors.push(
            `Resource '${resource.id || index}' categoryFilters.${categoryId} must be a string or array.`
          );
        }
      });
    }
    if(resource.pdfs != null && !Array.isArray(resource.pdfs)){
      errors.push(`Resource '${resource.id || index}' pdfs must be an array.`);
    }else{
      (Array.isArray(resource.pdfs) ? resource.pdfs : []).forEach((pdf, pdfIndex) => {
        if(!pdf || typeof pdf !== "object" || Array.isArray(pdf)){
          errors.push(`Resource '${resource.id || index}' PDF ${pdfIndex} must be an object.`);
        }else if(!String(pdf.path || "").trim()){
          errors.push(`Resource '${resource.id || index}' PDF ${pdfIndex} is missing path.`);
        }
      });
    }
  });

  const migrationSources = new Set();
  (Array.isArray(packageData.categoryMigrations) ? packageData.categoryMigrations : [])
    .forEach((migration, index) => {
      if(!migration || typeof migration !== "object" || Array.isArray(migration)){
        errors.push(`categoryMigrations[${index}] must be an object.`);
        return;
      }
      const fromId = String(migration.fromId || "").trim();
      const toId = String(migration.toId || "").trim();
      const toFilter = String(migration.toFilter || "").trim();
      if(!fromId) errors.push(`categoryMigrations[${index}] is missing fromId.`);
      if(fromId && migrationSources.has(fromId)){
        errors.push(`categoryMigrations contains duplicate fromId '${fromId}'.`);
      }
      if(fromId) migrationSources.add(fromId);
      if(fromId && toId && fromId === toId){
        errors.push(`categoryMigrations '${fromId}' cannot target itself.`);
      }
      if(toFilter && !toId){
        errors.push(`categoryMigrations '${fromId || index}' has toFilter without toId.`);
      }
    });

  (Array.isArray(packageData.changes) ? packageData.changes : []).forEach((change, index) => {
    if(!change || typeof change !== "object" || Array.isArray(change)){
      errors.push(`changes[${index}] must be an object.`);
    }
  });

  [
    ["deletionRequests", "requestedAt"],
    ["deletions", "deletedAt"]
  ].forEach(([key, timeField]) => {
    (Array.isArray(packageData[key]) ? packageData[key] : []).forEach((record, index) => {
      if(!record || typeof record !== "object" || Array.isArray(record)){
        errors.push(`${key}[${index}] must be an object.`);
        return;
      }
      if(!DELETION_KINDS.has(String(record.kind || ""))){
        errors.push(`${key}[${index}] has unsupported kind '${String(record.kind || "")}'.`);
      }else if(!buildDeletionKey(record.kind, record.targetId, record.categoryId, record.label)){
        errors.push(`${key}[${index}] is missing the target needed for '${record.kind}'.`);
      }
      if(record[timeField] != null && !Number.isFinite(Date.parse(String(record[timeField])))){
        errors.push(`${key}[${index}] has invalid ${timeField}.`);
      }
    });
  });

  const packageVersion = packageData.packageVersion;
  if(packageVersion != null){
    const validNumber = typeof packageVersion === "number" && Number.isFinite(packageVersion);
    const validString = typeof packageVersion === "string" && (
      !packageVersion.trim()
      || packageVersion.trim() === "Unknown"
      || normalizePackageVersionValue(packageVersion) !== "Unknown"
    );
    if(!validNumber && !validString){
      errors.push("'packageVersion' must be a number, numeric string, 'Unknown', or blank.");
    }
  }
  return errors;
}

function normalizeResourcePackageData(packageData){
  packageData.resourcePackageSchemaVersion = RESOURCE_PACKAGE_SCHEMA_VERSION;
  if(packageData.packageCreatedAt != null){
    packageData.packageCreatedAt = new Date(packageData.packageCreatedAt).toISOString();
  }
  normalizeDataInformationShape(packageData);
  normalizeDataPDFShape(packageData);
  normalizeDeletionWorkflowData(packageData);
  normalizeDataForGroupsShape(packageData);
  normalizeDataCategoryFilterShape(packageData);
  normalizeCategoryMigrations(packageData);
  normalizeDataVerifiedOnShape(packageData);
  normalizeChanges(packageData);
  packageData.packageVersion = normalizePackageVersionValue(packageData.packageVersion);
  normalizeLastLoadedPackageInfo(packageData);
  return packageData;
}

function validateResourcePackageData(packageData){
  const errors = [];
  const warnings = [];
  if(!packageData || typeof packageData !== "object" || Array.isArray(packageData)){
    return { ok:false, errors:["Package data must be one object."], warnings:[] };
  }
  if(packageData.resourcePackageSchemaVersion !== RESOURCE_PACKAGE_SCHEMA_VERSION){
    errors.push(`Package was not migrated to schema ${RESOURCE_PACKAGE_SCHEMA_VERSION}.`);
  }
  if(!Array.isArray(packageData.categories)) errors.push("Missing or invalid 'categories' array.");
  if(!Array.isArray(packageData.resources)) errors.push("Missing or invalid 'resources' array.");
  if(!Array.isArray(packageData.forGroups)) errors.push("Invalid normalized 'forGroups' array.");
  if(!Array.isArray(packageData.deletionRequests)) errors.push("Invalid normalized 'deletionRequests' array.");
  if(!Array.isArray(packageData.deletions)) errors.push("Invalid normalized 'deletions' array.");

  const categoryIds = new Set();
  (Array.isArray(packageData.categories) ? packageData.categories : []).forEach((category, index) => {
    const id = String(category && category.id || "").trim();
    if(!id) errors.push(`Category at index ${index} is missing id.`);
    if(!String(category && category.label || "").trim()){
      errors.push(`Category '${id || index}' is missing a label.`);
    }
    if(id && categoryIds.has(id)) errors.push(`Duplicate category id '${id}'.`);
    if(id) categoryIds.add(id);
  });

  const migratedCategoryIds = new Set();
  (Array.isArray(packageData.categoryMigrations) ? packageData.categoryMigrations : [])
    .forEach((migration, index) => {
      const fromId = String(migration && migration.fromId || "").trim();
      const toId = String(migration && migration.toId || "").trim();
      const toFilter = String(migration && migration.toFilter || "").trim();
      if(!fromId) errors.push(`Category migration at index ${index} is missing fromId.`);
      if(fromId && migratedCategoryIds.has(fromId)){
        errors.push(`Duplicate category migration from '${fromId}'.`);
      }
      if(fromId) migratedCategoryIds.add(fromId);
      if(toId && fromId === toId) errors.push(`Category migration '${fromId}' cannot target itself.`);
      if(toId && !categoryIds.has(toId)){
        errors.push(`Category migration '${fromId}' references unknown target '${toId}'.`);
      }
      if(toFilter && !toId) errors.push(`Category migration '${fromId}' has toFilter without toId.`);
    });

  const resourceIds = new Set();
  (Array.isArray(packageData.resources) ? packageData.resources : []).forEach((resource, index) => {
    const id = String(resource && resource.id || "").trim();
    if(!id) errors.push(`Resource at index ${index} is missing id.`);
    if(!String(resource && resource.name || "").trim()){
      warnings.push(`Resource '${id || index}' is missing name.`);
    }
    if(id && resourceIds.has(id)) errors.push(`Duplicate resource id '${id}'.`);
    if(id) resourceIds.add(id);
    (Array.isArray(resource && resource.categories) ? resource.categories : []).forEach(categoryId => {
      if(!categoryIds.has(String(categoryId))){
        warnings.push(`Resource '${id || index}' references unknown category '${categoryId}'.`);
      }
    });
    (Array.isArray(resource && resource.pdfs) ? resource.pdfs : []).forEach((pdf, pdfIndex) => {
      if(!pdf || typeof pdf !== "object"){
        errors.push(`Resource '${id || index}' PDF ${pdfIndex} must be an object.`);
      }else if(!pdf.path){
        errors.push(`Resource '${id || index}' PDF ${pdfIndex} is missing path.`);
      }
    });
  });
  return { ok:errors.length === 0, errors, warnings };
}

function processResourcePackageData(rawData, options = {}){
  const sourceName = resourcePackageSourceName(options);
  const packageData = readResourcePackageData(rawData, options);
  const migration = migrateResourcePackageData(packageData, options);
  const unsafeErrors = collectUnsafePackageShapeErrors(migration.data);
  if(unsafeErrors.length){
    throw new ResourcePackageError(`${sourceName} cannot be migrated safely.`, unsafeErrors);
  }

  normalizeResourcePackageData(migration.data);
  const removedUnnamedCategoryIds = removeUnusedUnnamedCategories(migration.data);
  applyDeletionTombstones(migration.data);
  const report = validateResourcePackageData(migration.data);
  if(!report.ok){
    throw new ResourcePackageError(`${sourceName} is not a valid resource package.`, report.errors);
  }
  return {
    data:migration.data,
    fromVersion:migration.fromVersion,
    appliedMigrations:migration.appliedMigrations,
    removedUnnamedCategoryIds,
    warnings:report.warnings,
    stages:RESOURCE_PACKAGE_PIPELINE_STAGES.slice()
  };
}

function processResourcePackageJSON(jsonText, options = {}){
  return processResourcePackageData(readResourcePackageJSON(jsonText, options), options);
}

// Compatibility wrapper for internal callers that historically expected
// in-place normalization. The wrapper now executes the complete safe pipeline.
function normalizePackageData(nextData){
  const processed = processResourcePackageData(nextData, { sourceName:"Resource package data" });
  if(!nextData || typeof nextData !== "object" || Array.isArray(nextData)) return processed.data;
  Object.keys(nextData).forEach(key => delete nextData[key]);
  Object.assign(nextData, processed.data);
  return nextData;
}

function validateImportData(imported, options = {}){
  try{
    const processed = processResourcePackageData(imported, options);
    return { ok:true, errors:[], warnings:processed.warnings, data:processed.data };
  }catch(error){
    const details = error && Array.isArray(error.details) && error.details.length
      ? error.details
      : [error && error.message ? error.message : String(error)];
    return { ok:false, errors:details, warnings:[] };
  }
}

function normalizeStorageId(value){
  const words = String(value || "")
    .trim()
    .split(/[^a-z0-9]+/i)
    .filter(Boolean);
  if(!words.length) return "new";
  return words.map((word, index) => {
    const lower = word.toLowerCase();
    return index === 0 ? lower : lower.charAt(0).toUpperCase() + lower.slice(1);
  }).join("");
}

function freshStartFromSeed(){
  const choice = prompt(
    "Choose local cleanup:\n\n" +
    "1. Refresh UI state only - keep resources and categories.\n" +
    "2. Reset to this file's starter data - delete local resources and categories.\n" +
    "3. Full local cleanup - delete local data and local PDF storage.\n\n" +
    "Type 1, 2, or 3."
  );
  const selected = String(choice || "").trim();
  if(!selected) return;
  if(selected === "1"){

    location.reload();

    if(!confirmed) return;

  const packagedBatches = (Array.isArray(source.packagedBatches) ? source.packagedBatches : [])

// SAFETY HARNESS

// Catch runtime errors and (when debug is enabled) enforce invariants to prevent
// silent corruption during edits, imports, and rendering.

function showAppError(context, err){
  const banner = document.getElementById("appErrorBanner");
  const details = document.getElementById("appErrorDetails");
  if(!banner || !details) return;

  const message = err && err.message ? String(err.message) : String(err || "Unknown error");
  const stack = err && err.stack ? String(err.stack) : "";
  const timestamp = new Date().toISOString();
  details.textContent = [
    `Context: ${context}`,
    `Message: ${message}`,
    `Timestamp: ${timestamp}`,
    stack ? `Stack:\n${stack}` : ""
  ].filter(Boolean).join("\n");
  banner.style.display = "block";
}

function safeCall(label, fn){
  try{
    return fn();
  }catch(err){
    showAppError(label, err);
    return undefined;
  }
}

function assertInvariants(context = "invariant check"){
  if(!data || !Array.isArray(data.resources)) throw new Error(`${context}: data.resources must be an array`);
  if(!Array.isArray(data.categories)) throw new Error(`${context}: data.categories must be an array`);
  if(!Array.isArray(printSelection)) throw new Error(`${context}: printSelection must be an array`);

  const ids = new Set();
  data.resources.forEach((resource, idx) => {
    const id = String(resource && resource.id || "");
    if(!id) throw new Error(`${context}: resource at index ${idx} is missing id`);
    if(ids.has(id)) throw new Error(`${context}: duplicate resource id '${id}'`);
    ids.add(id);

    if(!Array.isArray(resource.forGroups)) throw new Error(`${context}: resource '${id}' forGroups must be an array`);
    const resourceForGroupKeys = new Set();
    resource.forGroups.forEach(group => {
      if(typeof group !== "string" || group !== group.trim() || !group){
        throw new Error(`${context}: resource '${id}' has invalid For group '${group}'`);
      }
      const key = group.toLowerCase();
      if(resourceForGroupKeys.has(key)){
        throw new Error(`${context}: resource '${id}' has duplicate For group '${group}'`);
      }
      resourceForGroupKeys.add(key);
    });

    if(resource.verifiedOn != null && !isValidMMYY(resource.verifiedOn)){
      throw new Error(`${context}: resource '${id}' verifiedOn must be MM/YY or null`);
    }
  });

  const resourceIds = new Set(data.resources.map(r => String(r && r.id || "")));
  const badPrintSelection = printSelection.find(id => !resourceIds.has(String(id || "")));
  if(badPrintSelection) throw new Error(`${context}: print selection '${badPrintSelection}' does not reference a valid resource`);
}

function safeRender(label = "render"){
  return safeCall(label, () => {
    if(DEBUG) assertInvariants(`${label} pre`);
    const result = render();
    if(DEBUG) assertInvariants(`${label} post`);
    return result;
  });
}

function safeRenderAdmin(label = "renderAdmin"){
  return safeCall(label, () => {
    if(DEBUG) assertInvariants(`${label} pre`);
    const result = renderAdmin();
    if(DEBUG) assertInvariants(`${label} post`);
    return result;
  });
}

function isTopbarAdminLeftSwipe(start, end){
  if(!start || !end) return false;
  const dx = start.x - end.x;
  const dy = Math.abs(end.y - start.y);
  const elapsed = Math.max(0, end.time - start.time);
  return dx >= TOPBAR_ADMIN_SWIPE_MIN_X
    && dy <= TOPBAR_ADMIN_SWIPE_MAX_Y
    && elapsed <= TOPBAR_ADMIN_SWIPE_MAX_MS;
}

function handleTopbarAdminSwipeStart(event){
  if(!event || !event.changedTouches || event.changedTouches.length !== 1) return;
  const touch = event.changedTouches[0];
  topbarAdminSwipeStart = {
    x: touch.clientX,
    y: touch.clientY,
    time: Date.now()
  };
}

function handleTopbarAdminSwipeEnd(event){
  if(!topbarAdminSwipeStart || !event || !event.changedTouches || event.changedTouches.length !== 1) return;
  const touch = event.changedTouches[0];
  const swipeEnd = {
    x: touch.clientX,
    y: touch.clientY,
    time: Date.now()
  };
  const shouldEnableAdmin = isTopbarAdminLeftSwipe(topbarAdminSwipeStart, swipeEnd);
  topbarAdminSwipeStart = null;
  if(!shouldEnableAdmin) return;
  topbarAdminSwipeHandled = true;
  window.setTimeout(() => {
    topbarAdminSwipeHandled = false;
  }, 700);
  event.preventDefault();
  event.stopPropagation();
  toggleAdminModeFromTopbarSwipe();
}

function getUnseenUpdates(){
  const seen = getSeenUpdateIds();
  return getRecentChanges().filter(entry => !seen.has(String(entry.id)));
}

function getCategoryUpdateMap(){
  const map = new Map();
  const seen = getSeenUpdateIds();
  getRecentChanges().forEach(entry => {
    getCategoryIdsForChange(entry).forEach(catId => {
      if(seen.has(String(entry.id)) || seen.has(getCategoryChangeSeenKey(entry.id, catId))) return;
      if(!map.has(catId)) map.set(catId, []);
      map.get(catId).push(entry);
    });
  });
  return map;
}

// Resource cards are shared across category lists, print previews, and admin
// reference checks. Keep resource-card behavior here so all surfaces agree on
// print toggles, details expansion, and information formatting.

function updateFavoriteToggleButton(button, resource){
  if(!button) return;
  const selected = isFavoriteResource(resource.id);
  button.setAttribute("aria-pressed", selected ? "true" : "false");
  button.setAttribute("aria-label", selected
    ? `Remove ${resource.name || "this resource"} from favorites`
    : `Add ${resource.name || "this resource"} to favorites`);
  button.title = selected ? "Remove from favorites" : "Add to favorites";
  button.replaceChildren(createInterfaceIcon(selected ? "star-filled" : "star-outline"));
}

function createFavoriteToggleButton(resource){
  const button = document.createElement("button");
  button.type = "button";
  button.className = "resource-icon-button favorite-toggle";
  updateFavoriteToggleButton(button, resource);
  button.onclick = event => {
    event.stopPropagation();
    toggleFavoriteResource(resource.id, { rerender:false });
    updateFavoriteToggleButton(button, resource);
    if(view === "favorites") safeRender();
  };
  return button;
}

function createPrintSelectionToggleButton(resource){
  const selected = isSelectedForPrinting(resource.id);
  const button = document.createElement("button");
  button.type = "button";
  button.className = "resource-icon-button print-selection-toggle";
  button.setAttribute("aria-pressed", selected ? "true" : "false");
  button.setAttribute("aria-label", selected
    ? `Remove ${resource.name || "this resource"} from print selection`
    : `Select ${resource.name || "this resource"} for printing`);
  button.title = selected ? "Remove from print selection" : "Select for printing";
  button.appendChild(createInterfaceIcon("printer"));
  button.onclick = event => {
    event.stopPropagation();
    togglePrintSelection(resource.id);
  };
  return button;
}

function createResourceActionButtons(resource, { showFavoriteToggle = true, showPrintToggle = true } = {}){
  const controls = document.createElement("div");
  controls.className = "resource-action-buttons";
  controls.setAttribute("aria-label", `Actions for ${resource.name || "resource"}`);
  if(showFavoriteToggle) controls.appendChild(createFavoriteToggleButton(resource));
  if(showPrintToggle) controls.appendChild(createPrintSelectionToggleButton(resource));
  return controls;
}

function buildResourceCard(res,{expanded=false,showDescription=false,showPrintToggle=true,showFavoriteToggle=true}={}){
  // Shared DOM builder used by category view, print-selection view, and print previews.
  normalizeResourceInformation(res);
  normalizeResourcePDFs(res);

  const card=document.createElement("div");
  card.className="resource-card";
  card.addEventListener("click", event => {
    handleAdminListReferenceInspection(event, res);
  }, true);

  if(showFavoriteToggle || showPrintToggle){
    card.appendChild(createResourceActionButtons(res, { showFavoriteToggle, showPrintToggle }));
  }

  const main=document.createElement("div");
  main.className="resource-main";
  main.innerHTML=`<strong>${res.name}</strong>`;
  if(showDescription && res.description) main.innerHTML+=`<div>${escapeHTML(res.description)}</div>`;

  const details=document.createElement("div");
  details.className="resource-details "+(expanded?"expanded":"collapsed");

  let html="";
  const pdfs = getResourcePDFs(res);
  const phone = displayContactValue(res.phone);
  const address = displayContactValue(res.address);
  const website = displayContactValue(res.website);
  const hours = displayContactValue(res.hours);
  const websiteURL = normalizeWebsiteURL(website);
  if(phone) html+=`<div><strong>Phone:</strong> <a href="tel:${escapeHTML(phone)}">${escapeHTML(phone)}</a></div>`;
  if(address) html+=`<div><strong>Address:</strong> ${escapeHTML(address)}</div>`;
  if(websiteURL) html+=`<div><strong>Website:</strong> <a href="${websiteURL}" target="_blank">${escapeHTML(website)}</a></div>`;
  if(hours) html+=`<div><strong>Hours:</strong> ${escapeHTML(hours)}</div>`;
  if(pdfs.length === 1){
    const label = pdfs[0].name && pdfs[0].name !== "PDF" ? pdfs[0].name : "Open PDF";
    html+=`<div><button type="button" class="button resource-pdf-button" data-pdf-index="0">${escapeHTML(label)}</button></div>`;
  }
  if(pdfs.length > 1){
    html+=`<div><strong>PDFs:</strong><div class="pdf-attachments-list">`;
    pdfs.forEach((pdf, index) => {
      html+=`<button type="button" class="button resource-pdf-button" data-pdf-index="${index}">${escapeHTML(pdf.name || "PDF")}</button>`;
    });
    html+=`</div></div>`;
  }
  if(res.informationText) html+=`<hr class="resource-info-separator"><div class="information-rendered resource-info-rendered">${renderInformationHTML(res.informationText)}</div>`;

  details.innerHTML=html;
  details.querySelectorAll(".resource-pdf-button").forEach(btn => {
    btn.onclick = async e => {
      e.stopPropagation();
      const index = Number(btn.dataset.pdfIndex);
      const pdf = pdfs[index];
      if(pdf && pdf.path) await openPDF(pdf.path);
    };
  });
  main.appendChild(details);
  card.appendChild(main);
  return card;
}

function highlightSearchMatches(root, queryTokens){
  if(!root || !queryTokens.length) return [];
  const textNodes = [];
  const collectTextNodes = node => {
    Array.from(node && node.childNodes || []).forEach(child => {
      if(child.nodeType === 3){
        textNodes.push(child);
      }else if(child.nodeType === 1 && String(child.tagName || "").toLowerCase() !== "mark"){
        collectTextNodes(child);
      }
    });
  };
  collectTextNodes(root);

  const highlights = [];
  textNodes.forEach(node => {
    const text = String(node.nodeValue || "");
    const matches = getSearchTextTokenEntries(text)
      .filter(entry => queryTokens.some(queryToken => searchTokensMatch(entry.token, queryToken)));
    if(!matches.length || !node.parentNode) return;

    const fragment = document.createDocumentFragment();
    let offset = 0;
    matches.forEach(match => {
      if(match.index > offset) fragment.appendChild(document.createTextNode(text.slice(offset, match.index)));
      const mark = document.createElement("mark");
      mark.className = "search-match-highlight";
      mark.textContent = text.slice(match.index, match.end);
      fragment.appendChild(mark);
      highlights.push(mark);
      offset = match.end;
    });
    if(offset < text.length) fragment.appendChild(document.createTextNode(text.slice(offset)));
    node.parentNode.replaceChild(fragment, node);
  });
  return highlights;
}

function getSelectedCategoryFilters(categoryId){
  return Array.isArray(selectedCategoryFilters[categoryId]) ? selectedCategoryFilters[categoryId] : [];
}

function setSelectedCategoryFilters(categoryId, filterKeys){
  const cleaned = normalizeTaxonomyLabels(filterKeys);
  if(cleaned.length){
    selectedCategoryFilters[categoryId] = cleaned;
  }else{
    delete selectedCategoryFilters[categoryId];
  }

}

function makeCategorySpecificFilterKey(filter){
  return `filter:${canonicalizeTaxonomyLabel(filter).toLowerCase()}`;
}

function makeForGroupFilterKey(group){
  return `for:${canonicalizeTaxonomyLabel(group).toLowerCase()}`;
}

function getCategoryFilterOptions(categoryId){
  const cat = (Array.isArray(data.categories) ? data.categories : []).find(category => category && category.id === categoryId);
  const options = [];
  const resources = getCategoryResources(categoryId);
  const usedCategoryFilterKeys = new Set();
  const usedForGroupKeys = new Set();

  resources.forEach(resource => {
    getResourceCategoryFilterKeys(resource, categoryId).forEach(key => usedCategoryFilterKeys.add(key));
    getResourceForGroupFilterKeys(resource).forEach(key => usedForGroupKeys.add(key));
  });

  normalizeCategoryFilters(cat && cat.filters).forEach(filter => {
    const key = makeCategorySpecificFilterKey(filter);
    if(usedCategoryFilterKeys.has(key)){
      options.push({ key, label:filter, kind:"filter" });
    }
  });
  normalizeTaxonomyLabels(data.forGroups).forEach(group => {
    const key = makeForGroupFilterKey(group);
    if(usedForGroupKeys.has(key)){
      options.push({ key, label:group, kind:"for" });
    }
  });
  return options;
}

function getResourceCategoryFilterKeys(resource, categoryId){
  return new Set(normalizeCategoryFilters(resource && resource.categoryFilters && resource.categoryFilters[categoryId])
    .map(makeCategorySpecificFilterKey));
}

function getResourceForGroupFilterKeys(resource){
  return new Set(normalizeTaxonomyLabels(resource && resource.forGroups).map(makeForGroupFilterKey));
}

function countSelectedCategoryFilterMatches(resource, categoryId, activeFilterKeys){
  if(!activeFilterKeys.size) return 0;
  const resourceKeys = new Set([
    ...getResourceCategoryFilterKeys(resource, categoryId),
    ...getResourceForGroupFilterKeys(resource)
  ]);
  let count = 0;
  activeFilterKeys.forEach(key => {
    if(resourceKeys.has(key)) count += 1;
  });
  return count;
}

function resourceMatchesSelectedCategoryFilters(resource, categoryId, selectedFilterKeys){
  const activeFilterKeys = new Set(normalizeTaxonomyLabels(selectedFilterKeys));
  return !activeFilterKeys.size || countSelectedCategoryFilterMatches(resource, categoryId, activeFilterKeys) > 0;
}

function filterResourcesBySelectedCategoryFilters(resources, categoryId, selectedFilterKeys){
  const activeFilterKeys = new Set(normalizeTaxonomyLabels(selectedFilterKeys));
  return (Array.isArray(resources) ? resources : [])
    .filter(resource => resourceMatchesSelectedCategoryFilters(resource, categoryId, selectedFilterKeys))
    .sort((a, b) => {
      if(activeFilterKeys.size){
        const matchDiff = countSelectedCategoryFilterMatches(b, categoryId, activeFilterKeys) - countSelectedCategoryFilterMatches(a, categoryId, activeFilterKeys);
        if(matchDiff) return matchDiff;
      }
      return compareResourcesByName(a, b);
    });
}

function resourceMatchesListsHeuristic(resource){
  return !!String(resource && resource.name || "").trim()
    && !String(resource && resource.phone || "").trim()

// UNDO SYSTEM
// ============================================================
// Undo is intentionally narrow: deletion tagging and approval save one complete
// data snapshot in localStorage. The snapshot expires as soon as another change
// is persisted so restoring it cannot silently discard newer work.

function getUndoSnapshot(){
  try{
    const raw = localStorage.getItem(UNDO_STORAGE_KEY);
    if(!raw) return null;
    const parsed = JSON.parse(raw);
    if(!parsed || typeof parsed !== "object") return null;
    if(!parsed.dataSnapshot || typeof parsed.message !== "string") return null;
    return parsed;
  }catch(_err){
    return null;
  }
}

function clearUndoSnapshot(){
  localStorage.removeItem(UNDO_STORAGE_KEY);
}

function setUndoSnapshot(message){
  localStorage.setItem(UNDO_STORAGE_KEY, JSON.stringify({
    dataSnapshot: JSON.parse(JSON.stringify(data)),
    message: String(message || ""),
    awaitingPostActionPersist:true
  }));
}

function updateUndoSnapshotAfterPersist(){
  const snapshot = getUndoSnapshot();
  if(!snapshot) return;
  if(snapshot.awaitingPostActionPersist){
    delete snapshot.awaitingPostActionPersist;
    localStorage.setItem(UNDO_STORAGE_KEY, JSON.stringify(snapshot));
    return;
  }
  clearUndoSnapshot();
}

function undoLastDeletion(){
  const hadSnapshot = !!getUndoSnapshot();
  if(!commitPendingEditsIfChanged()) return;
  const snapshot = getUndoSnapshot();
  if(!snapshot || !snapshot.dataSnapshot){
    if(hadSnapshot){
      showToast("Undo is no longer available because newer changes were saved.");
      safeRender();
    }
    return;
  }
  data = normalizePackageData(snapshot.dataSnapshot);
  clearUndoSnapshot();
  sanitizeFavoriteResourceIds();
  sanitizePrintSelection();
  persist();
  safeRender();
}

function groupAppChangesByVersion(changes){
  const groups = [];
  const groupsByVersion = new Map();
  (Array.isArray(changes) ? changes : []).forEach(change => {
    const version = String(change && change.version || "").trim();
    if(!version) return;
    let group = groupsByVersion.get(version);
    if(!group){
      group = { version, changes:[] };
      groupsByVersion.set(version, group);
      groups.push(group);
    }
    group.changes.push(change);
  });
  return groups;
}

    : String(value || "");
}
