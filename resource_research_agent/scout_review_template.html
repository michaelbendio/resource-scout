// Shared drafts, validation, action bars, and commit coordination used by the
// focused category, resource, and For-group editor modules.

function switchAdminTab(nextTab){
  if(adminTab === nextTab) return;
  if(!["categories", "resources", "forGroups"].includes(nextTab)) return;
  if(!commitPendingEditsIfChanged()) return;
  if(nextTab !== "resources"){
    adminResourceEditMode = false;
  }
  adminTab = nextTab;
  safeRenderAdmin();
}

function categoryEditorDraft(){
  // Capture category editor form state as a plain draft object.
  const labelEl = document.getElementById("cat_label");
  const updateEl = document.getElementById("cat_update_description");
  if(!labelEl || !editing || editing.kind !== "category") return null;
  const cat = data.categories[editing.idx];
  if(!cat) return null;
  return {
    id: cat.id || generateResourceId(),
    label: labelEl.value.trim(),
    filters: Array.from(document.querySelectorAll(".catFilterInput"))
      .map(input => input.value)
      .filter(value => String(value || "").trim()),
    updateDescription: updateEl ? updateEl.value.trim() : ""
  };
}

function resourceEditorDraft(){
  // Capture resource editor form state as a plain draft object.
  const nameEl = document.getElementById("res_name");
  const phoneEl = document.getElementById("res_phone");
  const addressEl = document.getElementById("res_address");
  const websiteEl = document.getElementById("res_website");
  const hoursEl = document.getElementById("res_hours");
  const descEl = document.getElementById("res_description");
  const updateEl = document.getElementById("res_update_description");
  if(!nameEl || !phoneEl || !addressEl || !websiteEl || !hoursEl || !descEl) return null;
  const verifiedEl = document.getElementById("res_verified_on");
  const verifiedOn = verifiedEl ? verifiedEl.value.trim() : "";
  const forGroups = Array.from(document.querySelectorAll(".resForGroup"))
    .filter(cb=>cb.checked)
    .map(cb=>cb.value)
    .sort();
  const categories = Array.from(document.querySelectorAll(".resCat"))
    .filter(cb=>cb.checked)
    .map(cb=>cb.value)
    .sort();
  const categoryFilters = {};
  categories.forEach(categoryId => {
    const filters = Array.from(document.querySelectorAll(".resCatFilter"))
      .filter(cb => cb.dataset.categoryId === categoryId)
      .filter(cb => cb.checked)
      .map(cb => cb.value);
    const cleaned = normalizeCategoryFilters(filters);
    if(cleaned.length) categoryFilters[categoryId] = cleaned;
  });
  const additionalEl = document.getElementById("res_info_additional");
  const informationDraft = { additional:additionalEl ? additionalEl.value : "" };

  return {
    name: nameEl.value.trim(),
    phone: phoneEl.value.trim(),
    address: addressEl.value.trim(),
    website: websiteEl.value.trim(),
    hours: hoursEl.value.trim(),
    description: descEl.value,
    informationText: composeInformationText(informationDraft),
    verifiedOn,
    categories,
    categoryFilters,
    forGroups,
    updateDescription: updateEl ? updateEl.value.trim() : ""
  };
}

function getResourceIndexById(resourceId){
  if(!resourceId) return -1;
  return data.resources.findIndex(r => r && r.id === resourceId);
}

function getCategoryIndexById(categoryId){
  if(!categoryId) return -1;
  return data.categories.findIndex(category => category && category.id === categoryId);
}

function validateResourceName(draft, idx){
  // Prevent empty names and duplicates before applying/persisting resource edits.
  const name = String(draft && draft.name || "").trim();
  if(!name){
    return { valid:false, message:"Name is required." };
  }
  const lower = name.toLowerCase();
  const duplicate = data.resources.some((r, i) => i !== idx && String(r && r.name || "").trim().toLowerCase() === lower);
  if(duplicate){
    return { valid:false, message:"Another resource already uses this name." };
  }
  return { valid:true, message:"" };
}

function normalizeCategoryName(name){
  return String(name || "").trim().toLowerCase();
}

function compareCategoriesByLabel(a, b){
  const labelA = String(a && a.label || "");
  const labelB = String(b && b.label || "");
  return labelA.localeCompare(labelB, undefined, { sensitivity:"base" });
}

function getAlphabeticalCategoryPairs(){
  return (Array.isArray(data.categories) ? data.categories : [])
    .map((c,i)=>({c,i}))
    .sort((a,b)=>{
      const labelCompare = compareCategoriesByLabel(a.c, b.c);
      return labelCompare || a.i - b.i;
    });
}

function categoryNameExists(name, excludeId){
  const normalizedName = normalizeCategoryName(name);
  if(!normalizedName) return false;
  return (Array.isArray(data.categories) ? data.categories : []).some(cat => {
    if(excludeId && String(cat && cat.id || "") === String(excludeId)) return false;
    return normalizeCategoryName(cat && cat.label) === normalizedName;
  });
}

function validateCategoryDraft(draft){
  if(!String(draft && draft.label || "").trim()){
    return { valid:false, message:"Category name is required." };
  }
  if(categoryNameExists(draft && draft.label, draft && draft.id)){
    return { valid:false, message:"Category already exists." };
  }
  return { valid:true, message:"" };
}

function setAdminEditorActions(kind, visible, doneDisabled = false, cancelDisabled = false){

function applyCategoryDraft(idx, draft){
  // Apply validated category draft into canonical data model.
  const cat = data.categories[idx];
  if(!cat) return;
  const previousFilters = normalizeCategoryFilters(cat.filters);
  const nextFilters = normalizeCategoryFilters(draft.filters);
  const nextKeys = new Set(nextFilters.map(deletionLabelKey));
  const removedFilters = previousFilters.filter(filter => !nextKeys.has(deletionLabelKey(filter)));
  if(removedFilters.length){
    setUndoSnapshot(removedFilters.length === 1 ? "Type deletion tag" : "Type deletion tags");
    const requests = removedFilters.map(filter => createDeletionRequest("type", {
      categoryId:cat.id,
      label:filter
    }));
    data.deletionRequests = mergeDeletionRecords(data.deletionRequests, requests, "requestedAt");
  }
  cat.id = cat.id || draft.id || generateResourceId();
  cat.label = draft.label || cat.label;
  cat.filters = normalizeCategoryFilters([...nextFilters, ...removedFilters]);
  cat.lastModified = nowISO();
}

function renderAdminCategoryResourceList(selectedCategoryId){

  if(!hasSelectedCategory){

  const resources = data.resources
    .filter(r => r.categories?.includes(selectedCategoryId))
    .sort((a, b) => (a.name || "").localeCompare(b.name || ""));

  container.style.display = "block";

      <div id="adminCategoryResourceItems"></div>

  `;

  const list = document.getElementById("adminCategoryResourceItems");
  if(!list) return;

  if(!resources.length){

    return;
  }

  resources.forEach(resource => {

    const resourceId = String(resource.id || "");

function applyResourceDraft(idx, draft){
  // Apply validated resource draft into canonical data model. The editor stores
  // empty text fields as empty strings, but taxonomy fields are always arrays or
  // objects so package export stays predictable.
  const res = data.resources[idx];
  if(!res) return;
  clearScoutReviewResourceReady(res.id);
  res.name = draft.name || res.name;
  res.phone = draft.phone;
  res.address = draft.address;
  res.website = draft.website;
  res.hours = draft.hours;
  res.description = draft.description;
  res.informationText = draft.informationText;
  const verifiedValidation = validateVerifiedOnInput(draft.verifiedOn);
  res.verifiedOn = verifiedValidation.valid ? verifiedValidation.normalized : null;
  if("reviewedOn" in res) delete res.reviewedOn;
  if("verifiedDate" in res) delete res.verifiedDate;
  res.categories = draft.categories;
  res.categoryFilters = draft.categoryFilters || {};
  res.forGroups = normalizeTaxonomyLabels(draft.forGroups);
  res.lastModified = nowISO();
  refreshAdminCategoryResourceList();
}

  }
  promptBlankUpdateDescription();
  return false;
}

function commitPendingEditsIfChanged(){
  // Editor commit pattern:
  // UI fields -> draft snapshot -> validation -> apply canonical update -> persist.
  // This runs before view/tab changes and before package save/import. Returning
  // false blocks navigation so the admin can correct invalid or undescribed edits.
  if(!editing) return true;

  let nextSnapshot = "";
  if(editing.kind === "category"){
    nextSnapshot = snapshotCategoryEditor();
    if(!nextSnapshot) return true;
    const draft = JSON.parse(nextSnapshot);
    const validation = validateCategoryDraft(draft);
    showCategoryEditorWarning(validation.message);
    if(!validation.valid){
      const labelInput = document.getElementById("cat_label");
      if(labelInput) labelInput.focus();
      return false;
    }
    if(nextSnapshot !== editorSnapshot){
      if(!confirmBlankUpdateDescription(draft)) return false;
      const action = newCategoryIds.has(draft.id) ? "added" : "updated";
      applyCategoryDraft(editing.idx, draft);
      addChangeEntry(createChangeEntry("category", action, draft.id, draft.label || "(Unnamed category)", draft.updateDescription));
      newCategoryIds.delete(draft.id);
      persist();
      editorSnapshot = nextSnapshot;
    }
    return true;
  }

  if(editing.kind === "resource"){
    nextSnapshot = snapshotResourceEditor();
    if(!nextSnapshot) return true;
    const draft = JSON.parse(nextSnapshot);
    const validation = validateResourceName(draft, editing.idx);
    const verifiedValidation = validateVerifiedOnInput(draft.verifiedOn);
    showResourceNameWarning(validation.message);
    showResourceVerifiedWarning(verifiedValidation.message);
    if(!validation.valid){
      const nameInput = document.getElementById("res_name");
      if(nameInput) nameInput.focus();
      return false;
    }
    if(!verifiedValidation.valid){
      const verifiedInput = document.getElementById("res_verified_on");
      if(verifiedInput) verifiedInput.focus();
      return false;
    }
    if(nextSnapshot !== editorSnapshot){
      if(!confirmBlankUpdateDescription(draft)) return false;
      const resource = data.resources[editing.idx];
      const resourceId = resource && resource.id ? resource.id : "";
      const action = newResourceIds.has(resourceId) ? "added" : "updated";
      applyResourceDraft(editing.idx, draft);
      const saved = data.resources[editing.idx];
      addChangeEntry(createChangeEntry("resource", action, saved && saved.id, draft.name || "(Unnamed resource)", draft.updateDescription, { categoryIds:draft.categories }));
      if(saved && saved.id) newResourceIds.delete(saved.id);
      persist();
      editorSnapshot = nextSnapshot;
      if(saved && saved.id) selectedResourceId = saved.id;
    }
    return true;
  }

  if(editing.kind === "forGroups"){
    nextSnapshot = snapshotForGroupsEditor();
    if(!nextSnapshot) return true;
    const draft = JSON.parse(nextSnapshot);
    const validation = validateForGroupsDraft(draft);
    if(!validation.valid) return false;
    if(nextSnapshot !== editorSnapshot){
      applyForGroupsDraft(draft);
      persist();
      editorSnapshot = nextSnapshot;
    }
    return true;
  }
  return true;
}

function renderAdminCategories(container){
  // Category management view (alphabetical list, full-width editor, and filters).
  container.innerHTML += `

      <div class="category-admin-layout">

  `;

  const sel = document.getElementById("catSelect");

  // Sort for display, but keep option value = real index.
  const pairs = getAlphabeticalCategoryPairs();

  populateCategoryBrowseOptions(sel, pairs);

  sel.addEventListener("click", event => {
    const btn = event.target.closest(".resource-listbox-option");
    if(!btn || !sel.contains(btn)) return;
    if(!commitPendingEditsIfChanged()) return;
    setCategoryBrowseSelection(sel, btn.dataset.categoryIndex || "");

    if(labelInput){

      deleteCategory();
      return;
    }
    if(["ArrowDown", "ArrowUp", "Home", "End"].includes(e.key)){

      moveCategoryBrowseSelection(sel, e.key);
      editCategory(parseInt(selectedCategoryIndex,10));

  if(pairs.length && pairs.some(({i}) => String(i) === selectedCategoryIndex)){
    setCategoryBrowseSelection(sel, selectedCategoryIndex);

function populateCategoryBrowseOptions(sel, pairs){
  if(!sel) return;
  sel.innerHTML = "";
  pairs.forEach(({c,i}) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "resource-listbox-option";
    btn.setAttribute("role", "option");
    btn.setAttribute("aria-selected", "false");
    btn.tabIndex = -1;
    btn.dataset.categoryIndex = String(i);
    btn.dataset.categoryId = String(c.id || "");
    const label = String(c && c.label || "").trim() || "(Unnamed category)";
    btn.textContent = hasDeletionRequest("category", { targetId:c.id })
      ? `${label} — tagged for deletion`
      : label;
    sel.appendChild(btn);
  });
}

function setCategoryBrowseSelection(sel, categoryIndex){
  const idx = categoryIndex == null ? "" : String(categoryIndex);
  selectedCategoryIndex = idx;
  if(!sel) return;
  sel.dataset.selectedCategoryIndex = idx;
  Array.from(sel.querySelectorAll(".resource-listbox-option")).forEach((btn, index) => {
    const selected = btn.dataset.categoryIndex === idx;
    btn.setAttribute("aria-selected", selected ? "true" : "false");
    if(!btn.id) btn.id = `catOption_${index}`;
    if(selected){
      sel.dataset.selectedCategoryId = btn.dataset.categoryId || "";
      sel.setAttribute("aria-activedescendant", btn.id);
      btn.scrollIntoView({ block:"nearest" });
    }
  });
}

function getCategoryIndexFromBrowseSelection(sel){
  const selectedButton = sel ? sel.querySelector('.resource-listbox-option[aria-selected="true"]') : null;
  const selectedCategoryId = selectedButton && selectedButton.dataset.categoryId
    ? selectedButton.dataset.categoryId
    : (sel && sel.dataset.selectedCategoryId ? sel.dataset.selectedCategoryId : "");
  if(selectedCategoryId){
    const idxById = getCategoryIndexById(selectedCategoryId);
    if(idxById !== -1) return idxById;
  }
  const selectedIndex = selectedCategoryIndex !== ""
    ? selectedCategoryIndex
    : (sel && sel.dataset.selectedCategoryIndex != null ? sel.dataset.selectedCategoryIndex : "");
  if(selectedIndex === "") return -1;
  const idx = parseInt(selectedIndex, 10);
  return Number.isInteger(idx) ? idx : -1;
}

function moveCategoryBrowseSelection(sel, key){
  if(!sel) return;
  const options = Array.from(sel.querySelectorAll(".resource-listbox-option"));
  if(!options.length) return;
  const current = options.findIndex(btn => btn.dataset.categoryIndex === selectedCategoryIndex);
  let next = current === -1 ? 0 : current;
  if(key === "ArrowDown") next = Math.min(next + 1, options.length - 1);
  if(key === "ArrowUp") next = Math.max(next - 1, 0);
  if(key === "Home") next = 0;
  if(key === "End") next = options.length - 1;
  setCategoryBrowseSelection(sel, options[next].dataset.categoryIndex);
}

function newCategory(){
  if(!commitPendingEditsIfChanged()) return;
  const newIndex = data.categories.length;
  const categoryId = generateResourceId();

  data.categories.push({

    label: "",
    active: true,
    lastModified: nowISO(),
    filters: []
  });

  newCategoryIds.add(categoryId);
  adminTab = "categories";
  selectedCategoryIndex = String(newIndex);
  safeRenderAdmin();
  const labelInput = document.getElementById("cat_label");
  if(labelInput) labelInput.focus();
}

function cancelCategoryEdit(){
  if(!editing || editing.kind !== "category") return;
  const cat = data.categories[editing.idx];
  if(cat && newCategoryIds.has(cat.id)){
    data.categories.splice(editing.idx, 1);
    newCategoryIds.delete(cat.id);
    delete selectedCategoryFilters[cat.id];
    selectedCategoryIndex = "";
    editing = null;
    persist();
    safeRenderAdmin();
    return;
  }
  editCategory(editing.idx);
}

      if(!confirm(`Tag ${labels.length === 1 ? `the Type '${labels[0]}'` : `${labels.length} Types`} for deletion?\n\nResources will remain unchanged until an admin reviews and approves the deletion after a package merge.`)) return;
      tagDeletionRequests(labels.map(label => createDeletionRequest("type", {
        categoryId:category.id,
        label
      })), labels.length === 1 ? `tagged Type "${labels[0]}" for deletion` : "tagged Types for deletion");
    });
  }
  validateCategoryEditorState();
}

function addCategoryFilterRow(value){

// Resource admin owns the large resource editor. It normalizes For groups, categories,

function renderAdminResources(container){
  // Resource management view (browse list, edit mode, and For groups).
  if(adminResourceEditMode && !selectedResourceId && data.resources[0] && data.resources[0].id){
    selectedResourceId = data.resources[0].id;
  }

  if(!adminResourceEditMode){
    container.innerHTML += `
      <div class="admin-panel">

      <div class="resource-browse-wrap">
        <label class="admin-option-row" style="display:block;">

          Show verified dates
        </label>
            <div class="resource-browse-actions admin-action-row" style="margin-top:12px;">
              <button class="button" onclick="newResource()">New</button>
              <button class="button danger" onclick="deleteResource()">Delete</button>
              <span class="spacer"></span>
              <button class="button primary" onclick="openResourceEditor()">Edit</button>
            </div>
        <div id="resSelect" class="resource-button-listbox" role="listbox" tabindex="0" aria-label="Resources"></div>
          </div>
        </div>
      </div>
    `;

    const sel = document.getElementById("resSelect");

    if(sortToggle){

      sortToggle.onchange = () => {
        adminShowVerifiedDates = !!sortToggle.checked;
        populateResourceBrowseOptions(sel, selectedResourceId);
      };
    }

    populateResourceBrowseOptions(sel, selectedResourceId);
    sel.addEventListener("click", event => handleAdminResourceBrowseClick(event, sel));
    sel.addEventListener("dblclick", event => {
      if(!event.target.closest(".resource-listbox-option")) return;
      openResourceEditor();
    });
    sel.onkeydown = (e) => {
      if(e.key === "Enter"){
        e.preventDefault();
        openResourceEditor();
        return;
      }
      if(e.key === "Delete"){
        e.preventDefault();
        deleteResource();
        return;
      }
      if(["ArrowDown", "ArrowUp", "Home", "End"].includes(e.key)){
        e.preventDefault();
        moveResourceBrowseSelection(sel, e.key);
      }
    };

    editing = null;
    editorSnapshot = "";
    return;
  }

  const idx = getResourceIndexById(selectedResourceId);
  if(idx === -1){
    adminResourceEditMode = false;
    safeRenderAdmin();

  }

  container.innerHTML += `
    <div class="admin-panel">

        <div id="resEditor" style="margin-top:12px;"></div>
      </div>

  `;

  editResource(idx);
}

function populateResourceBrowseOptions(sel, preferredResourceId){
  if(!sel) return;
  const prev = preferredResourceId || selectedResourceId || sel.dataset.selectedResourceId || "";
  sel.innerHTML = "";

  const resources = getAdminResourceBrowseList();
  resources.forEach((r) => {
    const btn = document.createElement(isScoutReviewMode() ? "div" : "button");
    if(btn.tagName === "BUTTON") btn.type = "button";
    btn.className = "resource-listbox-option";
    btn.setAttribute("role", "option");
    btn.setAttribute("aria-selected", "false");
    btn.tabIndex = -1;
    btn.dataset.resourceId = String(r.id || "");
    const verifiedLabel = isValidMMYY(r.verifiedOn)
      ? `${r.name || ""} \u2014 ${formatVerifiedOnForDisplay(r.verifiedOn)}`
      : (r.name || "");
    const baseLabel = adminShowVerifiedDates ? verifiedLabel : (r.name || "");
    const displayLabel = hasDeletionRequest("resource", { targetId:r.id })
      ? `${baseLabel} — tagged for deletion`
      : baseLabel;
    if(isScoutReviewMode()){
      btn.classList.add("scout-review-resource-option");
      const ready = isScoutReviewResourceReady(r.id);
      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.className = "scout-review-ready-checkbox";
      checkbox.checked = ready;
      checkbox.setAttribute("aria-label", `Ready to package: ${r.name || "Unnamed resource"}`);
      checkbox.addEventListener("click", event => event.stopPropagation());
      checkbox.addEventListener("change", () => {
        selectedResourceId = String(r.id || "");
        setScoutReviewResourceReady(r.id, checkbox.checked);
        safeRenderAdmin();
      });
      const indicator = document.createElement("span");
      indicator.className = "scout-review-ready-indicator";
      indicator.textContent = ready ? "✓" : "";
      indicator.setAttribute("aria-hidden", "true");
      const label = document.createElement("span");
      label.textContent = displayLabel;
      btn.classList.toggle("scout-review-resource-ready", ready);
      btn.append(checkbox, indicator, label);
    }else{
      btn.textContent = displayLabel;
    }
    sel.appendChild(btn);
  });

  if(prev && resources.some(resource => String(resource.id || "") === prev)){
    setResourceBrowseSelection(sel, prev);
  }else if(resources.length){
    setResourceBrowseSelection(sel, String(resources[0].id || ""));
  }else{
    sel.dataset.selectedResourceId = "";
    sel.removeAttribute("aria-activedescendant");
    selectedResourceId = "";
  }
}

function setResourceBrowseSelection(sel, resourceId){
  const id = String(resourceId || "");
  selectedResourceId = id;
  if(!sel) return;
  sel.dataset.selectedResourceId = id;
  Array.from(sel.querySelectorAll(".resource-listbox-option")).forEach((btn, index) => {
    const selected = btn.dataset.resourceId === id;
    btn.setAttribute("aria-selected", selected ? "true" : "false");
    if(!btn.id) btn.id = `resOption_${index}`;
    if(selected){
      sel.setAttribute("aria-activedescendant", btn.id);
      btn.scrollIntoView({ block:"nearest" });
    }
  });
}

function handleAdminResourceBrowseClick(event, sel){
  const btn = event.target.closest(".resource-listbox-option");
  if(!btn || !sel || !sel.contains(btn)) return;
  setResourceBrowseSelection(sel, btn.dataset.resourceId || "");
  handleAdminResourceReferenceClick(event, { value:selectedResourceId });
}

function moveResourceBrowseSelection(sel, key){
  if(!sel) return;
  const options = Array.from(sel.querySelectorAll(".resource-listbox-option"));
  if(!options.length) return;
  const current = options.findIndex(btn => btn.dataset.resourceId === selectedResourceId);
  let next = current === -1 ? 0 : current;
  if(key === "ArrowDown") next = Math.min(next + 1, options.length - 1);
  if(key === "ArrowUp") next = Math.max(next - 1, 0);
  if(key === "Home") next = 0;
  if(key === "End") next = options.length - 1;
  setResourceBrowseSelection(sel, options[next].dataset.resourceId || "");
}

function newResource(){
  if(!commitPendingEditsIfChanged()) return;
  const resourceId = generateResourceId();

  const resource = {
    id: resourceId,
    name: "",
    description: "",
    informationText: "",
    categories: [],
    categoryFilters: {},
    forGroups: [],
    pdfs: [],
    verifiedOn: null
  };
  data.resources.push(resource);

  // Keep an invalid blank draft in memory only. It becomes durable when Done
  // validates and commits it; an interrupted editing session must not leave an
  // empty public Lists card in browser storage.
  newResourceIds.add(resourceId);
  adminTab = "resources";
  selectedResourceId = resource.id;
  adminResourceEditMode = true;
  safeRenderAdmin();
  focusAndSelectResourceName();
}

function discardNewResourceDraft(resourceId){
  const draftId = String(resourceId || "");
  if(!draftId || !newResourceIds.has(draftId)) return false;

  const sortedIds = getAdminResourceBrowseList().map(r => String(r.id || ""));
  const selectedPos = sortedIds.indexOf(draftId);
  const idx = getResourceIndexById(draftId);
  if(idx === -1){
    newResourceIds.delete(draftId);
    return false;
  }

  data.resources.splice(idx, 1);
  newResourceIds.delete(draftId);

  const remainingIds = getAdminResourceBrowseList().map(r => String(r.id || ""));
  if(!remainingIds.length){
    selectedResourceId = "";
    adminResourceEditMode = false;
  }else{
    const nextPos = Math.min(Math.max(selectedPos, 0), remainingIds.length - 1);
    selectedResourceId = remainingIds[nextPos];
  }
  return true;
}

function isBlankResourceDraft(resource){
  if(!resource) return false;
  const hasText = ["name", "description", "phone", "address", "website", "hours", "informationText"]
    .some(key => String(resource[key] || "").trim());
  const hasLists = ["categories", "forGroups", "pdfs"]
    .some(key => Array.isArray(resource[key]) && resource[key].length);
  const hasCategoryFilters = resource.categoryFilters
    && typeof resource.categoryFilters === "object"
    && Object.keys(resource.categoryFilters).some(key => normalizeCategoryFilters(resource.categoryFilters[key]).length);
  return !hasText && !hasLists && !hasCategoryFilters;
}

function deleteResource(){
  if(!commitPendingEditsIfChanged()) return;
  if(!selectedResourceId) return;

  const idx = getResourceIndexById(selectedResourceId);
  const res = data.resources[idx];
  if(!res) return;

  const confirmDelete = confirm(buildAdminDeleteConfirmation("resource", res.name || "(unnamed)"));
  if(!confirmDelete) return;
  if(isScoutReviewMode()){
    const sortedIds = getAdminResourceBrowseList().map(resource => String(resource.id || ""));
    const selectedPos = sortedIds.indexOf(String(res.id || ""));
    clearScoutReviewResourceReady(res.id);
    data.resources.splice(idx, 1);
    const remainingIds = getAdminResourceBrowseList().map(resource => String(resource.id || ""));
    selectedResourceId = remainingIds.length
      ? remainingIds[Math.min(Math.max(selectedPos, 0), remainingIds.length - 1)]
      : "";
    adminResourceEditMode = false;
    editing = null;
    editorSnapshot = "";
    persist();
    showToast(`Deleted proposed resource "${res.name || "(unnamed)"}".`);
    safeRender();
    safeRenderAdmin();
    return;
  }
  const updateDescription = prompt("Describe this update (optional):", "");
  if(updateDescription === null) return;
  tagDeletionRequests([createDeletionRequest("resource", {
    targetId:res.id,
    label:res.name || "(Unnamed resource)",
    description:updateDescription
  })], `tagged resource "${res.name}" for deletion`);
}

function validateResourceEditorState(idx){
  // Validation drives the sticky Done/Cancel buttons. Dirty-state visibility is
  // handled by updateResourceEditorActionBar(); this function only decides
  // whether Done must be disabled.
  const draft = resourceEditorDraft();
  if(!draft){
    showResourceNameWarning("");
    showResourceVerifiedWarning("");
    updateResourceEditorActionBar();
    const doneBtn = document.getElementById("res_done_btn");
    if(doneBtn) doneBtn.disabled = false;
    return;
  }

  const nameValidation = validateResourceName(draft, idx);
  const verifiedValidation = validateVerifiedOnInput(draft.verifiedOn);
  showResourceNameWarning(nameValidation.message);
  showResourceVerifiedWarning(verifiedValidation.message);
  const shouldDisableDone = !(nameValidation.valid && verifiedValidation.valid);
  updateResourceEditorActionBar(shouldDisableDone);
  const doneBtn = document.getElementById("res_done_btn");
  if(doneBtn) doneBtn.disabled = shouldDisableDone;
}

    const files = Array.from((e.target.files || [])).filter(file => file && (/\.pdf$/i.test(file.name) || file.type === "application/pdf"));
    if(!files.length) return;
    if(!commitPendingEditsIfChanged()) return;

    const current = data.resources[idx];
    if(!current) return;
    normalizeResourcePDFs(current);
    try{
      for(const file of files){
        const id = generateResourceId();
        const key = buildPDFStoragePath(current.id, id, file.name);
        await savePDF(key, file);
        current.pdfs.push({ id, name:file.name || "PDF", path:key });
      }
      clearScoutReviewResourceReady(current.id);
      current.lastModified = nowISO();
      persist();
      editResource(idx);
    }catch(err){
      alert("Unable to attach PDF: " + err.message);
    }
  };

  document.querySelectorAll("[data-remove-pdf-id]").forEach(btn => {
    btn.onclick = async () => {
      if(!commitPendingEditsIfChanged()) return;
      const current = data.resources[idx];
      if(!current) return;
      const pdfId = btn.getAttribute("data-remove-pdf-id");
      const removed = removePDFAttachmentFromResource(current, pdfId);
      if(!removed) return;
      try{
        clearScoutReviewResourceReady(current.id);
        current.lastModified = nowISO();
        persist();
        if(!isPDFPathReferenced(removed.path)){
          await deletePDF(removed.path);
        }
        editResource(idx);
      }catch(err){
        alert("Unable to remove PDF: " + err.message);
      }
    };
  });
}

function getResourcesUsingForGroup(group){

  return (Array.isArray(data.resources) ? data.resources : [])
    .filter(resource => normalizeTaxonomyLabels(resource && resource.forGroups).some(resourceGroup => resourceGroup.toLowerCase() === groupKey))

function applyForGroupsDraft(draft){
  const previousGroups = normalizeTaxonomyLabels(data.forGroups);
  const nextGroups = normalizeTaxonomyLabels(draft && draft.forGroups);
  const nextKeys = new Set(nextGroups.map(group => group.toLowerCase()));
  const removedGroups = previousGroups.filter(group => !nextKeys.has(group.toLowerCase()));

    ), "requestedAt");
  }
  data.forGroups = normalizeTaxonomyLabels([...nextGroups, ...removedGroups]);

// ============================================================
// OFFICE CONTEXT, SETUP, AND LOCAL PUBLICATION HISTORY
// ============================================================
// This module describes only the office file currently open. It deliberately
// does not contain an office registry, and none of this state is package data.

const PUBLICATION_HISTORY_SCHEMA_VERSION = 1;
const PUBLICATION_HISTORY_LIMIT = 10;
let officeSetupDirectoryHandle = null;

function getPublicationHistoryStorageKey(storageId = STORAGE_KEY_PREFIX){
  return `${normalizeStorageId(storageId)}PublicationHistory`;
}

function normalizePublicationHistoryEntry(entry){
  if(!entry || typeof entry !== "object" || Array.isArray(entry)) return null;
  const savedAt = Date.parse(String(entry.savedAt || "")) ? String(entry.savedAt) : "";
  const fileName = String(entry.fileName || "").trim();
  if(!savedAt || !fileName) return null;
  const id = String(entry.id || `publication:${savedAt}:${fileName}`).trim();
  const replacedAt = Date.parse(String(entry.replacedAt || "")) ? String(entry.replacedAt) : "";
  return {
    id,
    savedAt,
    replacedAt,
    packageVersion:normalizePackageVersionValue(entry.packageVersion),
    fileName,
    resourceCount:Number.isFinite(Number(entry.resourceCount)) ? Number(entry.resourceCount) : 0,
    resourcesAdded:Number.isFinite(Number(entry.resourcesAdded)) ? Number(entry.resourcesAdded) : 0,
    resourcesUpdated:Number.isFinite(Number(entry.resourcesUpdated)) ? Number(entry.resourcesUpdated) : 0,
    approvedDeletions:Number.isFinite(Number(entry.approvedDeletions)) ? Number(entry.approvedDeletions) : 0,
    sharePointFolder:String(entry.sharePointFolder || "").trim(),
    sharePointLibraryUrl:String(entry.sharePointLibraryUrl || "").trim()
  };
}

const PublicationHistoryStore = Object.freeze({
  load(storageId = STORAGE_KEY_PREFIX){
    try{
      const parsed = JSON.parse(localStorage.getItem(getPublicationHistoryStorageKey(storageId)) || "null");
      const entries = Array.isArray(parsed)
        ? parsed
        : (parsed && Array.isArray(parsed.entries) ? parsed.entries : []);
      return entries
        .map(normalizePublicationHistoryEntry)
        .filter(Boolean)
        .sort((a, b) => String(b.savedAt).localeCompare(String(a.savedAt)))
        .slice(0, PUBLICATION_HISTORY_LIMIT);
    }catch(_err){
      return [];
    }
  },

  save(entries, storageId = STORAGE_KEY_PREFIX){
    const normalized = (Array.isArray(entries) ? entries : [])
      .map(normalizePublicationHistoryEntry)
      .filter(Boolean)
      .sort((a, b) => String(b.savedAt).localeCompare(String(a.savedAt)))
      .slice(0, PUBLICATION_HISTORY_LIMIT);
    localStorage.setItem(getPublicationHistoryStorageKey(storageId), JSON.stringify({
      schemaVersion:PUBLICATION_HISTORY_SCHEMA_VERSION,
      entries:normalized
    }));
    return normalized;
  },

  recordSaved(summary, storageId = STORAGE_KEY_PREFIX){
    const savedAt = Date.parse(String(summary && summary.savedAt || ""))
      ? String(summary.savedAt)
      : nowISO();
    const entry = normalizePublicationHistoryEntry({
      ...summary,
      id:String(summary && summary.id || `publication:${savedAt}:${Math.random().toString(16).slice(2, 10)}`),
      savedAt,
      replacedAt:""
    });
    if(!entry) throw new Error("The local publication record is incomplete.");
    const entries = this.load(storageId).filter(item => item.id !== entry.id);
    this.save([entry, ...entries], storageId);
    return entry;
  },

  confirmReplaced(publicationId, confirmedAt = nowISO(), storageId = STORAGE_KEY_PREFIX){
    const id = String(publicationId || "");
    let confirmed = null;
    const entries = this.load(storageId).map(entry => {
      if(entry.id !== id) return entry;
      confirmed = normalizePublicationHistoryEntry({ ...entry, replacedAt:confirmedAt });
      return confirmed;
    });
    if(!confirmed) return null;
    this.save(entries, storageId);
    return confirmed;
  }
});

function evaluateOfficeSetupStatus(context){
  const storageId = String(context && context.storageId || "").trim();
  const tsoName = String(context && context.tsoName || "").trim();
  const expectedPackageFileName = String(context && context.expectedPackageFileName || "").trim();
  const target = context && context.target;
  const directoryHandle = context && context.directoryHandle;
  const directoryPermission = String(context && context.directoryPermission || "denied");
  const issues = [];
  if(!storageId || normalizeStorageId(storageId) === "new"){
    issues.push("Open an office-specific HTML file with a configured storage ID.");
  }
  if(!tsoName) issues.push("Enter the TSO name.");
  if(!expectedPackageFileName) issues.push("The expected resource-package filename could not be determined.");
  if(!target) issues.push("Save a valid SharePoint resource-package URL.");
  if(!directoryHandle) issues.push("Choose the folder where Edge saves the SharePoint package.");
  else if(directoryPermission !== "granted") issues.push("Authorize read and write access to the download folder.");
  return {
    complete:issues.length === 0,
    issues,
    storageId,
    tsoName,
    expectedPackageFileName,
    target:target || null,
    directoryHandle:directoryHandle || null,
    directoryName:String(directoryHandle && directoryHandle.name || ""),
    directoryPermission
  };
}

async function getOfficeSetupStatus(options = {}){
  const storageId = getConfiguredStorageId();
  const tsoName = getTsoName();
  const expectedPackageFileName = getExpectedSharePointPackageFileName();
  const target = getSharePointPublishingTarget();
  const directoryHandle = options.directoryHandle !== undefined
    ? options.directoryHandle
    : await loadPublishingDirectoryHandle();
  let directoryPermission = await queryPublishingDirectoryPermission(directoryHandle);
  if(options.requestPermission && directoryHandle && directoryPermission !== "granted"
    && typeof directoryHandle.requestPermission === "function"){
    try{
      directoryPermission = await directoryHandle.requestPermission({ mode:"readwrite" });
    }catch(_err){
      directoryPermission = "denied";
    }
  }
  return evaluateOfficeSetupStatus({
    storageId,
    tsoName,
    expectedPackageFileName,
    target,
    directoryHandle,
    directoryPermission
  });
}

const OfficeContext = Object.freeze({
  get storageId(){ return getConfiguredStorageId(); },
  get tsoName(){ return getTsoName(); },
  get expectedPackageFileName(){ return getExpectedSharePointPackageFileName(); },

function formatLocalDateTime(value){
  const date = new Date(String(value || ""));
  return Number.isFinite(date.getTime()) ? date.toLocaleString() : "Unknown time";
}

function officePublicationHistoryHTML(entries = PublicationHistoryStore.load()){

      ${history.slice(0, 5).map(entry => `
        <div class="office-publication-entry">
          <strong>Resource Package ${escapeHTML(String(entry.packageVersion))}</strong>
          <span>${escapeHTML(entry.fileName)} · saved ${escapeHTML(formatLocalDateTime(entry.savedAt))}</span>
          <span>${entry.replacedAt
            ? `Replacement recorded ${escapeHTML(formatLocalDateTime(entry.replacedAt))}`
            : "SharePoint replacement not yet recorded"}</span>
        </div>
      `).join("")}
    </div>

}

function renderOfficeSetupStatus(status, message = ""){
  const statusBox = document.getElementById("officeSetupStatus");
  const folderStatus = document.getElementById("officeSetupFolderStatus");
  if(folderStatus){
    const folderName = status && status.directoryName ? `<strong>${escapeHTML(status.directoryName)}</strong>: ` : "";
    const permissionText = !status || !status.directoryHandle
      ? "No folder selected"
      : (status.directoryPermission === "granted" ? "Authorized" : "Authorization required");
    folderStatus.innerHTML = `${folderName}${escapeHTML(permissionText)}`;
  }
  if(!statusBox) return;
  if(!status){
    statusBox.className = "office-setup-status";
    statusBox.innerHTML = "Checking configuration…";
    return;
  }
  statusBox.className = `office-setup-status ${status.complete ? "complete" : "incomplete"}`;
  statusBox.innerHTML = `
    <strong>${status.complete ? "Setup complete" : "Setup incomplete"}</strong>
    ${message ? `<p>${escapeHTML(message)}</p>` : ""}
    ${status.issues.length ? `<ul>${status.issues.map(issue => `<li>${escapeHTML(issue)}</li>`).join("")}</ul>` : ""}
  `;
}

async function refreshOfficeSetupStatus(options = {}){
  renderOfficeSetupStatus(null);
  try{
    const status = await getOfficeSetupStatus({
      directoryHandle:officeSetupDirectoryHandle === null ? undefined : officeSetupDirectoryHandle,
      requestPermission:!!options.requestPermission
    });
    officeSetupDirectoryHandle = status.directoryHandle;
    renderOfficeSetupStatus(status, options.message || "");
    return status;
  }catch(err){
    renderOfficeSetupStatus(evaluateOfficeSetupStatus({
      storageId:getConfiguredStorageId(),
      tsoName:getTsoName(),
      expectedPackageFileName:getExpectedSharePointPackageFileName(),
      target:getSharePointPublishingTarget(),
      directoryHandle:null,
      directoryPermission:"denied"

  }
}

async function saveOfficeSetupFromModal(options = {}){
  const nameInput = document.getElementById("adminSetupTsoName");
  const urlInput = document.getElementById("officeSetupSharePointUrl");
  const nextName = String(nameInput && nameInput.value || "").trim();
  const destinationInput = String(urlInput && urlInput.value || "").trim();
  const configuredOfficeName = getConfiguredOfficeName();
  const configuredSharePointUrl = getConfiguredSharePointPackageUrl();
  if(configuredOfficeName){
    localStorage.removeItem(TSO_NAME_STORAGE_KEY);
  }else if(nextName){
    localStorage.setItem(TSO_NAME_STORAGE_KEY, nextName);
    if(isNewTemplateFile()) markRenamedAdminTrainingPending(nextName);
  }else{
    localStorage.removeItem(TSO_NAME_STORAGE_KEY);
    if(isNewTemplateFile()) localStorage.removeItem(NEW_ADMIN_TRAINING_PENDING_KEY);
  }
  refreshAppTitle();
  updateOfficeSetupExpectedFilename();

  try{
    if(configuredSharePointUrl){
      localStorage.removeItem(getSharePointPublishingTargetStorageKey());
    }else if(destinationInput){
      const target = parseSharePointPublishingUrl(
        destinationInput,
        getExpectedSharePointPackageFileName(),
        getSharePointPublishingOfficeName()
      );
      saveSharePointPublishingTarget({ ...target, configuredAt:nowISO() });
    }else{
      localStorage.removeItem(getSharePointPublishingTargetStorageKey());
    }
  }catch(err){
    renderOfficeSetupStatus(evaluateOfficeSetupStatus({
      storageId:getConfiguredStorageId(),
      tsoName:getTsoName(),
      expectedPackageFileName:getExpectedSharePointPackageFileName(),
      target:null,
      directoryHandle:officeSetupDirectoryHandle,
      directoryPermission:await queryPublishingDirectoryPermission(officeSetupDirectoryHandle)
    }), err && err.message ? err.message : String(err));
    return false;
  }

  safeRender();
  const status = await refreshOfficeSetupStatus({
    requestPermission:!!options.requestPermission,
    message:options.testConfiguration ? "Configuration test completed." : "Office setup saved locally."
  });
  if(!options.silent) showToast(options.testConfiguration ? "Configuration tested." : "Office setup saved.");
  return !!status;
}

  if(folderBtn) folderBtn.addEventListener("click", chooseOfficeSetupDirectory);
  modal.classList.remove("hidden");
  refreshOfficeSetupStatus();
}

// Source: src/js/105-sharepoint-publishing.js
// ============================================================
// GUIDED SHAREPOINT PUBLISHING
// ============================================================
// The office app runs from a local file, so SharePoint authentication and the
// final replacement stay in Edge. Each office configures its selected ZIP URL
// locally, then authorizes one local folder. The workflow watches for the
// completed SharePoint download, merges it with the prepared local data, and
// writes the canonical ZIP name for upload.

const SHAREPOINT_PUBLISHING_TARGET_SCHEMA_VERSION = 1;
const SHAREPOINT_PUBLISHING_ALLOWED_HOST = "churchofjesuschrist.sharepoint.com";
const SHAREPOINT_PUBLISHING_SITE_PATH = "/sites/WSR_TSO/";
const SHAREPOINT_PUBLISHING_DIRECTORY_KEY = "__sharePointPublishingDirectoryHandle__";
const SHAREPOINT_PUBLISHING_POLL_MS = 1000;
const SHAREPOINT_PUBLISHING_TIMEOUT_MS = 15 * 60 * 1000;
let sharePointPublishRun = null;

function getSharePointPublishingTargetStorageKey(storageId = STORAGE_KEY_PREFIX){
  return `${normalizeStorageId(storageId)}SharePointPublishingTarget`;
}

function getStoredSharePointPublishingUrl(storageId = STORAGE_KEY_PREFIX){
  try{
    const stored = JSON.parse(localStorage.getItem(getSharePointPublishingTargetStorageKey(storageId)) || "null");
    return stored && typeof stored === "object"
      && Number(stored.schemaVersion) === SHAREPOINT_PUBLISHING_TARGET_SCHEMA_VERSION
      ? String(stored.packageViewUrl || "")
      : "";
  }catch(_err){
    return "";
  }
}

function getConfiguredSharePointPublishingUrl(storageId = STORAGE_KEY_PREFIX){
  const currentStorageId = normalizeStorageId(getConfiguredStorageId());
  if(normalizeStorageId(storageId) === currentStorageId){
    const embeddedUrl = getConfiguredSharePointPackageUrl();
    if(embeddedUrl) return embeddedUrl;
  }
  return getStoredSharePointPublishingUrl(storageId);
}

function canChangeSharePointPublishingDestination(){
  return !getConfiguredSharePointPackageUrl();
}

function changeSharePointPublishingDestinationButtonHTML(){
  return canChangeSharePointPublishingDestination()
    ? `<button class="button" type="button" onclick="beginChangeSharePointPublishingDestination()">Change SharePoint destination</button>`
    : "";
}

function getSharePointPublishingOfficeName(storageId = STORAGE_KEY_PREFIX){
  const normalized = normalizeStorageId(storageId);
  if(normalized === STORAGE_KEY_PREFIX){
    return getTsoName() || getTsoNameFromHtmlFileName(getCurrentHtmlFileName()) || "This office";
  }
  return String(normalized || "")
    .replace(/([a-z0-9])([A-Z])/g, "$1 $2")
    .split(/\s+/)
    .filter(Boolean)
    .map(word => word.charAt(0).toUpperCase() + word.slice(1).toLowerCase())
    .join(" ") || "This office";
}

function getExpectedSharePointPackageFileName(storageId = STORAGE_KEY_PREFIX){
  const normalized = normalizeStorageId(storageId);
  if(normalized === STORAGE_KEY_PREFIX && isSharePointPublishingAvailable(getConfiguredStorageId())){
    return getResourcePackageZipFilename();
  }
  const stem = String(normalized || "tso")
    .replace(/([a-z0-9])([A-Z])/g, "$1-$2")
    .replace(/[^a-z0-9]+/gi, "-")
    .replace(/^-+|-+$/g, "")
    .toLowerCase() || "tso";
  return `${stem}-resource-package.zip`;
}

function normalizeSharePointServerPath(value){
  let path = String(value || "").trim();
  try{
    path = decodeURIComponent(path);
  }catch(_err){}
  path = path.replace(/\\/g, "/").replace(/\/{2,}/g, "/");
  if(path.length > 1) path = path.replace(/\/+$/g, "");
  return path;
}

function getSharePointPathParent(path){
  const normalized = normalizeSharePointServerPath(path);
  const separatorIndex = normalized.lastIndexOf("/");
  return separatorIndex > 0 ? normalized.slice(0, separatorIndex) : "";
}

function getSharePointPathFileName(path){
  return normalizeSharePointServerPath(path).split("/").filter(Boolean).pop() || "";
}

function parseSharePointPublishingUrl(value, expectedPackageFileName = getExpectedSharePointPackageFileName(), officeName = getSharePointPublishingOfficeName()){
  const rawUrl = String(value || "").trim();
  if(!rawUrl) throw new Error("Paste the address-bar URL for this office's SharePoint resource-package ZIP.");

  let url;
  try{
    url = new URL(rawUrl);
  }catch(_err){
    throw new Error("The SharePoint address is not a valid URL.");
  }
  if(url.protocol !== "https:" || url.hostname.toLowerCase() !== SHAREPOINT_PUBLISHING_ALLOWED_HOST || url.port){
    throw new Error(`The address must use https://${SHAREPOINT_PUBLISHING_ALLOWED_HOST}.`);
  }

  const pagePath = normalizeSharePointServerPath(url.pathname);
  if(!pagePath.toLowerCase().startsWith(SHAREPOINT_PUBLISHING_SITE_PATH.toLowerCase())
    || !/\/forms\/allitems\.aspx$/i.test(pagePath)){
    throw new Error("Open the resource-package ZIP in the WSR_TSO SharePoint library, then copy that address-bar URL.");
  }

  const packagePath = normalizeSharePointServerPath(url.searchParams.get("id"));
  const parentPath = normalizeSharePointServerPath(url.searchParams.get("parent"));
  if(!packagePath || !parentPath){
    throw new Error("The address must identify both the SharePoint ZIP and its containing folder.");
  }
  if(!packagePath.toLowerCase().startsWith(SHAREPOINT_PUBLISHING_SITE_PATH.toLowerCase())
    || !parentPath.toLowerCase().startsWith(SHAREPOINT_PUBLISHING_SITE_PATH.toLowerCase())){
    throw new Error("The selected ZIP must be stored under the WSR_TSO SharePoint site.");
  }
  if(packagePath.split("/").some(part => part === "." || part === "..")
    || parentPath.split("/").some(part => part === "." || part === "..")){
    throw new Error("The SharePoint package path is invalid.");
  }
  if(getSharePointPathParent(packagePath).toLowerCase() !== parentPath.toLowerCase()){
    throw new Error("The selected ZIP and its SharePoint folder do not match.");
  }

  const packageFileName = getSharePointPathFileName(packagePath);
  if(!/\.zip$/i.test(packageFileName)){
    throw new Error("The selected SharePoint item is not a ZIP resource package.");
  }
  if(String(packageFileName).toLowerCase() !== String(expectedPackageFileName).toLowerCase()){
    throw new Error(`Select ${expectedPackageFileName} for ${officeName}. The pasted address points to ${packageFileName}.`);
  }

  const packageViewUrl = new URL(url.pathname, url.origin);
  packageViewUrl.searchParams.set("id", packagePath);
  packageViewUrl.searchParams.set("parent", parentPath);
  const libraryUrl = new URL(url.pathname, url.origin);
  libraryUrl.searchParams.set("id", parentPath);

  return {
    schemaVersion:SHAREPOINT_PUBLISHING_TARGET_SCHEMA_VERSION,
    officeName,
    packageFileName,
    packagePath,
    parentPath,
    packageViewUrl:packageViewUrl.toString(),
    libraryUrl:libraryUrl.toString()
  };
}

function saveSharePointPublishingTarget(target, storageId = STORAGE_KEY_PREFIX){
  const storedTarget = {
    schemaVersion:SHAREPOINT_PUBLISHING_TARGET_SCHEMA_VERSION,
    packageViewUrl:String(target && target.packageViewUrl || ""),
    configuredAt:String(target && target.configuredAt || nowISO())
  };
  localStorage.setItem(getSharePointPublishingTargetStorageKey(storageId), JSON.stringify(storedTarget));
}

function getSharePointPublishingTarget(storageId = STORAGE_KEY_PREFIX){
  try{
    const configuredUrl = getConfiguredSharePointPublishingUrl(storageId);
    if(!configuredUrl) return null;
    const stored = JSON.parse(localStorage.getItem(getSharePointPublishingTargetStorageKey(storageId)) || "null");
    const parsed = parseSharePointPublishingUrl(
      configuredUrl,
      getExpectedSharePointPackageFileName(storageId),
      getSharePointPublishingOfficeName(storageId)
    );
    parsed.configuredAt = String(stored && stored.configuredAt || "");
    return parsed;
  }catch(_err){
    return null;
  }
}

function isSharePointPublishingAvailable(storageId = getConfiguredStorageId()){
  const normalized = String(storageId || "").trim();
  return !!normalized && normalizeStorageId(normalized) !== "new";
}

function escapeRegularExpression(value){
  return String(value || "").replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
}

function isPublishingPackageFileName(fileName, canonicalFileName){
  const canonical = String(canonicalFileName || "");
  const stem = canonical.replace(/\.zip$/i, "");
  if(!stem || !/\.zip$/i.test(canonical)) return false;
  return new RegExp(`^${escapeRegularExpression(stem)}(?: \\(\\d+\\))?\\.zip$`, "i")
    .test(String(fileName || ""));
}

function clearSharePointPublishingTimer(){
  if(!sharePointPublishRun || !sharePointPublishRun.pollTimer) return;
  clearTimeout(sharePointPublishRun.pollTimer);
  sharePointPublishRun.pollTimer = null;
}

function setSharePointPublishingState(state, details = {}){
  if(!sharePointPublishRun) return;
  sharePointPublishRun.state = state;
  Object.assign(sharePointPublishRun, details);
  renderSharePointPublishingModal();
}

async function queryPublishingDirectoryPermission(handle){
  if(!handle) return "denied";
  if(typeof handle.queryPermission !== "function") return "granted";
  try{
    return await handle.queryPermission({ mode:"readwrite" });
  }catch(_err){
    return "denied";
  }
}

async function loadPublishingDirectoryHandle(){
  try{
    const handle = await loadAsset(SHAREPOINT_PUBLISHING_DIRECTORY_KEY);
    return handle && handle.kind === "directory" ? handle : null;
  }catch(_err){
    return null;
  }
}

async function rememberPublishingDirectoryHandle(handle){
  try{
    await saveAsset(SHAREPOINT_PUBLISHING_DIRECTORY_KEY, handle);
  }catch(_err){
    // The selected handle remains usable for this tab even if Edge declines to
    // persist it. The next publishing run will simply ask for the folder again.
  }
}

async function listPublishingPackageFiles(directoryHandle, target){
  const matches = [];
  if(!directoryHandle || typeof directoryHandle.entries !== "function") return matches;
  for await (const [name, handle] of directoryHandle.entries()){
    if(!handle || handle.kind !== "file") continue;
    if(!isPublishingPackageFileName(name, target.packageFileName)) continue;
    try{
      const file = await handle.getFile();
      matches.push({
        name,
        handle,
        file,
        lastModified:Number(file.lastModified || 0),
        size:Number(file.size || 0)
      });
    }catch(_err){}
  }
  return matches;
}

function publishingFileSnapshot(files){
  const snapshot = new Map();
  (Array.isArray(files) ? files : []).forEach(file => {
    snapshot.set(file.name, {
      lastModified:file.lastModified,
      size:file.size
    });
  });
  return snapshot;
}

function findNewPublishingDownload(files, baseline){
  const candidates = (Array.isArray(files) ? files : []).filter(file => {
    const previous = baseline instanceof Map ? baseline.get(file.name) : null;
    return !previous
      || previous.lastModified !== file.lastModified
      || previous.size !== file.size;
  });
  candidates.sort((a, b) => b.lastModified - a.lastModified || b.size - a.size);
  return candidates[0] || null;
}

async function preparePublishingDirectory(handle){
  if(!sharePointPublishRun) return;
  sharePointPublishRun.directoryHandle = handle;
  const files = await listPublishingPackageFiles(handle, sharePointPublishRun.target);
  sharePointPublishRun.baseline = publishingFileSnapshot(files);
  setSharePointPublishingState("ready", {
    directoryName:String(handle && handle.name || "publishing folder"),
    errorMessage:""
  });
}

async function chooseSharePointPublishingDirectory(){
  if(!sharePointPublishRun) return;
  if(typeof window.showDirectoryPicker !== "function"){
    setSharePointPublishingState("manual-ready", {
      errorMessage:"This version of Edge cannot monitor a publishing folder. Download the ZIP, then select it manually."
    });
    return;
  }
  try{
    const handle = await window.showDirectoryPicker({
      id:"tso-sharepoint-publishing",
      startIn:"downloads",
      mode:"readwrite"
    });
    await rememberPublishingDirectoryHandle(handle);
    await preparePublishingDirectory(handle);
  }catch(err){
    if(err && err.name === "AbortError") return;
    setSharePointPublishingState("error", {
      errorMessage:`The publishing folder could not be opened: ${err && err.message ? err.message : err}`
    });
  }
}

async function allowSharePointPublishingDirectory(){
  if(!sharePointPublishRun || !sharePointPublishRun.directoryHandle) return;
  const handle = sharePointPublishRun.directoryHandle;
  try{
    const permission = typeof handle.requestPermission === "function"
      ? await handle.requestPermission({ mode:"readwrite" })
      : "granted";
    if(permission !== "granted"){
      setSharePointPublishingState("permission", {
        errorMessage:"Edge needs read and write access to this folder before publishing can continue."
      });
      return;
    }
    await preparePublishingDirectory(handle);
  }catch(err){
    setSharePointPublishingState("permission", {
      errorMessage:`Folder access was not granted: ${err && err.message ? err.message : err}`
    });
  }
}

function beginSharePointPackageDownload(){
  if(!sharePointPublishRun || !sharePointPublishRun.directoryHandle) return false;
  clearSharePointPublishingTimer();
  setSharePointPublishingState("waiting", {
    startedAt:Date.now(),
    errorMessage:""
  });
  pollForSharePointPackageDownload();
  return true;
}

async function pollForSharePointPackageDownload(){
  const run = sharePointPublishRun;
  if(!run || run.state !== "waiting") return;
  try{
    const files = await listPublishingPackageFiles(run.directoryHandle, run.target);
    const downloaded = findNewPublishingDownload(files, run.baseline);
    if(downloaded){
      await mergeAndSaveSharePointPackage(downloaded);
      return;
    }
  }catch(err){
    setSharePointPublishingState("error", {
      errorMessage:`The publishing folder could not be checked: ${err && err.message ? err.message : err}`
    });
    return;
  }

  if(Date.now() - run.startedAt >= SHAREPOINT_PUBLISHING_TIMEOUT_MS){
    setSharePointPublishingState("error", {
      errorMessage:"The downloaded package was not found. Confirm that Edge saved it in the selected publishing folder, or select the downloaded package manually."
    });
    return;
  }
  run.pollTimer = setTimeout(pollForSharePointPackageDownload, SHAREPOINT_PUBLISHING_POLL_MS);
}

function summarizePreparedPublication(preparedData, canonicalData){
  const preparedResources = Array.isArray(preparedData && preparedData.resources) ? preparedData.resources : [];
  const canonicalResources = new Map(
    (Array.isArray(canonicalData && canonicalData.resources) ? canonicalData.resources : [])
      .map(resource => [String(resource && resource.id || ""), resource])
      .filter(([id]) => id)
  );
  const canonicallyDeletedResourceIds = new Set(
    mergeDeletionRecords([], canonicalData && canonicalData.deletions, "deletedAt")
      .filter(record => record.kind === "resource")
      .map(record => record.targetId)
  );
  let resourcesAdded = 0;
  let resourcesUpdated = 0;
  preparedResources.forEach(resource => {
    const id = String(resource && resource.id || "");
    if(!id || canonicallyDeletedResourceIds.has(id)) return;
    const canonical = canonicalResources.get(id);
    if(!canonical){
      resourcesAdded += 1;
      return;
    }
    const choice = chooseMergeObject(resource, canonical);
    if(choice.item === resource && objectsDiffer(resource, canonical)) resourcesUpdated += 1;
  });

  const canonicalDeletionKeys = new Set(
    mergeDeletionRecords([], canonicalData && canonicalData.deletions, "deletedAt")
      .map(record => record.key)
  );
  const approvedDeletions = mergeDeletionRecords([], preparedData && preparedData.deletions, "deletedAt")
    .filter(record => !canonicalDeletionKeys.has(record.key)).length;
  return { resourcesAdded, resourcesUpdated, approvedDeletions };
}

async function mergeAndSaveSharePointPackage(downloaded){
  const run = sharePointPublishRun;
  if(!run || !downloaded || !downloaded.file) return;
  clearSharePointPublishingTimer();
  const preparedDataSnapshot = cloneDataObject(data);
  setSharePointPublishingState("merging", {
    downloadedFileName:downloaded.name,
    warnings:[]
  });

  try{
    const warnings = [];
    const mergeResult = await mergeImportPackage({
      target: {
        files:[downloaded.file],
        value:"",
        remove(){}
      }
    }, {
      preservePreparedChanges:true,
      skipDeletionReview:true,
      silent:true,
      onWarnings:blocks => warnings.push(...blocks)
    });
    if(!mergeResult) throw new Error("The downloaded resource package could not be merged.");

    const outputHandle = run.directoryHandle && typeof run.directoryHandle.getFileHandle === "function"
      ? await run.directoryHandle.getFileHandle(run.target.packageFileName, { create:true })
      : null;
    const saveTarget = outputHandle
      ? {
          kind:"file-handle",
          handle:outputHandle,
          suggestedName:run.target.packageFileName
        }
      : {
          kind:"download",
          suggestedName:run.target.packageFileName
        };
    const saved = await saveCurrentResourcePackage(saveTarget, { showSuccessToast:false });
    if(!saved) throw new Error("Publishing was canceled before the merged package was saved.");

    const savedAt = nowISO();
    const publishedChanges = summarizePreparedPublication(preparedDataSnapshot, mergeResult.importedData);
    let publicationRecord = null;
    try{
      publicationRecord = PublicationHistoryStore.recordSaved({
        savedAt,
        packageVersion:saved.packageVersion,
        fileName:run.target.packageFileName,
        resourceCount:saved.resourceCount,
        ...publishedChanges,
        sharePointFolder:String(run.target.parentPath || ""),
        sharePointLibraryUrl:String(run.target.libraryUrl || "")
      });
    }catch(err){
      warnings.push(
        `The package was saved, but its local publishing-history entry could not be recorded: ${err && err.message ? err.message : err}`
      );
    }
    if(outputHandle) lastOpenedResourcePackageHandle = outputHandle;
    setSharePointPublishingState("complete", {
      outputFileName:run.target.packageFileName,
      outputLocation:outputHandle
        ? String(run.directoryName || "publishing folder")
        : "your browser's Downloads folder",
      packageVersion:saved.packageVersion,
      resourceCount:saved.resourceCount,
      savedAt,
      resourcesAdded:publishedChanges.resourcesAdded,
      resourcesUpdated:publishedChanges.resourcesUpdated,
      approvedDeletions:publishedChanges.approvedDeletions,
      publicationId:publicationRecord && publicationRecord.id || "",
      warnings
    });
  }catch(err){
    data = normalizePackageData(preparedDataSnapshot);
    persist();
    safeRender();
    setSharePointPublishingState("error", {
      errorMessage:`Publishing stopped before a package was saved: ${err && err.message ? err.message : err}`
    });
  }
}

async function chooseDownloadedPackageForPublishing(){
  if(!sharePointPublishRun || typeof window.showOpenFilePicker !== "function") return;
  try{
    const handles = await window.showOpenFilePicker({
      id:"tso-sharepoint-publishing-package",
      startIn:sharePointPublishRun.directoryHandle || "downloads",
      multiple:false
    });
    const handle = handles && handles[0];
    if(!handle) return;
    const file = await handle.getFile();
    await mergeAndSaveSharePointPackage({
      name:file.name,
      handle,
      file,
      lastModified:Number(file.lastModified || 0),
      size:Number(file.size || 0)
    });
  }catch(err){
    if(err && err.name === "AbortError") return;
    setSharePointPublishingState("error", {
      errorMessage:`The downloaded package could not be selected: ${err && err.message ? err.message : err}`
    });
  }
}

async function checkAgainForSharePointDownload(){
  if(!sharePointPublishRun) return;
  if(!sharePointPublishRun.directoryHandle){
    setSharePointPublishingState("manual-ready");
    return;
  }
  setSharePointPublishingState("waiting", {
    startedAt:Date.now(),
    errorMessage:""
  });
  await pollForSharePointPackageDownload();
}

function confirmSharePointPackageUploaded(){
  if(!sharePointPublishRun) return;
  const confirmedAt = nowISO();
  let historyRecorded = false;
  if(sharePointPublishRun.publicationId){
    try{
      historyRecorded = !!PublicationHistoryStore.confirmReplaced(
        sharePointPublishRun.publicationId,
        confirmedAt
      );
    }catch(_err){}
  }
  const undo = getUndoSnapshot();
  if(undo && /^approved deletion/i.test(String(undo.message || ""))){
    clearUndoSnapshot();
  }
  setSharePointPublishingState("uploaded", {
    replacementRecordedAt:confirmedAt,
    historyRecorded
  });
  safeRenderAdmin();
}

function reviewSharePointPublishingDestination(){
  if(!sharePointPublishRun) return;
  const input = document.getElementById("sharePointPublishingUrl");
  const destinationInput = String(input && input.value || sharePointPublishRun.destinationInput || "").trim();
  sharePointPublishRun.destinationInput = destinationInput;
  try{
    const pendingTarget = parseSharePointPublishingUrl(
      destinationInput,
      getExpectedSharePointPackageFileName(),
      getSharePointPublishingOfficeName()
    );
    setSharePointPublishingState("destination-confirm", {
      pendingTarget,
      errorMessage:""
    });
  }catch(err){
    setSharePointPublishingState("destination-setup", {
      pendingTarget:null,
      errorMessage:err && err.message ? err.message : String(err)
    });
  }
}

function confirmSharePointPublishingDestination(){
  if(!sharePointPublishRun || !sharePointPublishRun.pendingTarget) return;
  try{
    const target = {
      ...sharePointPublishRun.pendingTarget,
      configuredAt:nowISO()
    };
    saveSharePointPublishingTarget(target);
    sharePointPublishRun.target = target;
    sharePointPublishRun.pendingTarget = null;
    sharePointPublishRun.destinationInput = target.packageViewUrl;
    setSharePointPublishingState("loading", {
      changingDestination:false,
      errorMessage:""
    });
    restoreSharePointPublishingDirectory();
  }catch(err){
    setSharePointPublishingState("destination-setup", {
      errorMessage:`The SharePoint destination could not be saved: ${err && err.message ? err.message : err}`
    });
  }
}

function beginChangeSharePointPublishingDestination(){
  if(!sharePointPublishRun) return;
  if(!canChangeSharePointPublishingDestination()) return;
  clearSharePointPublishingTimer();
  setSharePointPublishingState("destination-setup", {
    changingDestination:!!sharePointPublishRun.target,
    destinationInput:sharePointPublishRun.pendingTarget
      ? sharePointPublishRun.pendingTarget.packageViewUrl
      : (sharePointPublishRun.target ? sharePointPublishRun.target.packageViewUrl : sharePointPublishRun.destinationInput || ""),
    pendingTarget:null,
    errorMessage:""
  });
}

function cancelSharePointPublishingDestinationChange(){
  restartSharePointPublishing();
}

function restartSharePointPublishing(){
  clearSharePointPublishingTimer();
  const target = OfficeContext.sharePointTarget;
  if(!isSharePointPublishingAvailable()){
    sharePointPublishRun = null;
    return;
  }
  sharePointPublishRun = {
    target,
    state:target ? "loading" : "destination-setup",
    directoryHandle:null,
    directoryName:"",
    baseline:new Map(),
    pollTimer:null,
    startedAt:0,
    warnings:[],
    errorMessage:"",
    destinationInput:target ? target.packageViewUrl : "",
    pendingTarget:null,
    changingDestination:false
  };
  renderSharePointPublishingModal();
  if(target) restoreSharePointPublishingDirectory();
}

async function restoreSharePointPublishingDirectory(){
  if(!sharePointPublishRun) return;
  const handle = await loadPublishingDirectoryHandle();
  if(!sharePointPublishRun) return;
  if(!handle){
    setSharePointPublishingState("folder-setup");
    return;
  }
  sharePointPublishRun.directoryHandle = handle;
  sharePointPublishRun.directoryName = String(handle.name || "publishing folder");
  const permission = await queryPublishingDirectoryPermission(handle);
  if(permission !== "granted"){
    setSharePointPublishingState("permission");
    return;
  }
  await preparePublishingDirectory(handle);
}

function startSharePointPublishing(){
  if(!isSharePointPublishingAvailable()){
    alert("Create an office-specific TSO Resources file before configuring SharePoint publishing.");
    return;
  }
  if(!commitPendingEditsIfChanged()) return;
  if(getOutstandingDeletionReview()){
    alert("Review the tagged deletions before publishing to SharePoint.");
    showDeletionReview();
    return;
  }
  if(sharePointPublishRun){
    renderSharePointPublishingModal();
    return;
  }
  restartSharePointPublishing();
}

function sharePointPublishingTargetSummaryHTML(target){

function sharePointPublishingBodyHTML(run){
  const target = run.target;
  const officeName = target && target.officeName ? target.officeName : getSharePointPublishingOfficeName();
  const folderName = escapeHTML(run.directoryName || "publishing folder");
  const expectedPackageFileName = getExpectedSharePointPackageFileName();
  const warningHTML = Array.isArray(run.warnings) && run.warnings.length
    ? `<div class="sharepoint-publish-warning"><strong>Review these package warnings:</strong>${run.warnings.map(message => `<p>${escapeHTML(message).replace(/\n/g, "<br>")}</p>`).join("")}</div>`
    : "";

  if(run.state === "destination-setup"){
    return `
      <p>Configure this computer to publish only to <strong>${escapeHTML(officeName)} TSO</strong>.</p>
      <ol class="sharepoint-publish-steps">
        <li>In SharePoint, select or open <strong>${escapeHTML(expectedPackageFileName)}</strong>.</li>
        <li>Copy the complete address-bar URL and paste it below.</li>
      </ol>
      <p class="sharepoint-publish-note">If the package does not exist yet, save and upload it manually once before completing this setup.</p>
      <label class="sharepoint-publish-url-label" for="sharePointPublishingUrl">SharePoint resource-package URL</label>
      <textarea id="sharePointPublishingUrl" class="sharepoint-publish-url" spellcheck="false" placeholder="https://${SHAREPOINT_PUBLISHING_ALLOWED_HOST}/sites/WSR_TSO/…">${escapeHTML(run.destinationInput || "")}</textarea>
      ${run.errorMessage ? `<p class="sharepoint-publish-error">${escapeHTML(run.errorMessage)}</p>` : ""}
      <button class="button primary" type="button" onclick="reviewSharePointPublishingDestination()">Review destination</button>
      ${run.changingDestination ? `<button class="button" type="button" onclick="cancelSharePointPublishingDestinationChange()">Cancel</button>` : ""}
    `;
  }
  if(run.state === "destination-confirm"){
    return `
      <p>Confirm that this is the SharePoint destination for this office:</p>
      ${sharePointPublishingTargetSummaryHTML(run.pendingTarget)}
      <button class="button primary" type="button" onclick="confirmSharePointPublishingDestination()">Use this destination</button>
      <button class="button" type="button" onclick="beginChangeSharePointPublishingDestination()">Back</button>
    `;
  }
  if(run.state === "loading"){
    return `<div class="sharepoint-publish-status" role="status">Preparing SharePoint publishing…</div>`;
  }
  if(run.state === "folder-setup"){
    return `
      ${sharePointPublishingTargetSummaryHTML(target)}
      <p>Choose the folder where Edge saves downloaded files. TSO Resources will watch only this folder and save the merged package there.</p>
      <button class="button primary" type="button" onclick="chooseSharePointPublishingDirectory()">Choose publishing folder</button>
      ${changeSharePointPublishingDestinationButtonHTML()}
    `;
  }
  if(run.state === "permission"){
    return `
      <p>Edge needs read and write access to <strong>${folderName}</strong> before publishing can continue.</p>
      ${run.errorMessage ? `<p class="sharepoint-publish-error">${escapeHTML(run.errorMessage)}</p>` : ""}
      <button class="button primary" type="button" onclick="allowSharePointPublishingDirectory()">Allow publishing folder</button>
      <button class="button" type="button" onclick="chooseSharePointPublishingDirectory()">Choose a different folder</button>
      ${changeSharePointPublishingDestinationButtonHTML()}
    `;
  }
  if(run.state === "ready"){
    return `
      ${sharePointPublishingTargetSummaryHTML(target)}
      <p>Edge must save the current package in <strong>${folderName}</strong>.</p>
      <ol class="sharepoint-publish-steps">
        <li>Open the current SharePoint package.</li>
        <li>Click the <strong>Download</strong> arrow in SharePoint.</li>
        <li>Return here; merging and saving will continue automatically.</li>
      </ol>
      <a class="button primary" href="${escapeHTML(target.packageViewUrl)}" target="_blank" rel="noopener" onclick="beginSharePointPackageDownload()">Open current SharePoint package</a>
      <button class="button" type="button" onclick="chooseSharePointPublishingDirectory()">Change publishing folder</button>
      ${changeSharePointPublishingDestinationButtonHTML()}
    `;
  }
  if(run.state === "manual-ready"){
    return `
      ${run.errorMessage ? `<p class="sharepoint-publish-warning">${escapeHTML(run.errorMessage)}</p>` : ""}
      <p>Open the current SharePoint package, click its Download arrow, then return here and select the downloaded ZIP.</p>
      <a class="button primary" href="${escapeHTML(target.packageViewUrl)}" target="_blank" rel="noopener">Open current SharePoint package</a>
      <button class="button" type="button" onclick="chooseDownloadedPackageForPublishing()">Select downloaded package</button>
      ${changeSharePointPublishingDestinationButtonHTML()}
    `;
  }
  if(run.state === "waiting"){
    return `
      <div class="sharepoint-publish-status" role="status"><span class="sharepoint-publish-spinner" aria-hidden="true"></span>Downloading the current resource package</div>
      <p>In SharePoint, click the Download arrow. TSO Resources is watching <strong>${folderName}</strong>.</p>
      <button class="button" type="button" onclick="chooseDownloadedPackageForPublishing()">Select downloaded package</button>
    `;
  }
  if(run.state === "merging"){
    return `
      <div class="sharepoint-publish-status" role="status"><span class="sharepoint-publish-spinner" aria-hidden="true"></span>Merging</div>
      <p>${escapeHTML(run.downloadedFileName || target.packageFileName)}</p>
    `;
  }
  if(run.state === "complete"){
    const outputLocation = escapeHTML(run.outputLocation || run.directoryName || "publishing folder");
    return `
      <div class="sharepoint-publish-status sharepoint-publish-success" role="status">Merge complete</div>
      <dl class="sharepoint-publish-destination publication-summary">
        <div><dt>Saved package</dt><dd>Resource Package ${escapeHTML(String(run.packageVersion))}</dd></div>
        <div><dt>Filename</dt><dd><code>${escapeHTML(run.outputFileName || target.packageFileName)}</code></dd></div>
        <div><dt>Save time</dt><dd>${escapeHTML(formatLocalDateTime(run.savedAt))}</dd></div>
        <div><dt>Saved in</dt><dd>${outputLocation}</dd></div>
        <div><dt>Resources added</dt><dd>${escapeHTML(String(run.resourcesAdded || 0))}</dd></div>
        <div><dt>Resources updated</dt><dd>${escapeHTML(String(run.resourcesUpdated || 0))}</dd></div>
        <div><dt>Approved deletions</dt><dd>${escapeHTML(String(run.approvedDeletions || 0))}</dd></div>
        <div><dt>SharePoint destination</dt><dd><code>${escapeHTML(target.parentPath || target.libraryUrl || "Configured office folder")}</code></dd></div>
      </dl>
      ${warningHTML}
      <p>Upload that file to the <strong>${escapeHTML(officeName)} TSO</strong> SharePoint folder and choose <strong>Replace</strong> when SharePoint asks.</p>
      <a class="button primary" href="${escapeHTML(target.libraryUrl)}" target="_blank" rel="noopener">Upload to SharePoint</a>
      <button class="button" type="button" onclick="confirmSharePointPackageUploaded()">I replaced the package</button>
      <p class="sharepoint-publish-note">TSO Resources cannot independently verify the SharePoint upload. This button records the administrator's confirmation locally.</p>
    `;
  }
  if(run.state === "uploaded"){
    return `
      <div class="sharepoint-publish-status sharepoint-publish-success" role="status">SharePoint replacement recorded</div>
      <p>The administrator recorded replacing <strong>${escapeHTML(target.packageFileName)}</strong> for <strong>${escapeHTML(officeName)} TSO</strong> at ${escapeHTML(formatLocalDateTime(run.replacementRecordedAt))}.</p>
      <p class="sharepoint-publish-note">This is a local administrative record. TSO Resources cannot independently verify that SharePoint completed the upload.</p>
      ${run.historyRecorded ? "" : `<p class="sharepoint-publish-warning">The confirmation could not be attached to local publishing history.</p>`}
      <button class="button" type="button" onclick="restartSharePointPublishing()">Publish again</button>
      <button class="button" type="button" onclick="showAdminSetup()">Office Setup and history</button>
    `;
  }
  return `
    <p class="sharepoint-publish-error">${escapeHTML(run.errorMessage || "Publishing could not continue.")}</p>
    ${run.directoryHandle ? `<button class="button primary" type="button" onclick="checkAgainForSharePointDownload()">Check publishing folder again</button>` : ""}
    <button class="button" type="button" onclick="chooseDownloadedPackageForPublishing()">Select downloaded package</button>
    <button class="button" type="button" onclick="chooseSharePointPublishingDirectory()">Change publishing folder</button>
    ${changeSharePointPublishingDestinationButtonHTML()}
  `;
}

function renderSharePointPublishingModal(){
  if(!sharePointPublishRun) return;
  const modal = getReferenceModal();
  modal.className = "reference-modal sharepoint-publish-modal";
  modal.innerHTML = `
    <div class="reference-modal-panel" role="dialog" aria-modal="true" aria-labelledby="sharePointPublishTitle">
      <div class="reference-modal-header">
        <div>
          <div id="sharePointPublishTitle" class="reference-modal-title">Publish to SharePoint</div>
          <div class="reference-modal-subtitle">${escapeHTML(sharePointPublishRun.target && sharePointPublishRun.target.officeName || getSharePointPublishingOfficeName())} TSO</div>
        </div>
        <button class="button reference-modal-close" type="button">Close</button>
      </div>
      <div class="reference-modal-body sharepoint-publish-body">
        ${sharePointPublishingBodyHTML(sharePointPublishRun)}
      </div>
    </div>
  `;
  const closeBtn = modal.querySelector(".reference-modal-close");
  if(closeBtn) closeBtn.addEventListener("click", closeReferenceModal);
  modal.classList.remove("hidden");
}

/* ---------- Application Shortcuts ---------- */
window.addEventListener("keydown", (e) => {
  const isFreshStartShortcut = e.ctrlKey && e.altKey && (e.code === "KeyF" || e.key === "F" || e.key === "f");
  if(!isFreshStartShortcut) return;
  e.preventDefault();
  e.stopPropagation();
  freshStartFromSeed();
}, true);

window.addEventListener("keydown", (e) => {
  if(e.key !== "Escape") return;
  const modal = document.getElementById("referenceModal");
  if(!modal || modal.classList.contains("hidden")) return;
  e.preventDefault();
  e.stopPropagation();
  closeReferenceModal();
}, true);

window.addEventListener("keydown", (e) => {
  const isDoneShortcut = (e.ctrlKey || e.metaKey) && e.key === "Enter";
  if(!isDoneShortcut) return;
  if(!(view === "admin" && adminTab === "resources" && adminResourceEditMode)) return;
  e.preventDefault();
  e.stopPropagation();
  closeResourceEditor();
}, true);

window.addEventListener("keydown", (e) => {
  const activeTag = document.activeElement && document.activeElement.tagName
    ? document.activeElement.tagName.toUpperCase()
    : "";
  if(activeTag === "INPUT" || activeTag === "TEXTAREA") return;

  const isAdminToggleShortcut = e.ctrlKey && e.altKey && (e.code === "KeyA" || e.key === "A" || e.key === "a");
  if(!isAdminToggleShortcut) return;

  e.preventDefault();
  e.stopPropagation();
  const shouldShowAdmin = !isAdminVisible;
  setAdminVisibility(shouldShowAdmin);
  safeRender();
  if(shouldShowAdmin) flashAdminButton();
}, true);

// Source: src/js/120-startup.js
/* ---------- Start ---------- */

setAdminVisibility(false);
safeRender();

</script>
