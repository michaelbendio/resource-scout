// PrintWorkflow is a small queue-based state machine for print preview/packet flow.
// Each queue entry has a label and render function so print steps stay data-driven.
// The queue currently has one visible step, but keeping this as a queue preserves
// the separation between normal resource cards and list-style flyer output.
const PrintWorkflow = {
  queue: [],
  currentIndex: -1,
  initiatedByButton: false,

  isListResource(res){
    return resourceMatchesListsHeuristic(res);
  },

  getPrintSelectionGroups(){
    // "List" resources are separated so print selection packet output can render flyers.
    const normalSelections = [];
    const listSelections = [];

    getPrintSelectionResources().forEach(res => {
      if(this.isListResource(res)){
        listSelections.push(res);
      }else{
        normalSelections.push(res);
      }
    });

    return { normalSelections, listSelections };
  },

  buildQueue(){
    const { normalSelections, listSelections } = this.getPrintSelectionGroups();
    if(!normalSelections.length && !listSelections.length) return [];
    if(!listSelections.length){
      return [{
        label:"Print Selection",
        render: () => this.renderPrintSelection(normalSelections)
      }];
    }
    return [{
      label:"Print Selection",
      render: () => this.renderPrintSelectionPacket(normalSelections, listSelections)
    }];
  },

  updateUI(){
    const active = this.queue.length > 0 && this.currentIndex >= 0 && this.currentIndex < this.queue.length;
    const isLastStep = active && this.currentIndex === this.queue.length - 1;
    printCloseBtn.classList.toggle("hidden", active && !isLastStep);
    printActionBtn.classList.toggle("hidden", !active);
    printNextBtn.classList.toggle("hidden", !active || isLastStep);
    if(!active){
      printProgress.textContent = "";
      return;
    }
    printProgress.textContent = "";
  },

  showStep(){
    const step = this.queue[this.currentIndex];
    if(!step || typeof step.render !== "function") return;
    step.render();
  },

  openPreviewContent(render){
    this.updateUI();
    printContent.innerHTML="";
    if(typeof render === "function") render(printContent);
    printModal.classList.remove("hidden");
  },

  openPreview(resources){
    this.openPreviewContent(container => {
      this.renderPrintableResourceCards(container, resources);
    });
  },

  renderPrintableResourceCards(container, resources){
    (Array.isArray(resources) ? resources : []).forEach((res, index)=>{
      if(index > 0){
        const separator = document.createElement("hr");
        separator.className = "print-resource-separator";
        separator.classList.toggle("print-disabled", !isSelectedForPrinting(res.id));
        container.appendChild(separator);
      }
      const card=buildResourceCard(res,{expanded:true,showDescription:true});
      card.classList.toggle("print-disabled", !isSelectedForPrinting(res.id));
      const toggle = card.querySelector(".print-selection-toggle");
      if(toggle){
        toggle.onclick = e => {
          e.stopPropagation();
          togglePrintSelection(res.id, { rerender:false });
          this.showStep();
          safeRender();
        };
      }
      container.appendChild(card);
    });
  },

  renderPrintSelection(normalSelections){
    this.openPreview(normalSelections);
  },

  buildListFlyer(resource, shouldPageBreak){
    const flyer = document.createElement("section");
    flyer.className = "print-list-flyer" + (shouldPageBreak ? " print-list-flyer-page-break" : "");
    flyer.classList.toggle("print-disabled", !isSelectedForPrinting(resource.id));

    let html = `<div class="print-list-heading"><span class="print-list-actions-placeholder"></span><h2>${escapeHTML(resource.name || "")}</h2></div>`;
    if(resource.description) html += `<div class="print-list-field"><strong>Description:</strong> ${escapeHTML(resource.description)}</div>`;
    if(resource.phone) html += `<div class="print-list-field"><strong>Phone:</strong> ${escapeHTML(resource.phone)}</div>`;
    if(resource.address) html += `<div class="print-list-field"><strong>Address:</strong> ${escapeHTML(resource.address)}</div>`;
    if(resource.website) html += `<div class="print-list-field"><strong>Website:</strong> ${escapeHTML(resource.website)}</div>`;
    if(resource.informationText){
      html += `<div class="print-list-field"><strong>Information:</strong><div class="information-rendered resource-info-rendered">${renderInformationHTML(resource.informationText)}</div></div>`;
    }
    flyer.innerHTML = html;
    const placeholder = flyer.querySelector(".print-list-actions-placeholder");
    const actions = createResourceActionButtons(resource);
    actions.classList.add("print-list-actions");
    if(placeholder) placeholder.replaceWith(actions);
    const toggle = flyer.querySelector(".print-selection-toggle");
    if(toggle){
      toggle.onclick = e => {
        e.stopPropagation();
        togglePrintSelection(resource.id, { rerender:false });
        this.showStep();
        safeRender();
      };
    }
    return flyer;
  },

  renderPrintSelectionPacket(normalSelections, listSelections){
    this.openPreviewContent(container => {
      if(normalSelections.length){
        this.renderPrintableResourceCards(container, normalSelections);
      }

      listSelections.forEach((resource, index) => {
        container.appendChild(this.buildListFlyer(resource, normalSelections.length > 0 || index > 0));
      });
    });
  },

  renderSingleListResource(resourceId){
    const { listSelections } = this.getPrintSelectionGroups();
    const resource = listSelections.find(res => res.id === resourceId);
    if(!resource) return;
    this.openPreview([resource]);
  },

  startPrintSelection(){
    this.queue = this.buildQueue();
    if(!this.queue.length){
      this.openPreviewContent(container => {
        container.innerHTML = "<p>No resources are selected for printing.</p><p class=\"print-empty-instruction\">Click the gray printer button next to a resource to include it in the printed handout.</p>";
      });
      return;
    }
    this.currentIndex = 0;
    this.showStep();
  },

  next(){
    if(this.currentIndex >= this.queue.length - 1) return this.close();
    this.currentIndex += 1;
    this.showStep();
  },

  close(){
    this.queue = [];
    this.currentIndex = -1;
    this.updateUI();
    printModal.classList.add("hidden");
  },

  doPrint(){
    this.initiatedByButton = true;
    const disabled = Array.from(printContent.querySelectorAll(".print-disabled"));
    disabled.forEach(el => el.setAttribute("data-print-hidden", "true"));
    window.print();
    clearAllCategoryFilters(false);
  },

  handleAfterPrint(){
    if(!this.initiatedByButton) return;
    this.initiatedByButton = false;
  }
};

function startPrintSelectionPreview(){ PrintWorkflow.startPrintSelection(); }
function nextPrintStep(){ PrintWorkflow.next(); }
function closePrintPreview(){ PrintWorkflow.close(); }
function doPrint(){ PrintWorkflow.doPrint(); }

// ============================================================
// PERSISTENCE
// ============================================================
// Storage split:
// - localStorage keeps the primary JSON snapshot.
// - IndexedDB keeps binary assets (PDF blobs) under namespaced string keys.
// - localStorage also keeps small UI state such as print selection, undo, and
//   seen update ids under separate keys.
// - Save Resource Package exports a ZIP with canonical JSON plus attached PDFs.
// - Merge Resources imports a package ZIP and resolves conflicts by
//   lastModified timestamps where possible.

let lastOpenedResourcePackageHandle = null;

function persist(){
  // Writes the canonical JSON snapshot used to restore app state on reload.
  if(DEBUG) assertInvariants("persist");
  data.appVersion = APP_VERSION;
  data.lastModified = nowISO();
  localStorage.setItem(DATA_STORAGE_KEY, JSON.stringify(data));
  updateUndoSnapshotAfterPersist();
}

function openAssetsDB(){
  return new Promise((resolve, reject) => {
    if(typeof indexedDB === "undefined"){
      reject(new Error("Asset storage is unavailable in this browser."));
      return;
    }

    let settled = false;
    const timeoutId = setTimeout(() => {
      if(settled) return;
      settled = true;
      reject(new Error("Asset storage is unavailable right now. Reload the app and try again."));
    }, 4000);

    function finish(fn){
      return value => {
        if(settled) return;
        settled = true;
        clearTimeout(timeoutId);
        fn(value);
      };
    }

    let req;
    try{
      req = indexedDB.open(`${STORAGE_KEY_PREFIX}Assets`, 1);
    }catch(err){
      clearTimeout(timeoutId);
      reject(err);
      return;
    }

    req.onupgradeneeded = e => {
      const db = e.target.result;
      if(!db.objectStoreNames.contains("files")){
        db.createObjectStore("files");
      }
    };

    req.onsuccess = finish(() => resolve(req.result));
    req.onerror = finish(() => reject(req.error || new Error("Asset storage is unavailable in this browser.")));
    req.onblocked = finish(() => reject(new Error("Asset storage is blocked. Close other tabs and try again.")));
  });
}

async function saveAsset(key, blob){
  const db = await openAssetsDB();
  const tx = db.transaction("files", "readwrite");
  tx.objectStore("files").put(blob, key);

  return new Promise((resolve, reject) => {
    tx.oncomplete = () => {
      db.close();
      resolve();
    };
    tx.onerror = () => {
      db.close();
      reject(tx.error);
    };
    tx.onabort = () => {
      db.close();
      reject(tx.error);
    };
  });
}

async function loadAsset(key){
  const db = await openAssetsDB();
  const tx = db.transaction("files", "readonly");
  const req = tx.objectStore("files").get(key);

  return new Promise((resolve, reject) => {
    req.onsuccess = () => {
      db.close();
      resolve(req.result);
    };
    req.onerror = () => {
      db.close();
      reject(req.error);
    };
  });
}

async function openPDF(path){
  const pdfWindow = window.open("", "_blank");
  if(!pdfWindow){
    alert("Unable to open PDF window. Allow pop-ups and try again.");
    return;
  }
  pdfWindow.document.title = "Loading PDF...";
  pdfWindow.document.body.textContent = "Loading PDF...";
  try{

    if(!stored){

function normalizeChanges(packageData){
  if(!packageData || typeof packageData !== "object") return;
  const source = Array.isArray(packageData.changes) ? packageData.changes : [];
  const normalized = [];
  const seen = new Set();
  source.forEach((entry, index) => {
    if(!entry || typeof entry !== "object") return;
    const description = String(entry.description || "").trim();
    const type = entry.type === "category" ? "category" : "resource";
    const action = ["added", "updated", "removed"].includes(entry.action) ? entry.action : "updated";
    const timestamp = Date.parse(String(entry.timestamp || "")) ? String(entry.timestamp) : nowISO();
    const id = String(entry.id || `${type}:${entry.targetId || index}:${timestamp}`).trim();
    if(!id || seen.has(id)) return;
    seen.add(id);
    normalized.push({
      id,
      type,
      action,
      targetId: String(entry.targetId || ""),
      targetName: String(entry.targetName || "(Unnamed)").trim() || "(Unnamed)",
      description,
      timestamp,
      categoryIds: Array.isArray(entry.categoryIds) ? entry.categoryIds.map(String) : []
    });
  });
  packageData.changes = normalized;
}

function normalizePackageVersionValue(value){
  if(typeof value === "number" && Number.isFinite(value)) return value;
  if(typeof value === "string" && value.trim()){
    const asNumber = Number(value.trim());
    if(Number.isFinite(asNumber)) return asNumber;
  }
  return "Unknown";
}

function getNextPackageVersionValue(value){
  const normalized = normalizePackageVersionValue(value);
  if(typeof normalized === "number" && Number.isFinite(normalized)){
    return Math.max(1, Math.floor(normalized) + 1);
  }
  return 1;
}

function getLatestPackageVersionValue(...values){
  const numericVersions = values
    .map(normalizePackageVersionValue)
    .filter(value => typeof value === "number" && Number.isFinite(value));
  return numericVersions.length ? Math.max(...numericVersions) : "Unknown";
}

function getResourcePackageCreatedAt(packageData){
  if(!packageData || typeof packageData !== "object") return null;
  const createdAt = String(packageData.packageCreatedAt || "").trim();
  if(createdAt && Number.isFinite(Date.parse(createdAt))){
    return new Date(createdAt).toISOString();
  }
  const legacyLastModified = String(packageData.lastModified || "").trim();
  if(legacyLastModified && Number.isFinite(Date.parse(legacyLastModified))){
    return new Date(legacyLastModified).toISOString();
  }
  return null;
}

function normalizeLastLoadedPackageInfo(packageData){
  if(!packageData || typeof packageData !== "object") return;
  const source = packageData.lastLoadedPackageInfo;
  if(!source || typeof source !== "object"){
    packageData.lastLoadedPackageInfo = null;
    return;
  }
  const changes = Array.isArray(source.changes)
    ? source.changes
      .map(entry => String(entry || "").trim())
      .filter(Boolean)
    : [];
  packageData.lastLoadedPackageInfo = {
    sourcePackageVersion: normalizePackageVersionValue(
      source.sourcePackageVersion != null ? source.sourcePackageVersion : source.packageVersion
    ),
    loadedAt: Date.parse(String(source.loadedAt || "")) ? String(source.loadedAt) : nowISO(),
    sourcePackageCreatedAt: Date.parse(String(source.sourcePackageCreatedAt || ""))
      ? new Date(source.sourcePackageCreatedAt).toISOString()
      : null,
    changes
  };
}

function createChangeEntry(type, action, targetId, targetName, description, options = {}){
  const cleanDescription = String(description || "").trim();
  const timestamp = nowISO();
  return {
    id: `${type || "change"}:${targetId || "unknown"}:${timestamp}:${Math.random().toString(16).slice(2,8)}`,
    type: type === "category" ? "category" : "resource",
    action: ["added", "updated", "removed"].includes(action) ? action : "updated",
    targetId: String(targetId || ""),
    targetName: String(targetName || "(Unnamed)").trim() || "(Unnamed)",
    description: cleanDescription,
    timestamp,
    categoryIds: Array.isArray(options.categoryIds) ? options.categoryIds.map(String) : []
  };
}

function addChangeEntry(changeEntry){
  if(!changeEntry) return;

  data.changes.push(changeEntry);
}

function mergeChanges(localChanges, incomingChanges){
  const merged = [];
  const seen = new Set();
  [localChanges, incomingChanges].forEach(list => {
    (Array.isArray(list) ? list : []).forEach(entry => {
      const id = String(entry && entry.id || "");
      if(!id || seen.has(id)) return;
      seen.add(id);
      merged.push(cloneDataObject(entry));
    });
  });
  return merged;
}

function normalizeCategoryMigrations(packageData){
  if(!packageData || typeof packageData !== "object") return;
  const source = Array.isArray(packageData.categoryMigrations) ? packageData.categoryMigrations : [];
  const normalized = [];
  const indexByFromId = new Map();

  source.forEach(entry => {
    if(!entry || typeof entry !== "object") return;
    const fromId = String(entry.fromId || "").trim();
    const toId = String(entry.toId || "").trim();
    const toFilter = String(entry.toFilter || "").trim();
    if(!fromId || (toId && fromId === toId)) return;

    const migration = { fromId };
    if(toId) migration.toId = toId;
    if(toId && toFilter) migration.toFilter = toFilter;
    if(indexByFromId.has(fromId)){
      normalized[indexByFromId.get(fromId)] = migration;
    }else{
      indexByFromId.set(fromId, normalized.length);
      normalized.push(migration);
    }
  });

  packageData.categoryMigrations = normalized;
}

function mergeCategoryMigrations(localMigrations, incomingMigrations){
  const holder = {
    categoryMigrations: [
      ...(Array.isArray(localMigrations) ? localMigrations : []),
      ...(Array.isArray(incomingMigrations) ? incomingMigrations : [])
    ]
  };
  normalizeCategoryMigrations(holder);
  return holder.categoryMigrations;
}

function applyCategoryMigrations(packageData, migrations){
  if(!packageData || typeof packageData !== "object") return;
  if(!Array.isArray(packageData.categories)) packageData.categories = [];
  if(!Array.isArray(packageData.resources)) packageData.resources = [];
  const holder = { categoryMigrations:Array.isArray(migrations) ? migrations : [] };
  normalizeCategoryMigrations(holder);

  holder.categoryMigrations.forEach(migration => {
    const fromId = migration.fromId;
    const toId = migration.toId || "";
    packageData.categories = packageData.categories.filter(category => String(category && category.id || "") !== fromId);

    packageData.resources.forEach(resource => {
      if(!resource || typeof resource !== "object") return;
      const categories = Array.isArray(resource.categories) ? resource.categories.map(String) : [];
      const filterMap = resource.categoryFilters && typeof resource.categoryFilters === "object" && !Array.isArray(resource.categoryFilters)
        ? resource.categoryFilters
        : {};
      const oldFilters = normalizeCategoryFilters(filterMap[fromId]);
      const affected = categories.includes(fromId) || oldFilters.length > 0;
      if(!affected) return;

      const nextCategories = categories.filter(categoryId => categoryId !== fromId);
      if(toId) nextCategories.push(toId);
      resource.categories = normalizeTaxonomyLabels(nextCategories);
      delete filterMap[fromId];

      if(toId){
        const nextFilters = normalizeCategoryFilters([
          ...normalizeCategoryFilters(filterMap[toId]),
          ...oldFilters,
          ...(migration.toFilter ? [migration.toFilter] : [])
        ]);
        if(nextFilters.length) filterMap[toId] = nextFilters;
      }
      resource.categoryFilters = filterMap;
    });
  });
}

function shouldReplaceLatestPackageInfo(packageInfo, importedPackageVersion){
  const incomingVersion = normalizePackageVersionValue(importedPackageVersion);
  if(typeof incomingVersion !== "number" || !Number.isFinite(incomingVersion)){
    return !packageInfo;
  }
  const displayedSourceVersion = packageInfo
    ? normalizePackageVersionValue(packageInfo.sourcePackageVersion)
    : "Unknown";
  if(typeof displayedSourceVersion !== "number" || !Number.isFinite(displayedSourceVersion)){
    return true;
  }
  return incomingVersion > displayedSourceVersion;
}

function chooseMergeObject(localItem, incomingItem){
  // Package merging is conservative: keep local data unless the incoming item is
  // clearly newer, and fall back to incoming data only when no timestamps can
  // establish a winner.
  if(!localItem && incomingItem) return { item:incomingItem, changed:true };
  if(localItem && !incomingItem) return { item:localItem, changed:false };

  const localTime = getValidTimestamp(localItem.lastModified);
  const incomingTime = getValidTimestamp(incomingItem.lastModified);
  const differs = objectsDiffer(localItem, incomingItem);

  if(localTime !== null && incomingTime !== null){
    return incomingTime > localTime
      ? { item:incomingItem, changed:differs }
      : { item:localItem, changed:false };
  }
  if(localTime === null && incomingTime !== null) return { item:incomingItem, changed:differs };
  if(localTime !== null && incomingTime === null) return { item:localItem, changed:false };
  return differs
    ? { item:incomingItem, changed:true }
    : { item:localItem, changed:false };
}

function mergeItemsById(localItems, incomingItems, options = {}){
  // Categories and resources both merge by stable id. The counters/names returned
  // here are only for user-facing "what changed" summaries after import.
  const localList = Array.isArray(localItems) ? localItems : [];
  const incomingList = Array.isArray(incomingItems) ? incomingItems : [];
  const incomingById = new Map(incomingList.map(item => [String(item && item.id || ""), item]).filter(([id]) => id));
  const seen = new Set();
  const merged = [];
  const addedIds = [];
  const updatedIds = [];
  const addedNames = [];
  const updatedNames = [];
  let added = 0;
  let updated = 0;

  localList.forEach(localItem => {
    const id = String(localItem && localItem.id || "");
    if(!id) return;
    const incomingItem = incomingById.get(id);
    const choice = chooseMergeObject(localItem, incomingItem);
    merged.push(cloneDataObject(choice.item));
    seen.add(id);
    if(incomingItem && choice.item === incomingItem && choice.changed){
      updated += 1;
      updatedIds.push(id);
      updatedNames.push(String(incomingItem.name || incomingItem.title || id));
    }
  });

  incomingList.forEach(incomingItem => {
    const id = String(incomingItem && incomingItem.id || "");
    if(!id || seen.has(id)) return;
    merged.push(cloneDataObject(incomingItem));
    seen.add(id);
    added += 1;
    addedIds.push(id);
    addedNames.push(String(incomingItem.name || incomingItem.title || id));
  });

  return { merged, added, updated, addedIds, updatedIds, addedNames, updatedNames };
}

function mergeCategoryTypesAdditively(categoryMerge, localCategories, incomingCategories){
  const localById = new Map((Array.isArray(localCategories) ? localCategories : [])
    .map(category => [String(category && category.id || ""), category])
    .filter(([id]) => id));
  const incomingById = new Map((Array.isArray(incomingCategories) ? incomingCategories : [])
    .map(category => [String(category && category.id || ""), category])
    .filter(([id]) => id));
  const updatedIds = new Set(categoryMerge.updatedIds || []);

  (categoryMerge.merged || []).forEach(category => {
    const id = String(category && category.id || "");
    if(!id || !localById.has(id) || !incomingById.has(id)) return;
    const localCategory = localById.get(id);
    const incomingCategory = incomingById.get(id);
    if(chooseMergeObject(localCategory, incomingCategory).item !== incomingCategory) return;
    const localTypes = normalizeCategoryFilters(localCategory.filters);
    const incomingTypes = normalizeCategoryFilters(incomingCategory.filters);
    const mergedTypes = normalizeCategoryFilters([...localTypes, ...incomingTypes]);
    category.filters = mergedTypes;

    const localKeys = new Set(localTypes.map(deletionLabelKey));
    const incomingAddedType = mergedTypes.some(type => !localKeys.has(deletionLabelKey(type)));
    if(!incomingAddedType || updatedIds.has(id)) return;
    updatedIds.add(id);
    categoryMerge.updated += 1;
    categoryMerge.updatedIds.push(id);
    categoryMerge.updatedNames.push(String(category.name || category.title || category.label || id));
  });
}

function mergeIncomingResourcePDFs(mergedResources, incomingResources){
  const incomingById = new Map((Array.isArray(incomingResources) ? incomingResources : [])
    .map(resource => [String(resource && resource.id || ""), resource])
    .filter(([id]) => id));

  (Array.isArray(mergedResources) ? mergedResources : []).forEach(resource => {
    const incomingResource = incomingById.get(String(resource && resource.id || ""));
    if(!incomingResource) return;
    const attachments = [];
    const seenPaths = new Set();
    [resource, incomingResource].forEach(source => {
      getResourcePDFs(source).forEach(pdf => {
        const path = String(pdf && pdf.path || "").trim();
        if(!path || seenPaths.has(path)) return;
        seenPaths.add(path);
        attachments.push(cloneDataObject(pdf));
      });
    });
    resource.pdfs = attachments;
  });
}

function removeUnusedUnnamedCategories(packageData){
  // Older app versions could persist a blank category as soon as Admin clicked
  // New. Remove only categories that have no resource/filter/migration target;
  // a referenced unnamed category remains invalid so data is never discarded.
  if(!packageData || typeof packageData !== "object" || !Array.isArray(packageData.categories)) return [];
  const resources = Array.isArray(packageData.resources) ? packageData.resources : [];
  const migrationTargets = new Set((Array.isArray(packageData.categoryMigrations) ? packageData.categoryMigrations : [])
    .map(migration => String(migration && migration.toId || ""))
    .filter(Boolean));
  const removableIds = new Set();

  packageData.categories.forEach(category => {
    const id = String(category && category.id || "");
    if(!id || String(category && category.label || "").trim()) return;
    const isReferenced = migrationTargets.has(id) || resources.some(resource => {
      const categories = Array.isArray(resource && resource.categories)
        ? resource.categories.map(String)
        : [];
      const categoryFilters = resource && resource.categoryFilters && typeof resource.categoryFilters === "object"
        ? resource.categoryFilters
        : {};
      return categories.includes(id) || Object.prototype.hasOwnProperty.call(categoryFilters, id);
    });
    if(!isReferenced) removableIds.add(id);
  });

  if(!removableIds.size) return [];
  packageData.categories = packageData.categories.filter(category =>
    !removableIds.has(String(category && category.id || ""))
  );
  if(Array.isArray(packageData.changes)){
    packageData.changes.forEach(entry => {
      if(!entry || !Array.isArray(entry.categoryIds)) return;
      entry.categoryIds = entry.categoryIds.filter(id => !removableIds.has(String(id)));
    });
  }
  return Array.from(removableIds);
}

function buildResourcePackageData(sourceData){
  // Resource packages are intentionally smaller than local app state. Do not add
  // UI-only fields such as lastLoadedPackageInfo, undo, or selected filters here.
  const source = processResourcePackageData(sourceData || {}, {
    sourceName:"Current browser resource data"
  }).data;
  const referencedUnnamedCategory = source.categories.find(category =>
    !String(category && category.label || "").trim()
  );
  if(referencedUnnamedCategory){
    throw new Error(
      `Category '${String(referencedUnnamedCategory.id || "unknown")}' is missing a label. ` +
      "Name or delete it in Admin before saving the resource package."
    );
  }
  const packageData = {
    ...source,
    resourcePackageSchemaVersion: RESOURCE_PACKAGE_SCHEMA_VERSION,
    appVersion: APP_VERSION,
    appChanges: APP_CHANGE_LOG.map(change => ({ ...change })),
    packageVersion: source.packageVersion,
    packageCreatedAt: nowISO(),
    lastModified: source.lastModified || nowISO(),
    categories: source.categories,
    categoryMigrations: source.categoryMigrations,
    forGroups: source.forGroups,
    resources: source.resources,
    changes: source.changes,
    deletionRequests: source.deletionRequests,
    deletions: source.deletions
  };
  delete packageData.lastLoadedPackageInfo;
  delete packageData.categoryPresetVersion;
  return packageData;
}

function buildScoutReviewSelectionPackageData(sourceData, readyResourceIds){
  const source = processResourcePackageData(sourceData || {}, {
    sourceName:"Current Scout review resource data"
  }).data;
  const selectedIds = new Set(Array.from(readyResourceIds || []).map(String));
  const resources = source.resources
    .filter(resource => selectedIds.has(String(resource && resource.id || "")))
    .map(resource => cloneDataObject(resource));
  const resourceIds = new Set(resources.map(resource => String(resource.id || "")));
  const referencedCategoryIds = new Set(resources.flatMap(resource =>
    Array.isArray(resource.categories) ? resource.categories.map(String) : []
  ));
  const referencedForGroups = new Set(resources.flatMap(resource =>
    Array.isArray(resource.forGroups) ? resource.forGroups.map(String) : []
  ));
  const scopedData = {
    ...source,
    categories:source.categories.filter(category => referencedCategoryIds.has(String(category && category.id || ""))),
    categoryMigrations:[],
    forGroups:source.forGroups.filter(label => referencedForGroups.has(String(label))),
    resources,
    changes:source.changes.filter(entry => {
      if(resourceIds.has(String(entry && entry.targetId || ""))) return true;
      return Array.isArray(entry && entry.resourceIds)
        && entry.resourceIds.some(id => resourceIds.has(String(id)));
    }),
    deletionRequests:[],
    deletions:[]
  };
  return buildResourcePackageData(scopedData);
}

function buildScoutReviewCategoryPackageData(sourceData, config = getScoutReviewConfig()){

function archiveScoutReviewPackagedResources(resourceIds, packageVersion, fileName){
  if(!isScoutReviewMode()) return 0;
  const selectedIds = new Set(Array.from(resourceIds || []).map(String));
  const resources = data.resources
    .filter(resource => selectedIds.has(String(resource && resource.id || "")))
    .map(resource => cloneDataObject(resource));
  if(!resources.length) return 0;
  const savedAt = nowISO();
  const nextState = {
    ...scoutReviewState,
    readyResourceIds:scoutReviewState.readyResourceIds.filter(id => !selectedIds.has(String(id))),
    packagedBatches:[
      ...scoutReviewState.packagedBatches,
      {
        id:`package:${savedAt}:${String(packageVersion)}`,
        savedAt,
        packageVersion,
        fileName:String(fileName || ""),
        resources
      }
    ]
  };
  persistScoutReviewState(nextState);
  data.resources = data.resources.filter(resource => !selectedIds.has(String(resource && resource.id || "")));
  data.changes = data.changes.filter(entry => {
    if(selectedIds.has(String(entry && entry.targetId || ""))) return false;
    return !Array.isArray(entry && entry.resourceIds)
      || !entry.resourceIds.some(id => selectedIds.has(String(id)));
  });
  sanitizeFavoriteResourceIds();
  sanitizePrintSelection();
  if(selectedIds.has(String(selectedResourceId || ""))){
    const remaining = getAdminResourceBrowseList();
    selectedResourceId = remaining[0] ? String(remaining[0].id || "") : "";
    adminResourceEditMode = false;
    editing = null;
    editorSnapshot = "";
  }
  persist();
  return resources.length;
}

function mergeResourcePackages(localData, incomingData){
  // Merge into cloned normalized objects so a failed import cannot partially
  // mutate the user's current data.
  const local = processResourcePackageData(localData, {
    sourceName:"Current browser resource data"
  }).data;
  const incoming = processResourcePackageData(incomingData, {
    sourceName:"Incoming resource package"
  }).data;
  const categoryMigrations = mergeCategoryMigrations(local.categoryMigrations, incoming.categoryMigrations);
  applyCategoryMigrations(local, categoryMigrations);
  applyCategoryMigrations(incoming, categoryMigrations);
  const categoryMerge = mergeItemsById(local.categories, incoming.categories, { kind:"categories" });
  // Category Types are governed additions. Preserve both sides here; approved
  // Type-deletion tombstones are applied to the finalized merged package below.
  mergeCategoryTypesAdditively(categoryMerge, local.categories, incoming.categories);
  const resourceMerge = mergeItemsById(local.resources, incoming.resources, { kind:"resources" });
  const deletionRequests = mergeDeletionRecords(local.deletionRequests, incoming.deletionRequests, "requestedAt");
  const deletions = mergeDeletionRecords(local.deletions, incoming.deletions, "deletedAt");
  // Resource text still follows the timestamp winner, but PDF attachments from
  // the incoming package are additive. This lets a package restore attachments
  // when the browser has an equal/newer copy of the resource with no PDF metadata.
  mergeIncomingResourcePDFs(resourceMerge.merged, incoming.resources);
  const mergedData = {
    ...local,
    ...incoming,
    packageVersion: getLatestPackageVersionValue(local.packageVersion, incoming.packageVersion),
    categories: categoryMerge.merged,
    categoryMigrations,
    resources: resourceMerge.merged,
    changes: mergeChanges(local.changes, incoming.changes),
    forGroups: normalizeTaxonomyLabels([...(local.forGroups || []), ...(incoming.forGroups || [])]),
    deletionRequests,
    deletions,
    resourcePackageSchemaVersion: RESOURCE_PACKAGE_SCHEMA_VERSION
  };
  const finalized = processResourcePackageData(mergedData, {
    sourceName:"Merged resource package"
  }).data;
  return {
    mergedData:finalized,
    summary: {
      categoriesAdded: categoryMerge.added,
      categoriesUpdated: categoryMerge.updated,
      resourcesAdded: resourceMerge.added,
      resourcesUpdated: resourceMerge.updated,
      categoryIdsAdded: categoryMerge.addedIds,
      categoryIdsUpdated: categoryMerge.updatedIds,
      resourceIdsAdded: resourceMerge.addedIds,
      resourceIdsUpdated: resourceMerge.updatedIds,
      categoryNamesAdded: categoryMerge.addedNames,
      categoryNamesUpdated: categoryMerge.updatedNames,
      resourceNamesAdded: resourceMerge.addedNames,
      resourceNamesUpdated: resourceMerge.updatedNames
    }
  };
}

async function mergeZipAssets(zip, mergedData){
  const pdfKeys = collectPDFPathsFromResources(mergedData.resources);
  const missing = [];

  for(const key of pdfKeys){
    const entry = zip.file(key);
    if(entry && key.toLowerCase().endsWith(".pdf")){
      const blob = await entry.async("blob");
      await savePDF(key, blob);
    }else{
      let existing = null;
      try{
        existing = await getPDF(key);
      }catch(_err){}
      if(!existing) missing.push(key);
    }
  }
  return missing;
}

async function beginResourcePackageSave(){
  // Request a save target up front so browsers can honor the user gesture.
  const suggestedName = getResourcePackageZipFilename();
  if(typeof window.showSaveFilePicker === "function"){
    const handle = await window.showSaveFilePicker({
      id: "tso-resources",
      startIn: lastOpenedResourcePackageHandle || "downloads",
      suggestedName,
      types: [{
        description: "TSO resource package",
        accept: {
          "application/zip": [".zip"]
        }
      }]
    });
    return { kind:"file-handle", handle, suggestedName };
  }
  return { kind:"download", suggestedName };
}

function downloadResourcePackageBlob(fileName, blob){
  const cleanFileName = fileName || getResourcePackageZipFilename();
  const downloadBlob = blob.type === "application/octet-stream"
    ? blob
    : new Blob([blob], { type:"application/octet-stream" });
  const url = URL.createObjectURL(downloadBlob);
  const a = document.createElement("a");
  a.href = url;
  a.download = cleanFileName;
  a.type = "application/json";
  a.rel = "noopener";
  a.style.display = "none";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

async function saveResourcePackageBlob(target, blob){
  const fileName = target && target.suggestedName ? target.suggestedName : getResourcePackageZipFilename();
  if(target && target.kind === "file-handle" && target.handle){
    const writable = await target.handle.createWritable();
    try{
      await writable.write(blob);
      await writable.close();
    }catch(err){
      try{
        await writable.abort();
      }catch(_err){}
      throw err;
    }
    return;
  }

  downloadResourcePackageBlob(fileName, blob);
}

async function saveCurrentResourcePackage(target, options = {}){
  const showSuccessToast = options.showSuccessToast !== false;
  if(typeof JSZip === "undefined"){
    throw new Error("ZIP support is unavailable. Reload the app and try again.");
  }

  let previousPackageVersion;
  let packageVersionBumped = false;
  try{
    const zip = new JSZip();
    normalizePackageData(data);
    previousPackageVersion = data.packageVersion;
    data.packageVersion = getNextPackageVersionValue(data.packageVersion);
    packageVersionBumped = true;

    const scoutReviewReadyIds = isScoutReviewMode()
      ? getScoutReviewReadyResourceIds()
      : null;
    const packageData = isScoutReviewMode()
      ? buildScoutReviewSelectionPackageData(data, scoutReviewReadyIds)
      : buildResourcePackageData(data);
    const resourceCount = Array.isArray(packageData.resources) ? packageData.resources.length : 0;
    if(resourceCount === 0){
      const shouldSaveEmpty = confirm("This resource package has no resources. Save it anyway?");
      if(!shouldSaveEmpty){
        data.packageVersion = previousPackageVersion;
        packageVersionBumped = false;
        return null;
      }
    }
    zip.file("tso-resources.json", JSON.stringify(packageData, null, 2));

    const pdfKeys = collectPDFPathsFromResources(packageData.resources);
    for(const key of pdfKeys){
      const blob = await getPDF(key);
      if(blob){
        zip.file(key, blob);
      }
    }

    const blob = await zip.generateAsync({
      type: "blob",
      compression: "DEFLATE",
      compressionOptions: { level: 6 }
    });
    await saveResourcePackageBlob(target, blob);
    if(isScoutReviewMode()){
      archiveScoutReviewPackagedResources(
        scoutReviewReadyIds,
        data.packageVersion,
        target && target.suggestedName
      );
    }else{
      persist();
    }
    if(showSuccessToast){
      showToast(`Resource package saved (${resourceCount} ${resourceCount === 1 ? "resource" : "resources"})`);
    }
    return {
      blob,
      packageVersion:data.packageVersion,
      resourceCount
    };
  }catch(err){
    if(packageVersionBumped) data.packageVersion = previousPackageVersion;
    throw err;
  }
}

async function exportPackage(){
  // Exports package ZIP: tso-resources.json + any referenced PDF blobs.
  if(!commitPendingEditsIfChanged()) return;

  try{
    const saveTarget = await beginResourcePackageSave();
    return await saveCurrentResourcePackage(saveTarget);
  }catch(err){
    if(err && err.name === "AbortError") return;
    alert("Save failed: " + err.message);
  }
}

async function beginMergeImportPackage(){
  // Opens a package ZIP picker for merge-based resource reload.
  if(!commitPendingEditsIfChanged()) return;

  if(typeof window.showOpenFilePicker === "function"){
    try{
      const handles = await window.showOpenFilePicker({
        id: "tso-resources",
        startIn: lastOpenedResourcePackageHandle || "downloads",
        // Do not filter by extension here. Some valid ZIP packages are dimmed
        // by macOS pickers, so import-time validation remains authoritative.
        multiple: false
      });
      const handle = handles && handles[0];
      if(!handle) return;
      const file = await handle.getFile();
      const merged = await mergeImportPackage({
        target: {
          files: [file],
          value: "",
          remove(){}
        }
      });
      if(merged) lastOpenedResourcePackageHandle = handle;
    }catch(err){
      if(err && err.name === "AbortError") return;
      alert("Load failed: " + err.message);
    }
    return;
  }

  const input = document.createElement("input");
  input.type = "file";
  input.style.display = "none";
  input.onchange = mergeImportPackage;
  document.body.appendChild(input);
  input.value = "";
  input.click();
}

async function mergeImportPackage(event, options = {}){
  // Imports package ZIP, validates JSON, merges data, then stores referenced PDFs.
  if(!commitPendingEditsIfChanged()){
    event.target.remove();
    return;
  }

  const file = event.target.files && event.target.files[0];
  if(!file){
    event.target.remove();
    return;
  }

  try{
    if(typeof JSZip === "undefined"){
      throw new Error("ZIP support is unavailable. Reload the app and try again.");
    }
    const zip = await JSZip.loadAsync(file);
    const jsonFile = zip.file("tso-resources.json");
    if(!jsonFile){
      alert("Package missing tso-resources.json");
      return;
    }

    const jsonText = await jsonFile.async("string");
    const processedPackage = processResourcePackageJSON(jsonText, { sourceName:file.name });
    const imported = processedPackage.data;
    const removedUnnamedCategoryIds = processedPackage.removedUnnamedCategoryIds;
    const incomingDeletionRequests = cloneDataObject(imported.deletionRequests || []);
    const preparedChanges = options.preservePreparedChanges
      ? cloneDataObject(Array.isArray(data && data.changes) ? data.changes : [])
      : null;
    const preparedPackageInfo = options.preservePreparedChanges && data && data.lastLoadedPackageInfo
      ? cloneDataObject(data.lastLoadedPackageInfo)
      : null;
    if(!options.skipPreMergeSnapshot && !savePreMergeSnapshot(file.name)) return;
    const importedChangeIds = new Set((imported.changes || []).map(entry => String(entry && entry.id || "")).filter(Boolean));
    const importedPackageVersion = normalizePackageVersionValue(imported.packageVersion);
    const currentPackageInfo = (data && data.lastLoadedPackageInfo && typeof data.lastLoadedPackageInfo === "object")
      ? cloneDataObject(data.lastLoadedPackageInfo)
      : null;

    const localResourcesWithPdf = ((data && data.resources) || [])
      .map(r => ({ resource:r, paths:collectPDFPathsFromResource(r) }))
      .filter(item => item.paths.length);
    const { mergedData, summary:mergeSummary } = mergeResourcePackages(data, imported);
    const mergedPendingDeletionKeys = new Set((mergedData.deletionRequests || []).map(request => request.key));
    if(!options.skipDeletionReview){
      saveDeletionReview(
        file.name,
        importedPackageVersion,
        incomingDeletionRequests.filter(request => mergedPendingDeletionKeys.has(request.key))
      );
    }
    const mergedById = new Map((mergedData.resources || []).map(r => [String(r && r.id || ""), r]));
    const resourcesWithPdf = localResourcesWithPdf
      .filter(item => {
        const mergedResource = mergedById.get(String(item.resource && item.resource.id || ""));
        const mergedPaths = new Set(collectPDFPathsFromResource(mergedResource));
        return item.paths.some(path => !mergedPaths.has(path));
      })
      .map(item => item.resource.name);

    const missingPdfPaths = await mergeZipAssets(zip, mergedData);
    applyMergedData(mergedData);
    const mergedTargetKeys = new Set([
      ...(mergeSummary.resourceIdsAdded || []).map(id => `resource:${id}`),
      ...(mergeSummary.resourceIdsUpdated || []).map(id => `resource:${id}`),
      ...(mergeSummary.categoryIdsAdded || []).map(id => `category:${id}`),
      ...(mergeSummary.categoryIdsUpdated || []).map(id => `category:${id}`)
    ]);
    const loadedChanges = getRecentChanges().filter(entry => {
      const changeId = String(entry && entry.id || "");
      const targetKey = `${String(entry && entry.type || "")}:${String(entry && entry.targetId || "")}`;
      return importedChangeIds.has(changeId) && mergedTargetKeys.has(targetKey);
    });
    const loadedChangeSummaries = loadedChanges.length
      ? loadedChanges.map(formatPackageChangeSummary)
      : buildPackageMergeSummary(mergeSummary);
    if(options.preservePreparedChanges){
      data.lastLoadedPackageInfo = preparedPackageInfo;
    }else if(shouldReplaceLatestPackageInfo(currentPackageInfo, importedPackageVersion)){
      const persistentChangeSummaries = !loadedChangeSummaries.length
        ? (imported.changes || []).map(formatPackageChangeSummary)
        : loadedChangeSummaries;
      data.lastLoadedPackageInfo = {
        sourcePackageVersion: importedPackageVersion,
        loadedAt: nowISO(),
        sourcePackageCreatedAt: getResourcePackageCreatedAt(imported),
        changes: persistentChangeSummaries
      };
    }else{
      data.lastLoadedPackageInfo = currentPackageInfo;
    }
    normalizeLastLoadedPackageInfo(data);
    data.changes = options.preservePreparedChanges ? preparedChanges : [];
    persist();
    if(!options.silent && loadedChangeSummaries.length){
      pendingRecentUpdates = [];
      recentUpdateDetail = null;
      showUpdateInfo = true;
      showRecentChangeLog = false;
      view = "recent-updates";
      safeRender();
    }
    const warningBlocks = [];
    if(removedUnnamedCategoryIds.length > 0){
      warningBlocks.push(
        "The package contained an unused unnamed category left by an older app. " +
        "It was removed automatically:\n\n" +
        removedUnnamedCategoryIds.map(id => `• ${id}`).join("\n")
      );
    }
    if(resourcesWithPdf.length > 0){
      warningBlocks.push(
        "The following PDFs were not preserved:\n\n" +
        resourcesWithPdf.map(name => `• ${name}`).join("\n")
      );
    }
    if(missingPdfPaths.length > 0){
      warningBlocks.push(
        "The package referenced PDF files that were not found in the zip:\n\n" +
        missingPdfPaths.map(path => `• ${path}`).join("\n")
      );
    }
    if(warningBlocks.length && typeof options.onWarnings === "function"){
      options.onWarnings(warningBlocks.slice());
    }else if(warningBlocks.length){
      alert(warningBlocks.join("\n\n"));
    }
    if(!options.silent){
      showToast(
        loadedChangeSummaries.length
          ? "Resource package merged."
          : `No resource package updates were loaded from Resource Package ${importedPackageVersion}.`
      );
      if(getOutstandingDeletionReview()) setTimeout(showDeletionReview, 0);
    }
    return {
      mergeSummary,
      importedPackageVersion,
      importedData:cloneDataObject(imported)
    };
  }catch(e){
    alert("Load failed: " + formatResourcePackageError(e));
  }finally{
    // allow re-import of same filename
    event.target.value = "";
    event.target.remove();
  }
}

// ============================================================
// DELETION REQUESTS AND MERGE REVIEW
// ============================================================
// A Delete action creates a request; it does not remove live data. An admin can
// review requests immediately after a package merge, print their consequences,
// and approve selected requests. Approved requests become compact tombstones so
// an older resource package cannot recreate deleted records later.

function createDeletionRequest(kind, options = {}){
  return normalizeDeletionRecord({
    kind,
    targetId:options.targetId,
    categoryId:options.categoryId,
    label:options.label,
    description:options.description,
    requestedAt:options.requestedAt || nowISO()
  }, "requestedAt");
}

function hasDeletionRequest(kind, options = {}){
  const key = buildDeletionKey(kind, options.targetId, options.categoryId, options.label);
  return !!key && (Array.isArray(data.deletionRequests) ? data.deletionRequests : [])
    .some(request => request && request.key === key);
}

function tagDeletionRequests(requests, undoMessage){
  const normalized = mergeDeletionRecords([], requests, "requestedAt");
  if(!normalized.length) return false;
  const existingKeys = new Set((Array.isArray(data.deletionRequests) ? data.deletionRequests : []).map(item => item.key));
  const additions = normalized.filter(item => !existingKeys.has(item.key));
  if(!additions.length){
    showToast("Already tagged for deletion.");
    return false;
  }
  setUndoSnapshot(undoMessage || "deletion tag");
  data.deletionRequests = mergeDeletionRecords(data.deletionRequests, additions, "requestedAt");
  normalizeDeletionWorkflowData(data);
  persist();
  showToast(additions.length === 1 ? "Tagged for deletion." : `${additions.length} items tagged for deletion.`);
  safeRender();
  return true;
}

function getDeletionImpact(request, sourceData = data){
  const resources = Array.isArray(sourceData && sourceData.resources) ? sourceData.resources : [];
  const categories = Array.isArray(sourceData && sourceData.categories) ? sourceData.categories : [];
  let targetName = String(request && request.label || "").trim() || "(Unnamed)";
  let affected = [];
  if(request.kind === "resource"){
    const resource = resources.find(item => String(item && item.id || "") === request.targetId);
    if(resource) targetName = resource.name || targetName;
    affected = resource ? [resource] : [];
  }else if(request.kind === "category"){
    const category = categories.find(item => String(item && item.id || "") === request.targetId);
    if(category) targetName = category.label || targetName;
    affected = resources.filter(resource =>
      (Array.isArray(resource && resource.categories) && resource.categories.some(id => String(id) === request.targetId))
      || !!(resource && resource.categoryFilters && Object.prototype.hasOwnProperty.call(resource.categoryFilters, request.targetId))
    );
  }else if(request.kind === "type"){
    affected = resources.filter(resource => {
      const values = resource && resource.categoryFilters && resource.categoryFilters[request.categoryId];
      return normalizeCategoryFilters(values).some(value => deletionLabelKey(value) === deletionLabelKey(request.label));
    });
  }else if(request.kind === "forGroup"){
    affected = resources.filter(resource =>
      normalizeTaxonomyLabels(resource && resource.forGroups)
        .some(group => deletionLabelKey(group) === deletionLabelKey(request.label))
    );
  }
  return {
    targetName,
    affectedResources:affected
      .slice()
      .sort((a,b) => String(a && a.name || "").localeCompare(String(b && b.name || ""), undefined, { sensitivity:"base" }))
  };
}

function getDeletionKindLabel(kind){
  return ({ resource:"Resource", category:"Category", type:"Type", forGroup:"For group" })[kind] || "Item";
}

const RECOVERY_POINT_SCHEMA_VERSION = 2;
const RECOVERY_POINT_LIMIT = 5;

function normalizeRecoveryPoint(point){
  if(!point || typeof point !== "object" || Array.isArray(point)) return null;
  if(!point.dataSnapshot || typeof point.dataSnapshot !== "object" || Array.isArray(point.dataSnapshot)) return null;
  const savedAt = Date.parse(String(point.savedAt || "")) ? String(point.savedAt) : nowISO();
  const fileName = String(point.fileName || "resource package").trim() || "resource package";
  return {
    id:String(point.id || stablePDFIdFromPath(`${savedAt}:${fileName}`, "recovery")),
    dataSnapshot:cloneDataObject(point.dataSnapshot),
    fileName,
    savedAt,
    packageVersion:normalizePackageVersionValue(
      point.packageVersion != null ? point.packageVersion : point.dataSnapshot.packageVersion
    )
  };
}

const AdminRecoveryStore = Object.freeze({
  load(){
    try{
      const parsed = JSON.parse(localStorage.getItem(PRE_MERGE_STORAGE_KEY) || "null");
      const points = parsed && Array.isArray(parsed.recoveryPoints)
        ? parsed.recoveryPoints
        : (parsed && parsed.dataSnapshot ? [parsed] : []);
      return points
        .map(normalizeRecoveryPoint)
        .filter(Boolean)
        .sort((a, b) => String(b.savedAt).localeCompare(String(a.savedAt)))
        .slice(0, RECOVERY_POINT_LIMIT);
    }catch(_err){
      return [];
    }
  },

  save(points){
    const normalized = (Array.isArray(points) ? points : [])
      .map(normalizeRecoveryPoint)
      .filter(Boolean)
      .sort((a, b) => String(b.savedAt).localeCompare(String(a.savedAt)))
      .slice(0, RECOVERY_POINT_LIMIT);
    let candidates = normalized.slice();
    let lastError = null;
    while(candidates.length){
      try{
        localStorage.setItem(PRE_MERGE_STORAGE_KEY, JSON.stringify({
          schemaVersion:RECOVERY_POINT_SCHEMA_VERSION,
          recoveryPoints:candidates
        }));
        return candidates;
      }catch(err){
        lastError = err;
        if(candidates.length <= 3) break;
        candidates = candidates.slice(0, -1);
      }
    }
    if(!normalized.length){
      localStorage.removeItem(PRE_MERGE_STORAGE_KEY);
      return [];
    }
    throw lastError || new Error("Recovery points could not be saved.");
  },

  add(fileName, snapshot = data){
    const savedAt = nowISO();
    const point = normalizeRecoveryPoint({
      id:`recovery:${savedAt}:${Math.random().toString(16).slice(2, 10)}`,
      dataSnapshot:snapshot,
      fileName,
      savedAt,
      packageVersion:snapshot && snapshot.packageVersion
    });
    const existing = this.load().filter(item => item.id !== point.id);
    return this.save([point, ...existing])[0];
  },

  find(recoveryId){
    const id = String(recoveryId || "");
    return this.load().find(point => point.id === id) || null;
  }
});

function savePreMergeSnapshot(fileName){
  try{
    AdminRecoveryStore.add(String(fileName || "resource package"));
    return true;
  }catch(_err){
    alert("The merge cannot begin because at least three recovery points could not be retained. Free browser storage and try again.");
    return false;
  }
}

function getRecoveryPoints(){
  return AdminRecoveryStore.load();
}

function getPreMergeSnapshot(){
  return getRecoveryPoints()[0] || null;
}

function recoveryPointLabel(point){
  return `${formatLocalDateTime(point && point.savedAt)} · Resource Package ${String(point && point.packageVersion)} · ${String(point && point.fileName || "resource package")}`;
}

function restoreRecoveryPoint(recoveryId){
  const snapshot = AdminRecoveryStore.find(recoveryId);
  if(!snapshot) return;
  if(!confirm(
    `Restore this recovery point?\n\n${recoveryPointLabel(snapshot)}\n\n` +
    "Current edits made after this point will be discarded. The recovery history itself will be retained."
  )) return;
  let restoredData;
  try{
    restoredData = processResourcePackageData(cloneDataObject(snapshot.dataSnapshot), {
      sourceName:`Recovery point for ${snapshot.fileName}`
    }).data;
  }catch(err){
    alert(`This recovery point could not be restored safely:\n\n${formatResourcePackageError(err)}`);
    return;
  }
  data = restoredData;
  localStorage.removeItem(DELETION_REVIEW_STORAGE_KEY);
  clearUndoSnapshot();
  sanitizeFavoriteResourceIds();
  sanitizePrintSelection();
  persist();
  closeDeletionReview();
  closeReferenceModal();
  showToast("Recovery point restored.");
  safeRender();
}

function restorePreMergeState(){
  const latest = getPreMergeSnapshot();
  if(latest) restoreRecoveryPoint(latest.id);
}

function showRecoveryPoints(){
  const points = getRecoveryPoints();
  if(!points.length){
    showToast("There are no recovery points yet.");
    return;
  }
  const modal = getReferenceModal();
  modal.innerHTML = `
    <div class="reference-modal-panel recovery-points-panel" role="dialog" aria-modal="true" aria-labelledby="recoveryPointsTitle">
      <div class="reference-modal-header">
        <div>
          <div id="recoveryPointsTitle" class="reference-modal-title">Pre-merge recovery points</div>
          <div class="reference-modal-subtitle">Newest first · up to ${RECOVERY_POINT_LIMIT} retained</div>
        </div>
        <button class="button reference-modal-close" type="button">Close</button>
      </div>
      <div class="reference-modal-body">
        <p>Restoring replaces current resource data. Review the package version, source filename, and saved time before continuing.</p>
        <div class="recovery-points-list">
          ${points.map(point => `
            <div class="recovery-point-entry">
              <div>
                <strong>Resource Package ${escapeHTML(String(point.packageVersion))}</strong>
                <span>${escapeHTML(point.fileName)}</span>
                <span>${escapeHTML(formatLocalDateTime(point.savedAt))}</span>
              </div>
              <button class="button" type="button" onclick="restoreRecoveryPoint('${escapeHTML(point.id)}')">Restore</button>
            </div>
          `).join("")}
        </div>
      </div>
    </div>
  `;
  const closeBtn = modal.querySelector(".reference-modal-close");
  if(closeBtn) closeBtn.addEventListener("click", closeReferenceModal);
  modal.classList.remove("hidden");
}

function saveDeletionReview(fileName, packageVersion, incomingRequests){
  const requests = mergeDeletionRecords([], incomingRequests, "requestedAt");
  if(!requests.length){
    localStorage.removeItem(DELETION_REVIEW_STORAGE_KEY);
    return null;
  }
  const review = {
    fileName:String(fileName || "resource package"),
    packageVersion:normalizePackageVersionValue(packageVersion),
    mergedAt:nowISO(),
    requests
  };
  localStorage.setItem(DELETION_REVIEW_STORAGE_KEY, JSON.stringify(review));
  return review;
}

function getDeletionReview(){
  try{
    const parsed = JSON.parse(localStorage.getItem(DELETION_REVIEW_STORAGE_KEY) || "null");
    if(!parsed || typeof parsed !== "object") return null;
    parsed.requests = mergeDeletionRecords([], parsed.requests, "requestedAt");
    return parsed;
  }catch(_err){
    return null;
  }
}

function getOutstandingDeletionReview(){
  const review = getDeletionReview();
  if(!review) return null;
  const pendingKeys = new Set((Array.isArray(data.deletionRequests) ? data.deletionRequests : []).map(item => item.key));
  review.requests = review.requests.filter(request => pendingKeys.has(request.key));
  return review.requests.length ? review : null;
}

function closeDeletionReview(){
  const modal = document.getElementById("deletionReviewModal");
  if(modal) modal.remove();
}

function deletionImpactHTML(request){
  const impact = getDeletionImpact(request);
  const names = impact.affectedResources.map(resource => resource.name || "(Unnamed resource)");
  const consequence = request.kind === "resource"
    ? "The resource itself will be removed."
    : names.length
      ? `Affects ${names.length} ${names.length === 1 ? "resource" : "resources"}: ${names.join(", ")}`
      : "No resources are currently affected.";
  return `
    <div class="deletion-review-target"><strong>${escapeHTML(getDeletionKindLabel(request.kind))}:</strong> ${escapeHTML(impact.targetName)}</div>
    <div class="admin-note">${escapeHTML(consequence)}</div>
    ${request.description ? `<div class="admin-note"><strong>Submitted note:</strong> ${escapeHTML(request.description)}</div>` : ""}
  `;
}

function showDeletionReview(){
  closeDeletionReview();
  const review = getOutstandingDeletionReview();
  if(!review){
    showToast("There are no tagged deletions to review.");
    safeRenderAdmin();
    return;
  }
  const modal = document.createElement("div");
  modal.id = "deletionReviewModal";
  modal.className = "reference-modal";
  modal.innerHTML = `
    <div class="reference-modal-panel deletion-review-panel" role="dialog" aria-modal="true" aria-labelledby="deletionReviewTitle">
      <div class="reference-modal-header">
        <div>
          <div id="deletionReviewTitle" class="reference-modal-title">Review tagged deletions</div>
          <div class="reference-modal-subtitle">${escapeHTML(review.fileName)} · Resource Package ${escapeHTML(String(review.packageVersion))}</div>
        </div>
        <button class="button" type="button" id="deletionReviewCloseBtn">Close</button>
      </div>
      <div class="reference-modal-body">
        <p>Review the consequences, then approve the deletions you want applied. Unchecked items will be kept.</p>
        <div class="deletion-review-list">
          ${review.requests.map(request => `
            <label class="deletion-review-item">
              <input type="checkbox" class="deletion-review-checkbox" data-deletion-key="${escapeHTML(request.key)}" checked>
              <span>${deletionImpactHTML(request)}</span>
            </label>
          `).join("")}
        </div>
        <div class="admin-action-row deletion-review-actions">
          <button class="button" type="button" id="deletionReviewPrintBtn">Print proposed deletions</button>
          <span class="spacer"></span>
          <button class="button primary" type="button" id="deletionReviewApproveBtn">Approve selected deletions</button>
        </div>
      </div>
    </div>
  `;
  document.body.appendChild(modal);
  document.getElementById("deletionReviewCloseBtn").onclick = closeDeletionReview;
  document.getElementById("deletionReviewPrintBtn").onclick = printProposedDeletions;
  document.getElementById("deletionReviewApproveBtn").onclick = approveSelectedDeletions;
  modal.addEventListener("click", event => {
    if(event.target === modal) closeDeletionReview();
  });
}

function approveSelectedDeletions(){
  const review = getOutstandingDeletionReview();
  if(!review) return;
  const selectedKeys = new Set(Array.from(document.querySelectorAll(".deletion-review-checkbox:checked"))
    .map(input => input.dataset.deletionKey));
  const approved = review.requests.filter(request => selectedKeys.has(request.key));
  const reviewedKeys = new Set(review.requests.map(request => request.key));
  setUndoSnapshot(approved.length === 1 ? "approved deletion" : "approved deletions");
  data.deletionRequests = (Array.isArray(data.deletionRequests) ? data.deletionRequests : [])
    .filter(request => !reviewedKeys.has(request.key));
  const approvedAt = nowISO();
  const tombstones = approved.map(request => normalizeDeletionRecord({
    ...request,
    deletedAt:approvedAt
  }, "deletedAt")).filter(Boolean);
  data.deletions = mergeDeletionRecords(data.deletions, tombstones, "deletedAt");
  tombstones.forEach(tombstone => {
    const impact = getDeletionImpact(tombstone);
    if(tombstone.kind === "resource"){
      addChangeEntry(createChangeEntry("resource", "removed", tombstone.targetId, impact.targetName, "Approved tagged deletion."));
    }else if(tombstone.kind === "category"){
      addChangeEntry(createChangeEntry("category", "removed", tombstone.targetId, impact.targetName, "Approved tagged deletion."));
    }
  });
  applyDeletionTombstones(data, tombstones);
  normalizeDeletionWorkflowData(data);
  sanitizeFavoriteResourceIds();
  sanitizePrintSelection();
  persist();
  closeDeletionReview();
  showToast(approved.length
    ? `${approved.length} ${approved.length === 1 ? "deletion" : "deletions"} approved.`
    : "All proposed deletions were kept.");
  safeRender();
}

function printProposedDeletions(){
  const review = getOutstandingDeletionReview();
  if(!review) return;
  PrintWorkflow.queue = [];
  PrintWorkflow.currentIndex = -1;
  PrintWorkflow.openPreviewContent(container => {
    const heading = document.createElement("section");
    heading.className = "deletion-report";
    heading.innerHTML = `
      <h1>Proposed Deletions</h1>
      <p><strong>Submitted package:</strong> ${escapeHTML(review.fileName)}</p>
      <p><strong>Resource Package:</strong> ${escapeHTML(String(review.packageVersion))}</p>
      <p><strong>Printed:</strong> ${escapeHTML(new Date().toLocaleString())}</p>
    `;
    review.requests.forEach((request, index) => {

// The functions below support both user search and admin-only "referenced by"
// inspection. A resource can be referenced by long list-style resources, so
// matching uses normalized token phrases instead of raw substring checks.

function getReferenceCategoryEntries(resource){
  const categoryIds = Array.isArray(resource && resource.categories)
    ? resource.categories.map(id => String(id || "")).filter(Boolean)
    : [];
  const categoryIdSet = new Set(categoryIds);
  const entries = [];
  const seen = new Set();

  (Array.isArray(data.categories) ? data.categories : [])
    .slice()
    .sort(compareCategoriesByLabel)
    .forEach((cat, index) => {
      const id = String(cat && cat.id || "");
      if(!categoryIdSet.has(id)) return;
      const label = String(cat && cat.label || id || "Uncategorized");
      const key = label.toLowerCase();
      if(seen.has(key)) return;
      seen.add(key);
      entries.push({ label, order:index });
    });

  categoryIds.forEach(id => {
    if(entries.some(entry => entry.label === id)) return;
    if((data.categories || []).some(cat => String(cat && cat.id || "") === id)) return;
    const key = id.toLowerCase();
    if(seen.has(key)) return;
    seen.add(key);
    entries.push({ label:id, order:9999 });
  });

  if(!entries.length){
    entries.push({ label:"Uncategorized", order:9999 });
  }

  return entries;
}

function normalizeReferenceSearchText(value){
  return String(value || "")
    .toLowerCase()
    .normalize("NFKD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9]+/g, " ")
    .trim()
    .replace(/\s+/g, " ");
}

function getReferenceTokens(value){
  const normalized = normalizeReferenceSearchText(value);
  return normalized ? normalized.split(" ") : [];
}

function textContainsTokenPhrase(text, phrase){
  const needleTokens = getReferenceTokens(phrase);
  const haystackTokens = getReferenceTokens(text);
  if(!needleTokens.length || haystackTokens.length < needleTokens.length) return false;

  for(let i = 0; i <= haystackTokens.length - needleTokens.length; i += 1){
    let matched = true;
    for(let j = 0; j < needleTokens.length; j += 1){
      if(haystackTokens[i + j] !== needleTokens[j]){
        matched = false;
        break;
      }
    }
    if(matched) return true;
  }
  return false;
}

function getSearchTokenForms(value){
  const token = String(value || "");
  const forms = new Set(token ? [token] : []);
  if(!/^[a-z]+$/.test(token) || token.length < 4) return forms;

  if(token.endsWith("ies") && token.length > 4) forms.add(`${token.slice(0, -3)}y`);
  if(token.endsWith("s") && !token.endsWith("ss")) forms.add(token.slice(0, -1));
  if(/(?:ses|xes|zes|ches|shes)$/.test(token)) forms.add(token.slice(0, -2));
  if(token === "housing") forms.add("house");
  if(token === "rental" || token === "rentals") forms.add("rent");
  return forms;
}

function searchTokensMatch(left, right){
  const leftForms = getSearchTokenForms(left);
  const rightForms = getSearchTokenForms(right);
  return Array.from(leftForms).some(form => rightForms.has(form));
}

function searchTextMatchesAllTokens(text, queryTokens){
  const textTokens = getReferenceTokens(text);
  return queryTokens.every(queryToken => textTokens.some(textToken => searchTokensMatch(textToken, queryToken)));
}

function isReferenceNameSearchable(resourceName){
  const rawName = String(resourceName || "").trim();
  if(!rawName) return false;
  if(rawName.length >= 4) return true;
  if(/\s/.test(rawName)) return true;
  return /[A-Z]/.test(rawName) && rawName === rawName.toUpperCase();
}

function informationTextReferencesName(informationText, resourceName){
  if(!isReferenceNameSearchable(resourceName)) return false;
  return textContainsTokenPhrase(informationText, resourceName);
}

function getReferenceSnippet(informationText, resourceName){
  const text = String(informationText || "").replace(/\s+/g, " ").trim();
  if(!text) return "";

  const lowerText = text.toLowerCase();
  const lowerName = String(resourceName || "").toLowerCase();
  const directIndex = lowerName ? lowerText.indexOf(lowerName) : -1;
  const center = directIndex >= 0 ? directIndex : 0;
  const start = Math.max(0, center - 70);
  const end = Math.min(text.length, center + Math.max(lowerName.length, 1) + 90);
  const prefix = start > 0 ? "... " : "";
  const suffix = end < text.length ? " ..." : "";
  return `${prefix}${text.slice(start, end)}${suffix}`;
}

function getResourceCategoryEntriesForSearch(resource){
  const categoryIds = Array.isArray(resource && resource.categories)
    ? resource.categories.map(id => String(id || "")).filter(Boolean)
    : [];
  const categoryIdSet = new Set(categoryIds);
  const entries = [];
  const seen = new Set();

  (Array.isArray(data.categories) ? data.categories : [])
    .slice()
    .sort(compareCategoriesByLabel)
    .forEach((cat, index) => {
      const id = String(cat && cat.id || "");
      if(!categoryIdSet.has(id) || seen.has(id)) return;
      seen.add(id);
      entries.push({
        id,
        label:String(cat && cat.label || id || "Uncategorized"),
        order:index
      });
    });

  categoryIds.forEach(id => {
    if(seen.has(id)) return;
    seen.add(id);
    entries.push({ id, label:id, order:9999 });
  });

  if(resourceMatchesListsHeuristic(resource) && !seen.has(LISTS_CATEGORY_ID)){
    seen.add(LISTS_CATEGORY_ID);
    entries.push({ id:LISTS_CATEGORY_ID, label:"Lists", order:9998 });
  }

  return entries;
}

function getSearchTextTokenEntries(value){
  const text = String(value || "");
  const entries = [];
  const expression = /[A-Za-z0-9\u00c0-\u024f]+/g;
  let match;
  while((match = expression.exec(text))){
    const tokens = getReferenceTokens(match[0]);
    if(!tokens.length) continue;
    entries.push({ token:tokens[0], index:match.index, end:match.index + match[0].length });
  }
  return entries;
}

function findSearchTextMatch(text, queryTokens){
  const entries = getSearchTextTokenEntries(text);
  for(const queryToken of queryTokens){
    const entry = entries.find(candidate => searchTokensMatch(candidate.token, queryToken));
    if(entry) return entry;
  }
  return null;
}

function getCenteredSearchText(text, queryTokens){
  const compact = String(text || "").replace(/\s+/g, " ").trim();
  if(!compact) return "";
  const match = findSearchTextMatch(compact, queryTokens);
  if(!match) return compact.length > 190 ? `${compact.slice(0, 187)}...` : compact;

  let start = Math.max(0, match.index - 75);
  let end = Math.min(compact.length, match.end + 110);
  if(start > 0){
    const nextSpace = compact.indexOf(" ", start);
    if(nextSpace >= 0 && nextSpace < match.index) start = nextSpace + 1;
  }
  if(end < compact.length){
    const previousSpace = compact.lastIndexOf(" ", end);
    if(previousSpace > match.end) end = previousSpace;
  }
  return `${start > 0 ? "..." : ""}${compact.slice(start, end)}${end < compact.length ? "..." : ""}`;
}

function getInformationSearchSectionLabel(informationText, queryTokens){
  const text = String(informationText || "").replace(/\r\n?/g, "\n");
  const match = findSearchTextMatch(text, queryTokens);
  if(!match) return "";

  let offset = 0;
  let sectionLabel = "";
  for(const line of text.split("\n")){
    if(offset > match.index) break;
    const trimmed = line.trim();
    if(trimmed === "---"){
      sectionLabel = "";
    }else{
      const heading = trimmed.match(/^\*\*\s*(.*?)\s*\*\*$/);
      if(heading && heading[1]){
        const label = heading[1].trim();
        const normalizedLabel = normalizeReferenceSearchText(label);
        const structuralHeading = /^(eligibility|services?|services offered|population served|contact|hours|languages?|note)(\b|$)/.test(normalizedLabel);
        if(!structuralHeading) sectionLabel = label;
      }
    }
    offset += line.length + 1;
  }
  return sectionLabel;
}

function getSearchFieldSnippet(field, queryTokens){
  if(field.kind === "name") return "Name match";
  if(field.kind === "category") return `Category: ${field.text}`;
  if(field.kind === "type") return `Type: ${field.text}`;
  if(field.kind === "for") return `For: ${field.text}`;
  if(field.kind === "list") return "Category: Lists";

  const centered = getCenteredSearchText(field.text, queryTokens);
  return centered ? `${field.label}: ${centered}` : `${field.label} match`;
}

function getResourceSearchFields(resource){
  const fields = [{ kind:"name", label:"Name", text:String(resource && resource.name || ""), rank:0 }];
  const categoriesById = new Map((Array.isArray(data.categories) ? data.categories : [])
    .map(category => [String(category && category.id || ""), category]));

  (Array.isArray(resource && resource.categories) ? resource.categories : []).forEach(categoryId => {
    const id = String(categoryId || "");
    const category = categoriesById.get(id);
    fields.push({ kind:"category", label:"Category", text:String(category && category.label || id), rank:1 });
    normalizeCategoryFilters(resource && resource.categoryFilters && resource.categoryFilters[id]).forEach(filter => {
      fields.push({ kind:"type", label:"Type", text:filter, rank:1 });
    });
  });
  if(resourceMatchesListsHeuristic(resource)) fields.push({ kind:"list", label:"Category", text:"Lists", rank:1 });
  normalizeTaxonomyLabels(resource && resource.forGroups).forEach(group => {
    fields.push({ kind:"for", label:"For", text:group, rank:1 });
  });

  fields.push(
    { kind:"description", label:"Description", text:String(resource && resource.description || ""), rank:2 },
    { kind:"information", label:"Information", text:String(resource && resource.informationText || ""), rank:3 },
    { kind:"phone", label:"Phone", text:String(resource && resource.phone || ""), rank:4 },
    { kind:"address", label:"Address", text:String(resource && resource.address || ""), rank:4 },
    { kind:"website", label:"Website", text:String(resource && resource.website || ""), rank:4 },
    { kind:"hours", label:"Hours", text:String(resource && resource.hours || ""), rank:4 }
  );
  getResourcePDFs(resource).forEach(pdf => {
    fields.push({ kind:"pdf", label:"PDF", text:String(pdf && pdf.name || ""), rank:5 });
  });
  return fields.filter(field => getReferenceTokens(field.text).length);
}

function getResourceSearchMatch(resource, queryTokens){
  const fields = getResourceSearchFields(resource);
  const combinedText = fields.map(field => field.text).join(" ");
  if(!searchTextMatchesAllTokens(combinedText, queryTokens)) return null;

  const completeField = fields.find(field => searchTextMatchesAllTokens(field.text, queryTokens));
  if(completeField){
    const sectionLabel = completeField.kind === "information" && resourceMatchesListsHeuristic(resource)
      ? getInformationSearchSectionLabel(completeField.text, queryTokens)
      : "";
    return {
      rank:completeField.rank,
      snippet:getSearchFieldSnippet(completeField, queryTokens),
      sectionLabel,
      fieldLabel:completeField.label
    };
  }

  const matchingFields = fields.filter(field =>
    queryTokens.some(queryToken => searchTextMatchesAllTokens(field.text, [queryToken]))
  );
  const labels = Array.from(new Set(matchingFields.map(field => field.label)));
  const bestRank = matchingFields.reduce((rank, field) => Math.min(rank, field.rank), 9);
  return { rank:10 + bestRank, snippet:`Matches across: ${labels.join(", ")}`, sectionLabel:"", fieldLabel:"Multiple fields" };
}

function buildSearchResults(query){
  const cleanQuery = String(query || "").trim();
  const empty = { query:cleanQuery, mode:"none", items:[] };
  const queryTokens = getReferenceTokens(cleanQuery);
  if(!queryTokens.length) return empty;

  const resources = Array.isArray(data.resources) ? data.resources : [];
  const items = resources.map(resource => {
    const match = getResourceSearchMatch(resource, queryTokens);
    if(!match) return null;
    return {
      resourceId:String(resource && resource.id || ""),
      resourceName:String(resource && resource.name || "(Unnamed resource)"),
      categories:getResourceCategoryEntriesForSearch(resource),
      ...match
    };
  }).filter(Boolean).sort((a, b) => {
    if(a.rank !== b.rank) return a.rank - b.rank;
    return a.resourceName.localeCompare(b.resourceName, undefined, { sensitivity:"base" });
  });

  return { query:cleanQuery, mode:items.length ? "results" : "none", items };
}

function resourceIsListStyle(resource){
  return resourceMatchesListsHeuristic(resource);
}

function findReferencingLists(resourceOrName){
  const targetId = resourceOrName && typeof resourceOrName === "object"
    ? String(resourceOrName.id || "")
    : "";
  const resourceName = resourceOrName && typeof resourceOrName === "object"
    ? resourceOrName.name
    : resourceOrName;
  const needle = String(resourceName || "").trim();
  if(!isReferenceNameSearchable(needle)) return [];

  const matches = [];
  const seen = new Set();
  (Array.isArray(data.resources) ? data.resources : []).forEach(resource => {
    const resourceId = String(resource && resource.id || "");
    if(targetId && resourceId === targetId) return;
    if(!resourceIsListStyle(resource)) return;
    const informationText = String(resource && resource.informationText || "");
    if(!informationTextReferencesName(informationText, needle)) return;

    const listName = String(resource && resource.name || "(Unnamed list)");
    const key = String(resource && resource.id || listName).toLowerCase();
    if(seen.has(key)) return;
    seen.add(key);
    const categoryEntries = getReferenceCategoryEntries(resource);
    matches.push({
      categoryLabels: categoryEntries.map(category => category.label),
      categoryOrder: Math.min(...categoryEntries.map(category => category.order)),
      listName,
      snippet: getReferenceSnippet(informationText, needle)
    });
  });

  return matches.sort((a, b) => {
    if(a.categoryOrder !== b.categoryOrder) return a.categoryOrder - b.categoryOrder;
    return a.listName.localeCompare(b.listName, undefined, { sensitivity:"base" });
  });
}

          ${match && match.snippet ? `<div class="reference-match-snippet">${escapeHTML(match.snippet)}</div>` : ""}
        </div>
      `;
    }).join("")
    : `<p class="reference-empty">No list resources reference this resource.</p>`;

  modal.innerHTML = `
    <div class="reference-modal-panel" role="dialog" aria-modal="true" aria-labelledby="referenceModalTitle" aria-describedby="referenceModalSubtitle">
      <div class="reference-modal-header">
        <div>
          <div id="referenceModalTitle" class="reference-modal-title">Referenced By Lists</div>

        </div>
        <button class="button reference-modal-close" type="button">Close</button>
      </div>
      <div class="reference-modal-body">${bodyHTML}</div>
    </div>
  `;

  const closeBtn = modal.querySelector(".reference-modal-close");
  if(closeBtn) closeBtn.addEventListener("click", closeReferenceModal);
  modal.classList.remove("hidden");
