# Experimental Resource Research Agent overlay for DeepSeek Harness 0.1.
# Keep only server-side web search visible to the model. The process runs in an
# empty temporary workspace as a second boundary against local modification.

- id: system-prompt
  config:
    persona: >-
      You are a careful social-service resource researcher. Research the public web,
      preserve source URLs, distinguish official facts from attributed lived
      experience, and return exactly the structured result the assignment asks for.

- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- id: tool-jobs
  disabled: true
- id: tool-fs
  disabled: true
- id: tool-fs-search
  disabled: true
- id: tool-skill
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: tool-subagent-report
  disabled: true
- id: tool-workflow
  disabled: true
- id: tool-todo
  disabled: true
- id: tool-goal
  disabled: true
- id: tool-ralph
  disabled: true
- id: tool-str-replace-editor
  disabled: true
- id: code-runtime
  disabled: true

- id: tool-web
  config:
    search: true
    fetch: false
    searchMaxResults: 8
    searchTimeoutMs: 60000
