# Temporary approval-gated trace route. Model turns pass through the local
# Trace Console proxy before reaching the locked production Qwen endpoint.

- id: llm-pi-ai
  config:
    providers:
      qwen-trace-local:
        displayName: Traced Local Qwen
        apiKeyEnv: RESOURCE_SCOUT_TRACE_QWEN_TOKEN
        api: openai-completions
        baseURL: http://127.0.0.1:8083/v1
        reasoning: medium
        compat:
          thinkingFormat: openai
          supportsReasoningEffort: true
          supportsUsageInStreaming: true
        timeoutMs: 7200000
        streamIdleTimeoutMs: 7200000
        models:
          - id: mlx-community/Qwen3.8-27B-8bit
            name: Qwen3.8 27B 8-bit through Trace Console
            contextWindow: 65536
            maxTokens: 32768
            input:
              - text
            reasoningEfforts:
              low: low
              medium: medium
              xhigh: xhigh

- id: agent-default-model
  config:
    provider: qwen-trace-local
    model: mlx-community/Qwen3.8-27B-8bit

- id: system-prompt
  config:
    persona: >-
      You are a careful social-service resource researcher. Research the public web,
      preserve source URLs, distinguish official facts from attributed lived
      experience, and return exactly the structured result the assignment asks for.
      For each bounded assignment, use no more than two targeted web searches and
      five web fetches, prioritizing official or direct-provider pages. The tools
      enforce those limits. When a limit is reached, synthesize the best complete
      JSON result from evidence already gathered instead of retrying. Prefer a few
      well-investigated, clearly named programs over broad routing concepts or a
      large list of shallow directory entries.

- id: web
  config:
    searchProvider: ddgs
    fetchProvider: safe-http

- insert:
    - id: web-search-ddgs
      name: '@resource-scout/dsh-web-search-ddgs'
      config:
        maxCalls: 2
    - id: web-fetch-safe
      name: '@resource-scout/dsh-web-fetch-safe'
      config:
        timeoutMs: 30000
        maxBytes: 200000
        maxRedirects: 5
        maxCalls: 5

- id: web-search-deepseek
  disabled: true
- id: tool-web
  disabled: false
  config:
    search: true
    fetch: true
    searchMaxResults: 6
    searchTimeoutMs: 60000
    fetchTimeoutMs: 30000
    fetchMaxOutputChars: 30000
